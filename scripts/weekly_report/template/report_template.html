<body>
<div class="page">
  <div class="masthead">
    <div class="mast-kicker">Headout · Growth · The Weekly <em>Ledger</em></div>
    <h1 id="mastTitle">North America</h1>
    <div class="mast-meta" id="mastMeta"></div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="app"></div>

  <div class="footnote" id="footnote"></div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div id="kmtip"></div>

<script id="report-data" type="application/json">__REPORT_DATA_JSON__</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById('report-data').textContent);
const MARKETS = DATA.markets;
let mi = 0;                       // current market index
const state = { sortKey:'__mover', dir:-1, group:'', search:'', filters:{}, watchOnly:false, rule:'', selMode:false, collapsed:{}, filtersOpen:false, expand:{} };
let ceCtxTotRev = 0;   // total W0 revenue of the currently-filtered rows (for Contrib %); set in paintCETable
let ceMktTotRev = 0;   // total W0 revenue of the WHOLE market (unfiltered) — for the TOTAL row's share-of-market
const sel = new Set();            // CE ids checked in select mode (transient)
let activeView = null;            // index of the currently-applied saved view

/* ---------- formatting ---------- */
const MINUS = '−';
function fmtMoney(v){ if(v==null||isNaN(v)) return '—'; const a=Math.abs(v);
  let s; if(a>=1e6) s='$'+(v/1e6).toFixed(1)+'M'; else if(a>=1e3) s='$'+(v/1e3).toFixed(1)+'K'; else s='$'+Math.round(v);
  return s.replace('$-','-$'); }
function fmtInt(v){ return (v==null||isNaN(v))?'—':Math.round(v).toLocaleString('en-US'); }
function fmtCpc(v){ return (v==null||isNaN(v))?'—':'$'+(+v).toFixed(2); }   // sub-$ metric — needs cents
// Per-CE Omni deep link — 12-week window, filtered to this CE (format from
// monthly rca_helper.build_omni_month_link; weekly date-filter variant).
function omniLink(ceId){
  const f = encodeURIComponent(JSON.stringify({values:[String(ceId)]}));
  const d = encodeURIComponent(JSON.stringify({left_side:'12 complete weeks ago',right_side:'12 weeks'}));
  const c = encodeURIComponent('combined_entity_stats.report_timestamp[week]');
  return 'https://headout.omniapp.co/dashboards/5368ab53?f--iv8lWOuS='+f+'&f--uvd3KWWJ='+d+'&c--fYgxW0mY='+c;
}
function fmtPct(v,dp){ dp=dp==null?1:dp; return (v==null||isNaN(v))?'—':(+v).toFixed(dp)+'%'; }
function fmtDelta(v,dp){ dp=dp==null?1:dp; if(v==null||isNaN(v)) return '—';
  const s=v>0?'+':(v<0?MINUS:''); return s+Math.abs(v).toFixed(dp)+'%'; }
function fmtMoneyDelta(v){ if(v==null||isNaN(v)) return '—';
  const s=v>0?'+':MINUS; return s+fmtMoney(Math.abs(v)); }
function sgn(v){ return (v==null||isNaN(v))?'':(v>0?'pos':(v<0?'neg':'')); }
function esc(s){ return (''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function _ago(iso){
  if(!iso) return '';
  var ms=Date.now()-new Date(iso).getTime(); if(ms<0) return '';
  var m=Math.floor(ms/60000); if(m<60) return m+'m ago';
  var h=Math.floor(m/60); if(h<24) return h+'h ago';
  var d=Math.floor(h/24); return d+'d ago';
}

/* ---------- sparkline (inline SVG, null = gap, auto-scaled) ---------- */
function sparkline(vals, opt){
  opt=opt||{}; const w=opt.w||120,h=opt.h||26,pad=2.5;
  const nums=vals.map(v=>(v==null||isNaN(v))?null:+v);
  const present=nums.filter(v=>v!=null);
  if(present.length<2) return '<svg class="spark" width="'+w+'" height="'+h+'"></svg>';
  const min=Math.min.apply(null,present), max=Math.max.apply(null,present), span=(max-min)||1, n=nums.length;
  const X=i=>pad+(w-2*pad)*(i/(n-1)), Y=v=>h-pad-(h-2*pad)*((v-min)/span);
  let d='',started=false;
  nums.forEach((v,i)=>{ if(v==null){started=false;return;} d+=(started?' L':' M')+X(i).toFixed(1)+' '+Y(v).toFixed(1); started=true; });
  const up = present[present.length-1] >= present[0];
  const color = opt.color || (up?'var(--green)':'var(--red)');
  const last=nums[n-1];
  const dot = last!=null ? '<circle cx="'+X(n-1).toFixed(1)+'" cy="'+Y(last).toFixed(1)+'" r="1.9" fill="'+color+'"/>' : '';
  return '<svg class="spark" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">'+
    '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>'+dot+'</svg>';
}

/* ---------- GM notes (per-week, localStorage cache + Google Sheet + Slack) ----------
   A note is one-per-CE-per-week. The current week is editable; prior weeks
   render as a read-only History trail. Sheet is source of truth; localStorage
   is an instant cache + offline fallback. Save → sheet; Post → Slack thread. */
const NOTES_URL = DATA.notes_url || '';
const NOTES_CHANNELS = DATA.notes_channels || {};
const SYNC_OK = NOTES_URL.length > 0;
let syncStatus = SYNC_OK ? 'idle' : 'off';

// notesData[slug][ce_id] = [ {week_start, note, author, updated, slack_channel,
//                             slack_thread_ts, slack_permalink}, … ]  (any order)
let notesData = {};

function slugKey(){ return MARKETS[mi].meta.market_slug; }
function curWeek(){ return MARKETS[mi].meta.week_start || ''; }
function getAuthor(){ return localStorage.getItem('wr_author')||''; }
function setAuthor(v){ localStorage.setItem('wr_author', v.trim()); }
function channelFor(slug){ return NOTES_CHANNELS[slug] || null; }

function cacheKey(){ return 'wr_notes::'+slugKey(); }
function loadCache(){ try{ notesData[slugKey()] = JSON.parse(localStorage.getItem(cacheKey())||'{}'); }catch(e){ notesData[slugKey()]={}; } }
function saveCache(){ try{ localStorage.setItem(cacheKey(), JSON.stringify(notesData[slugKey()]||{})); }catch(e){} }

function ceNotes(ceId){ const m=notesData[slugKey()]||{}; return m[String(ceId)]||[]; }
function noteFor(ceId){ return ceNotes(ceId).find(n=>String(n.week_start)===String(curWeek())) || null; }
function historyFor(ceId){
  return ceNotes(ceId)
    .filter(n=>String(n.week_start)!==String(curWeek()) && n.note && n.note.trim())
    .sort((a,b)=>String(b.week_start).localeCompare(String(a.week_start)));
}
// "has a note this week" — drives the ● dot in the CE table.
function hasComment(ceId){ const n=noteFor(ceId); return !!(n && n.note && n.note.trim()); }

// ── Bucket actions (per-CE-per-week-per-bucket, localStorage cache + Sheet sync) ──
// actionsData[slug][bucket::ceId] = {checkbox, note, status, owner, updated}
let actionsData = {};
function actionCacheKey(){ return 'wr_actions::'+slugKey()+'::'+curWeek(); }
function loadActionCache(){ try{ actionsData[slugKey()]=JSON.parse(localStorage.getItem(actionCacheKey())||'{}'); }catch(e){ actionsData[slugKey()]={}; } }
function saveActionCache(){ try{ localStorage.setItem(actionCacheKey(), JSON.stringify(actionsData[slugKey()]||{})); }catch(e){} }
function actionK(bucket,ceId){ return bucket+'::'+String(ceId); }
function getAction(bucket,ceId){ return (actionsData[slugKey()]||{})[actionK(bucket,ceId)]||{}; }
function putAction(bucket,ceId,patch){
  const s=slugKey(); actionsData[s]=actionsData[s]||{};
  actionsData[s][actionK(bucket,ceId)]=Object.assign(actionsData[s][actionK(bucket,ceId)]||{},patch,{updated:new Date().toISOString()});
  saveActionCache();
}
function actionEmpty(a){ return !a.checkbox && !a.status && !(a.note&&a.note.trim()); }
function saveAction(ceId,bucket,patch){
  const cur=getAction(bucket,ceId);
  const merged=Object.assign({},cur,patch,{owner:patch.owner||getAuthor(),updated:new Date().toISOString()});
  if(actionEmpty(merged)){
    if(!SYNC_OK){
      const s=slugKey(); if(actionsData[s]) delete actionsData[s][actionK(bucket,ceId)];
      saveActionCache(); return Promise.resolve();
    }
    const dp=new URLSearchParams({action:'action_delete',market_slug:MARKETS[mi].meta.market_slug,
      ce_id:String(ceId),week_start:curWeek(),bucket:bucket});
    return fetch(NOTES_URL+'?'+dp.toString(),{redirect:'follow'}).then(r=>r.json()).then(res=>{
      if(!res||!res.ok) throw new Error('delete failed');
      const s=slugKey(); if(actionsData[s]) delete actionsData[s][actionK(bucket,ceId)];
      saveActionCache();
    });
  }
  if(!SYNC_OK){ putAction(bucket,ceId,merged); return Promise.resolve(); }
  const params=new URLSearchParams({
    action:'action_upsert',market_slug:MARKETS[mi].meta.market_slug,
    ce_id:String(ceId),week_start:curWeek(),bucket:bucket,
    checkbox:merged.checkbox?'true':'',note:merged.note||'',
    status:merged.status||'',owner:merged.owner||getAuthor()
  });
  return fetch(NOTES_URL+'?'+params.toString(),{redirect:'follow'}).then(r=>r.json()).then(res=>{
    if(!res||!res.ok) throw new Error('upsert failed');
    putAction(bucket,ceId,merged);
  });
}
// Re-render the buckets section (#s4) in place after an async action pull — the
// Losing Money / Flux action cells are rendered ONCE by renderApp() from the
// localStorage cache; without this the fresh Sheet-truth pull updates actionsData
// in memory but never repaints, so on a load where localStorage lacked the
// comments (different browser/device, cleared cache, fresh deploy) the cells stay
// blank even though the Sheet has them. Mirrors syncPull()→paintCETable(). (2026-08-03)
function repaintBuckets(){
  const el=document.getElementById('s4');
  if(el) el.outerHTML=renderBuckets(MARKETS[mi]);
}
function actionSyncPull(){
  loadActionCache();
  if(!SYNC_OK) return Promise.resolve();
  const M=MARKETS[mi];
  return fetch(NOTES_URL+'?action=action_list&market='+encodeURIComponent(M.meta.market_slug)+'&week='+encodeURIComponent(curWeek()),{redirect:'follow'})
    .then(r=>r.json())
    .then(data=>{
      const s=M.meta.market_slug; actionsData[s]={};
      (data.actions||[]).forEach(a=>{
        if(!a.ce_id||!a.bucket) return;
        actionsData[s][actionK(a.bucket,a.ce_id)]={
          checkbox:a.checkbox==='true',note:a.note||'',status:a.status||'',
          owner:a.owner||'',updated:a.updated||''
        };
      });
      saveActionCache();
      repaintBuckets();   // Sheet truth landed — repaint so it actually shows
    })
    .catch(()=>{});
}
// prev-week actions (read-only) — "was this CE corrected last week?" chips in Losing Money.
// Pulls week-7d AND week-6d (the -6d key covers records stored under the old Monday-start
// week keys across the Mon→Sun ⇒ Sun→Sat transition; newest `updated` wins on collision).
let actionsPrev={};
function getPrevAction(bucket,ceId){ return (actionsPrev[slugKey()]||{})[actionK(bucket,ceId)]||{}; }
function actionPrevPull(){
  if(!SYNC_OK) return Promise.resolve();
  const M=MARKETS[mi], s=M.meta.market_slug, w=curWeek();
  if(!w) return Promise.resolve();
  const keys=[-7,-6].map(d=>{ const x=new Date(w+'T00:00:00Z'); x.setUTCDate(x.getUTCDate()+d); return x.toISOString().slice(0,10); });
  actionsPrev[s]={};
  return Promise.all(keys.map(k=>fetch(NOTES_URL+'?action=action_list&market='+encodeURIComponent(s)+'&week='+encodeURIComponent(k),{redirect:'follow'})
    .then(r=>r.json())
    .then(data=>{ (data.actions||[]).forEach(a=>{ if(!a.ce_id||!a.bucket) return;
        const kk=actionK(a.bucket,a.ce_id);
        if(!actionsPrev[s][kk] || (a.updated||'')>(actionsPrev[s][kk].updated||''))
          actionsPrev[s][kk]={checkbox:a.checkbox==='true',note:a.note||'',status:a.status||'',owner:a.owner||'',updated:a.updated||''};
      }); })
    .catch(()=>{}))).then(()=>repaintBuckets());   // prev-week chips landed — repaint LM table
}

// ── CE-drawer Action Log — multi-week GM action+comment timeline. Fetches the last ACTLOG_WEEKS
// week-starts' losing_money actions → actionsHist[slug][ceId][week]={status,note,owner}, merged
// with the all-weeks notes (ceNotes) in actionLogFor(). Read-only; store is source of truth.
// The Perf row is a placeholder until perf finals live in the store (Phase 2).
const GM_ACT_LABEL={skip:'Skip',roas_change:'tROAS change',negative_seasonality:'-ve Seasonality',
  pause_review:'Pause & Review',pause:'Pause',scale_down:'Scale down',no_change:'No change',
  troas_new_to_existing:'tROAS: New→Existing',to_review:'To be reviewed'};
const ACTLOG_WEEKS=6;
let actionsHist={};
function actionHistPull(){
  if(!SYNC_OK) return Promise.resolve();
  const M=MARKETS[mi], s=M.meta.market_slug, w=curWeek();
  if(!w) return Promise.resolve();
  const w0=new Date(w+'T00:00:00Z'); const weeks=[];
  for(let i=0;i<ACTLOG_WEEKS;i++){ const x=new Date(w0); x.setUTCDate(x.getUTCDate()-7*i); weeks.push(x.toISOString().slice(0,10)); }
  actionsHist[s]={};
  return Promise.all(weeks.map(wk=>fetch(NOTES_URL+'?action=action_list&market='+encodeURIComponent(s)+'&week='+encodeURIComponent(wk),{redirect:'follow'})
    .then(r=>r.json())
    .then(data=>{ (data.actions||[]).forEach(a=>{ if(!a.ce_id||a.bucket!=='losing_money') return;
        const id=String(a.ce_id); (actionsHist[s][id]=actionsHist[s][id]||{})[wk]={status:a.status||'',note:a.note||'',owner:a.owner||''};
      }); })
    .catch(()=>{})));
}
function actionLogFor(ceId){
  const s=slugKey(), id=String(ceId), byWk={};
  ceNotes(ceId).forEach(n=>{ if(n.week_start){ (byWk[n.week_start]=byWk[n.week_start]||{}).note=n.note||''; if(n.author) byWk[n.week_start].owner=byWk[n.week_start].owner||n.author; } });
  const acts=(actionsHist[s]||{})[id]||{};
  Object.keys(acts).forEach(wk=>{ const b=byWk[wk]=byWk[wk]||{}; b.status=acts[wk].status; if(acts[wk].note&&!b.note) b.note=acts[wk].note; if(acts[wk].owner) b.owner=acts[wk].owner; });
  return Object.keys(byWk).sort().reverse().slice(0,ACTLOG_WEEKS)
    .map(wk=>({week:wk,status:byWk[wk].status||'',note:byWk[wk].note||'',owner:byWk[wk].owner||''}))
    .filter(e=>e.status||e.note);
}
function wrGetAction(ceId){ return getAction('losing_money',ceId).status||''; }
function wrGetFull(ceId){ return getAction('losing_money',ceId); }
// visible "comment required" warning under the note box — created on demand, toggled
function lmWarn(td,on){
  if(!td) return;
  let w=td.querySelector('.lm-warn');
  if(!w && on){
    w=document.createElement('div'); w.className='lm-warn';
    w.textContent='⚠ comment required — action saved, add the why';
    const ta=td.querySelector('.lm-note'); if(ta) ta.insertAdjacentElement('afterend',w);
  }
  if(w) w.style.display=on?'':'none';
}
function wrSetAction(ceId,val,el){
  const td=el&&el.closest&&el.closest('td'), ta=td&&td.querySelector('.lm-note');
  const unfilled=ta&&!lmNoteFilled(ta.value);
  // Comment policy (2026-08-03 final): every action SAVES immediately — an empty comment
  // shows a loud warning + red box until the why is added. Thursday ping is the backstop.
  if(val && unfilled){
    ta.classList.add('lm-note-req');
    if(!(ta.value||'').trim()) ta.value=LM_NOTE_TPL;   // insert the persistent labels
    lmWarn(td,true);
    ta.focus(); try{ ta.setSelectionRange(8,8); }catch(_){ }
  } else {
    if(ta) ta.classList.remove('lm-note-req');
    lmWarn(td,false);
  }
  const prev=wrGetAction(ceId);
  saveAction(ceId,'losing_money',{status:val}).catch(()=>{
    if(el) el.value=prev;
    _flashSaveErr(el);
  });
}
// growth/perf note template — REAL text (not placeholder) so the labels persist while
// both parties write. Template with nothing after the labels counts as NO comment.
const LM_NOTE_TPL='growth: \nperf: ';
function lmNoteFilled(v){ return !!(v||'').replace(/growth\s*:/ig,'').replace(/perf\s*:/ig,'').trim(); }
function wrLmNoteFocus(el){
  if(!(el.value||'').trim()){ el.value=LM_NOTE_TPL; try{ el.setSelectionRange(8,8); }catch(_){ } }
}
function wrLmNote(ceId,val,el){
  var prev=wrGetFull(ceId).note||'';
  if(!lmNoteFilled(val)){            // unmodified/blank template → store nothing, reset box
    val='';
    if(el) el.value='';
  }
  // commit the note AND the (comment-gated) selected action together
  const td=el&&el.closest&&el.closest('td'), sel=td&&td.querySelector('.lm-act');
  const patch={note:val};
  if(sel && lmNoteFilled(val)) patch.status=sel.value;
  saveAction(ceId,'losing_money',patch).catch(()=>{
    if(el) el.value=prev;
    _flashSaveErr(el);
  });
  if(el){
    const owed=!lmNoteFilled(val) && sel && sel.value;   // action chosen, note empty → still owed
    el.classList.toggle('lm-note-req',!!owed);
    lmWarn(td,!!owed);
  }
}
// Fluctuations action dropdown — same shape as Losing Money's (status + mandatory
// comment), but bucket-parameterised since ↓ and ↑ are separate buckets with their own
// option lists. Persists through the same saveAction/Sheet path; no schema change.
function wrFxGet(bucket,ceId){ return getAction(bucket,ceId); }
function wrFxAction(bucket,ceId,val,el){
  const prev=getAction(bucket,ceId).status||'';
  saveAction(ceId,bucket,{status:val}).catch(()=>{
    if(el) el.value=prev;
    _flashSaveErr(el);
  });
  if(!el) return;
  const td=el.closest&&el.closest('td');
  let ta=td&&td.querySelector('.lm-note');
  if(val){
    // reveal the comment box on first selection (it isn't rendered on no-action rows)
    if(!ta){
      ta=document.createElement('textarea');
      ta.className='lm-note';
      ta.onclick=e=>e.stopPropagation();
      ta.onchange=function(){ wrFxNote(bucket,ceId,this.value,this); };
      el.insertAdjacentElement('afterend',ta);
    }
    const need=!(ta.value||'').trim();
    ta.classList.toggle('lm-note-req',need);
    ta.placeholder = need ? 'comment required — why?' : 'why?';
    if(need) ta.focus();
  } else if(ta && !(ta.value||'').trim()){
    ta.remove();   // cleared back to "—" with no comment → collapse the box again
  }
}
function wrFxChk(bucket,ceId,checked,el){
  saveAction(ceId,bucket,{checkbox:checked}).catch(()=>{
    if(el) el.checked=!checked;
    _flashSaveErr(el);
  });
}
function wrFxNote(bucket,ceId,val,el){
  const prev=getAction(bucket,ceId).note||'';
  saveAction(ceId,bucket,{note:val}).catch(()=>{
    if(el) el.value=prev;
    _flashSaveErr(el);
  });
  if(el && (val||'').trim()) el.classList.remove('lm-note-req');
}
function _flashSaveErr(el){
  if(!el) return;
  const orig=el.style.outline;
  el.style.outline='2px solid #e53e3e';
  el.title='Save failed — try again';
  setTimeout(()=>{ el.style.outline=orig; el.title=''; },2500);
}

function putLocal(ceId, patch){
  const slug=slugKey(); notesData[slug]=notesData[slug]||{};
  const arr=notesData[slug][String(ceId)]=notesData[slug][String(ceId)]||[];
  let row=arr.find(n=>String(n.week_start)===String(curWeek()));
  if(!row){ row={week_start:curWeek()}; arr.push(row); }
  Object.assign(row, patch);
  saveCache();
}

function saveNote(ceId, text){
  const now=new Date().toISOString();
  if(!SYNC_OK){ putLocal(ceId, {note:text, author:getAuthor(), updated:now}); return Promise.resolve(); }
  const M=MARKETS[mi], ce=M.ces.find(c=>String(c.ce_id)===String(ceId));
  const params=new URLSearchParams({
    action:'upsert', market_slug:M.meta.market_slug, ce_id:String(ceId),
    ce_name:ce?ce.ce_name:'', week_start:curWeek(), note:text, author:getAuthor()
  });
  syncStatus='syncing'; updateSyncBadge();
  return fetch(NOTES_URL+'?'+params.toString(),{redirect:'follow'})
    .then(r=>r.json()).then(()=>{
      putLocal(ceId, {note:text, author:getAuthor(), updated:now});
      syncStatus='synced'; updateSyncBadge();
    })
    .catch(()=>{ syncStatus='error'; updateSyncBadge(); throw new Error('save failed'); });
}

function postNote(ceId, text){
  if(!SYNC_OK) return Promise.reject('sync off');
  const M=MARKETS[mi], ce=M.ces.find(c=>String(c.ce_id)===String(ceId));
  const ch=channelFor(M.meta.market_slug);
  if(!ch) return Promise.reject('no channel');
  const params=new URLSearchParams({
    action:'post', market_slug:M.meta.market_slug, ce_id:String(ceId),
    ce_name:ce?ce.ce_name:'', week_start:curWeek(), channel:ch.id,
    text:text, author:getAuthor(), report_url:location.href
  });
  return fetch(NOTES_URL+'?'+params.toString(),{redirect:'follow'})
    .then(r=>r.json())
    .then(res=>{
      if(!res.ok) throw new Error(res.error||'post failed');
      putLocal(ceId, {note:text, author:getAuthor(), updated:new Date().toISOString(),
                      slack_channel:ch.id, slack_thread_ts:res.ts, slack_permalink:res.permalink});
      return res;
    });
}

function deleteNote(ceId){
  if(!SYNC_OK){
    const slug=slugKey(), m=notesData[slug]||{};
    if(m[String(ceId)]) m[String(ceId)]=m[String(ceId)].filter(n=>String(n.week_start)!==String(curWeek()));
    saveCache(); return Promise.resolve();
  }
  const M=MARKETS[mi];
  const params=new URLSearchParams({action:'delete', market_slug:M.meta.market_slug,
    ce_id:String(ceId), week_start:curWeek()});
  return fetch(NOTES_URL+'?'+params.toString(),{redirect:'follow'})
    .then(r=>r.json()).then(res=>{
      if(!res||!res.ok) throw new Error('delete failed');
      const slug=slugKey(), m=notesData[slug]||{};
      if(m[String(ceId)]) m[String(ceId)]=m[String(ceId)].filter(n=>String(n.week_start)!==String(curWeek()));
      saveCache();
    });
}

function syncPull(){
  loadCache();
  if(!SYNC_OK){ updateSyncBadge(); return Promise.resolve(); }
  const M=MARKETS[mi]; syncStatus='syncing'; updateSyncBadge();
  return fetch(NOTES_URL+'?action=list&market='+encodeURIComponent(M.meta.market_slug),{redirect:'follow'})
    .then(r=>r.json())
    .then(data=>{
      const slug=M.meta.market_slug; notesData[slug]={};
      (data.notes||[]).forEach(n=>{
        if(!n.ce_id) return;
        const id=String(n.ce_id);
        (notesData[slug][id]=notesData[slug][id]||[]).push({
          week_start:String(n.week_start||''), note:n.note||'', author:n.author||'',
          updated:n.updated||'', slack_channel:n.slack_channel||'',
          slack_thread_ts:n.slack_thread_ts||'', slack_permalink:n.slack_permalink||''
        });
      });
      saveCache();
      syncStatus='synced'; updateSyncBadge(); paintCETable();
    })
    .catch(()=>{ syncStatus='error'; updateSyncBadge(); });
}

function updateSyncBadge(){
  const el=document.getElementById('syncBadge');
  if(!el) return;
  const map={off:'● local only', idle:'', syncing:'↻ syncing…', synced:'✓ synced', error:'⚠ sync failed'};
  const cls={off:'amb', syncing:'amb', synced:'pos', error:'neg'};
  el.textContent=map[syncStatus]||''; el.className='sync-badge '+(cls[syncStatus]||'');
}



/* ---------- BGM customization: per-market saved views / groups / watchlist / rule ----------
   Keys mirror the comments pattern, scoped per market:
     wr_views::{slug}   -> [{name, st:{sortKey,dir,group,search,filters,watchOnly,rule}}]
     wr_groups::{slug}  -> {groupName:[ceId,...]}
     wr_watch::{slug}   -> [ceId,...]
     wr_rule::{slug}    -> "roi<145"  (last-used highlight rule string) */
function slug(){ return MARKETS[mi].meta.market_slug; }
function lsGet(kind, dflt){ try{ const v=localStorage.getItem('wr_'+kind+'::'+slug());
  return v==null?dflt:(JSON.parse(v)??dflt); }catch(e){ return dflt; } }
function lsSet(kind, val){ localStorage.setItem('wr_'+kind+'::'+slug(), JSON.stringify(val)); }
function getViews(){ return lsGet('views', []); }
function setViews(v){ lsSet('views', v); }
function getGroups(){ return lsGet('groups', {}); }
function setGroups(g){ lsSet('groups', g); }
function getWatch(){ return new Set(lsGet('watch', [])); }
function setWatch(s){ lsSet('watch', Array.from(s)); }
function toggleWatch(ceId){ const s=getWatch(); s.has(ceId)?s.delete(ceId):s.add(ceId); setWatch(s); }
function groupOf(ceId){ const g=getGroups(); for(const name in g){ if(g[name].indexOf(ceId)>=0) return name; } return null; }

/* ---------- diagnostic-bucket lookup (from bucket1_fluctuations) ---------- */
// Map ce_id -> {signal, direction} for the current market. Built lazily and
// cached per market index so the group-by / contribution strip stay instant.
let _bucketIdx=null, _bucketIdxMi=-1;
function bucketIndex(){
  if(_bucketIdxMi===mi && _bucketIdx) return _bucketIdx;
  _bucketIdx={}; (MARKETS[mi].bucket1_fluctuations||[]).forEach(f=>{ _bucketIdx[f.ce_id]={signal:f.signal,direction:f.direction}; });
  _bucketIdxMi=mi; return _bucketIdx;
}
function bucketOf(ceId){ return bucketIndex()[ceId]||null; }
// pretty label e.g. "B1 · CVR ▼" for a {signal,direction}
function bucketLabel(b){
  const sig={cvr:'CVR', rpc:'RPC', cm1_per_conv:'CM1/conv'}[b.signal]||b.signal;
  return 'B1 · '+sig+' '+(b.direction==='down'?'▼':'▲');
}
// highlight rule: parse "roi<145" / "wow<-20" / "rev>50000" -> predicate over a ceRow
function ruleFn(){
  const m=(state.rule||'').match(/(roi|wow|rev|yoy|cvr|aov|tr|dwk|spend|cm1|clicks|orders)\s*([<>]=?)\s*(-?\d+\.?\d*)/i);
  if(!m) return null;
  const field=m[1].toLowerCase(), op=m[2], val=parseFloat(m[3]);
  const pick={roi:r=>r.w0.roi_pct, wow:r=>r.wow, rev:r=>r.w0.revenue, yoy:r=>r.w0.yoy_pct,
    cvr:r=>r.w0.cvr_pct, aov:r=>r.w0.aov, tr:r=>r.w0.tr_pct, dwk:r=>r.dwk,
    spend:r=>r.w0.spend, cm1:r=>r.w0.cm1, clicks:r=>r.w0.clicks, orders:r=>r.w0.orders}[field];
  if(!pick) return null;
  return r=>{ const x=pick(r); if(x==null||isNaN(x)) return false;
    return op==='<'?x<val:op==='<='?x<=val:op==='>'?x>val:op==='>='?x>=val:false; };
}

/* ---------- per-CE derived W0/W1 row ---------- */
function ceRow(ce){
  const wk=ce.weekly, w0=wk[wk.length-1], w1=wk[wk.length-2];
  const wow = (w1&&w1.revenue)? (w0.revenue-w1.revenue)/w1.revenue*100 : null;
  const dwk = w0.revenue - ((w1&&w1.revenue)||0);
  return {ce:ce, w0:w0, w1:w1, wow:wow, dwk:dwk};
}

/* =====================================================================
   SECTION 1 — headlines + top movers + market sparkline
   ===================================================================== */
// SECTION 1 — Market header (merged: raw headline + structural dual-clock +
// dual-lens movers + themes). One header, not two — the structural and raw
// views live together so their DIVERGENCE (e.g. Cruises-Chicago −$3.3K raw but
// −$29.7K structural) is the signal, instead of two overlapping mover lists.
function renderHead(M){
  const h = M.market_summary.headlines;
  const wh = h.week_header || null;       // structural engine (may be absent on old snapshots)
  const wkly = M.market_summary.weekly;
  const nW = wkly.length;
  const w0rev = nW ? wkly[nW-1].revenue : null;
  const w1rev = nW>1 ? wkly[nW-2].revenue : null;
  const wowAbs = (w0rev!=null&&w1rev!=null) ? w0rev-w1rev : null;
  function trailing4wRoi(endIdx){
    let cm=0, sp=0, any=false;
    for(let i=endIdx-3;i<=endIdx;i++){ if(i<0||i>=nW) continue; const w=wkly[i];
      if(w.spend){ sp+=w.spend; any=true; } if(w.cm1){ cm+=w.cm1; } }
    return (any&&sp) ? cm/sp*100 : null;
  }
  const roiT4 = trailing4wRoi(nW-1), roiT4prev = trailing4wRoi(nW-2);
  const roiDeltaPP = (roiT4!=null&&roiT4prev!=null) ? roiT4-roiT4prev : null;
  const ppChip = roiDeltaPP==null ? '' :
    ' <span class="'+sgn(roiDeltaPP)+'" style="font-weight:600">('+
    (roiDeltaPP>0?'+':MINUS)+Math.abs(roiDeltaPP).toFixed(1)+'pp)</span>';

  // Trend movers: one directional number per row (the bigger move in the card's
  // direction), labelled with its lens (4-WK = vs 4-week avg · WoW = vs last week),
  // plus a seasonal tag vs LY. Both numbers are in the hover.
  const tagCls = t => t==='against season'?'against':t==='seasonal'?'seasonal':t==='mostly TY'?'mostly-ty':'no-ly';
  const MVHEAD='<div class="mvh"><span></span><span>Combined Entity</span><span>Δ move</span><span>vs LY</span></div>';
  const mvT = (c,dir,i)=>{
    const t=c.delta_4w, r=c.raw_wow;
    const prim = dir==='drop' ? Math.min(t,r) : Math.max(t,r);
    const other = (prim===t) ? r : t;
    const lens = (prim===t) ? '4-wk' : 'WoW', otherLens = (prim===t) ? 'WoW' : '4-wk';
    // second line only when the two lenses disagree in direction (choppy CE)
    const diverge = other!=null && Math.abs(other)>=100 && (prim>=0)!==(other>=0);
    const altLine = diverge ? '<span class="alt">'+fmtMoneyDelta(other)+'<span class="lens">'+otherLens+'</span></span>' : '';
    return '<div class="mvr"><span class="rk">'+(i+1)+'</span>'+
      '<span class="nm" data-ce="'+esc(c.ce_id)+'">'+esc(c.ce_name)+'</span>'+
      '<span class="st"><span class="prim '+sgn(prim)+'">'+fmtMoneyDelta(prim)+'<span class="lens">'+lens+'</span></span>'+altLine+'</span>'+
      (c.tag?'<span class="tag '+tagCls(c.tag)+'">'+esc(c.tag)+'</span>':'<span class="tag no-ly">—</span>')+'</div>'; };
  // fallback mover (no trend engine): raw only
  const mvR = (m,i)=> '<div class="mover"><span class="rk">'+(i+1)+'</span>'+
     '<span class="nm" data-ce="'+esc(m.ce_id)+'">'+esc(m.ce_name)+'</span>'+
     '<span class="dv '+sgn(m.delta_wow)+'">'+fmtMoneyDelta(m.delta_wow)+'</span></div>';

  let drops, gains, moverSub;
  if(wh && wh.trend){
    const dr=(wh.trend.top_droppers||[]).slice(0,10).map((c,i)=>mvT(c,'drop',i)).join('');
    const gn=(wh.trend.top_gainers||[]).slice(0,10).map((c,i)=>mvT(c,'gain',i)).join('');
    drops = dr ? MVHEAD+dr : ''; gains = gn ? MVHEAD+gn : '';
    moverSub='biggest move · 4-wk or WoW';
  } else {
    drops=(h.top_drops||[]).map(mvR).join(''); gains=(h.top_gainers||[]).map(mvR).join('');
    moverSub='Δ rev WoW';
  }
  const moverNote = (wh&&wh.trend) ?
    '<div class="sub" style="margin-top:11px;font-size:10px;line-height:1.55;color:var(--ink-faint)">'+
      '<b>Δ move</b> = the bigger swing, tagged <b>4-WK</b> (vs 4-week avg) or <b>WoW</b> (vs last week); '+
      'a muted second line appears only when the two disagree (up on one, down on the other). '+
      '<b>vs LY</b>: seasonal = last year moved the same way · '+
      '<span style="color:var(--amber)">against season</span> = opposite, investigate · mostly TY = real shift</div>' : '';

  // Plain-language read — translate the dual-clock into one sentence a BGM gets
  // instantly (the "so what", not the jargon). This is the header's headline.
  function plainRead(wh){
    const s=wh.structural, wow=h.wow_pct, tr=wh.trend||{};
    const rawTxt = (wow==null) ? 'moved' :
      Math.abs(wow)<2 ? 'roughly flat ('+fmtDelta(wow)+' WoW)' :
      (wow>0?'up ':'down ')+fmtDelta(Math.abs(wow))+' WoW';
    const pool = s.net_usd<0 ? (tr.top_droppers||[]) : (tr.top_gainers||[]);
    const names = pool.slice(0,2).map(c=>esc(c.ce_name));
    const drv = names.length ? ' — mostly '+names.join(' and ') : '';
    if(s.net_usd<0)
      return 'Revenue is <b>'+rawTxt+'</b>, but structurally <b class="neg">'+fmtMoney(Math.abs(s.net_usd))+' behind</b> last year’s seasonal ramp'+drv+'.';
    return 'Revenue is <b>'+rawTxt+'</b>, and structurally <b class="pos">'+fmtMoney(s.net_usd)+' ahead</b> of last year’s ramp'+drv+'.';
  }
  const verdict = wh ? (
      '<div class="bignum" style="font-size:20px;line-height:1.15;margin:2px 0 6px">'+esc(wh.dual_clock_label)+'</div>'+
      '<div style="font-size:13.5px;line-height:1.5;color:var(--ink-soft);margin-bottom:10px">'+plainRead(wh)+'</div>'
    ) : '';
  // N80 counts, hover to reveal the CEs behind them (native title tooltip).
  const lossN = wh ? wh.structural.n80_loss : 0, gainN = wh ? wh.structural.n80_gain : 0;
  const lossTip = wh&&wh.trend ? esc((wh.trend.top_droppers||[]).slice(0,lossN).map(c=>c.ce_name).join(', ')) : '';
  const gTop = wh&&wh.trend ? (wh.trend.top_gainers||[]).slice(0,10).map(c=>c.ce_name) : [];
  const gainTip = wh ? esc(gTop.join(', ')+(gainN>gTop.length?', …+'+(gainN-gTop.length)+' more':'')) : '';
  const hov = 'cursor:help;border-bottom:1px dotted var(--ink-faint)';
  const structRows = wh ? (
      '<div class="clockrow"><span>Structural net (vs LY ramp)</span><b class="'+sgn(wh.structural.net_usd)+'">'+fmtMoneyDelta(wh.structural.net_usd)+
        ' <span class="sub" style="font-weight:500">(gains +'+fmtMoney(wh.structural.gains_usd)+' · losses '+MINUS+fmtMoney(wh.structural.losses_usd)+')</span></b></div>'+
      '<div class="clockrow"><span>Concentration (N80) <span class="sub">hover for CEs</span></span><b>'+
        '<span title="'+lossTip+'" style="'+hov+'">'+lossN+' CEs</span> = 80% of loss · '+
        '<span title="'+gainTip+'" style="'+hov+'">'+gainN+'</span> of gains</b></div>'
    ) : '';
  const disagree = (wh && wh.clocks_disagree) ? '<div class="sub" style="margin-top:6px;color:var(--amber)">⚠ clocks disagree — raw & structural point opposite ways</div>' : '';


  // Headout aggregate only: per-market breakdown of the portfolio total + each market's share of the WoW move.
  const mb = M.market_breakdown;
  const mbHidden = (M.meta && M.meta.market_breakdown_hidden) || 0;
  const mbHiddenNote = mbHidden ? ' · '+mbHidden+' dormant $0 markets hidden' : '';
  const mbHtml = (mb && mb.length) ?
    '<div style="margin-top:18px"><div class="dr-sec-t">Market breakdown · '+mb.length+' markets · share of the Headout WoW move'+mbHiddenNote+'</div>'+
    '<div class="tablewrap"><table><thead><tr>'+
      '<th class="stick">Market</th><th class="num">Revenue W0</th><th class="num">WoW</th><th class="num">YoY</th><th class="num">ROI</th><th class="num">Δ Rev wk</th><th class="num">% of move</th>'+
    '</tr></thead><tbody>'+
    mb.map(r=>'<tr class="cerow"><td class="ce stick"><span class="cn">'+esc(r.market)+'</span></td>'+
      '<td class="num">'+fmtMoney(r.revenue_w0)+'</td>'+
      '<td class="num '+sgn(r.wow_pct)+'">'+fmtDelta(r.wow_pct)+'</td>'+
      '<td class="num '+sgn(r.yoy_pct)+'">'+fmtDelta(r.yoy_pct)+'</td>'+
      '<td class="num">'+fmtPct(r.roi_pct,0)+'</td>'+
      '<td class="num '+sgn(r.delta_abs)+'">'+fmtMoneyDelta(r.delta_abs)+'</td>'+
      '<td class="num">'+fmtDelta(r.contrib_pct,0)+'</td></tr>').join('')+
    '</tbody></table></div></div>' : '';
  return ''+
  '<section id="s1"><div class="sec-head"><span class="sec-num">1</span><h2>Market headlines</h2>'+
    '<span class="sub">week of '+esc(M.meta.week_start)+' · raw vs structural (LY seasonality)</span></div>'+
  '<div class="head-grid">'+
    '<div class="card click" data-market-drawer="1" role="button" tabindex="0" aria-label="Open market headline detail">'+
      '<span class="hint">▸ click for detail</span>'+
      '<h3>Revenue W0 · verdict</h3>'+
      '<div class="bignum">'+fmtMoney(h.revenue_w0)+'</div>'+
      verdict+
      '<div class="clockrow"><span>WoW Δ (raw)</span><b class="'+sgn(wowAbs)+'">'+fmtMoneyDelta(wowAbs)+' · '+fmtDelta(h.wow_pct)+'</b></div>'+
      '<div class="clockrow"><span>YoY (−364d, weekday-aligned)</span><b class="'+sgn(h.yoy_pct)+'">'+fmtDelta(h.yoy_pct)+'</b></div>'+
      structRows+
      '<div class="clockrow"><span>ROI1 (trailing 4w)</span><b>'+fmtPct(roiT4,0)+ppChip+'</b></div>'+
      '<div class="spark-wrap">'+sparkline(wkly.map(x=>x.revenue),{w:340,h:52,color:'var(--blue)'})+'</div>'+
      disagree+
    '</div>'+
    '<div class="card movers"><h3>Top drops <span class="n">· '+moverSub+'</span></h3>'+
      (drops||'<div class="emptystate">No drops this week <b>✅</b></div>')+
      moverNote+'</div>'+
    '<div class="card movers"><h3>Top gains <span class="n">· '+moverSub+'</span></h3>'+
      (gains||'<div class="emptystate">No gains this week</div>')+
      moverNote+'</div>'+
  '</div>'+mbHtml+'</section>';
}

/* =====================================================================
   SECTION 2 — WoW follow-up snapshot
   ===================================================================== */
function statusChip(s){
  const t=(s||'').toLowerCase();
  let c='ghost';
  if(t.indexOf('recover')>=0||t.indexOf('resolved')>=0) c='green';
  else if(t.indexOf('wors')>=0) c='red';
  else if(t.indexOf('soft')>=0||t.indexOf('still')>=0) c='amber';
  return '<span class="chip '+c+'">'+esc(s)+'</span>';
}
/* ---------- market review — localStorage cache + shared-Sheet persistence (week-keyed) ----------
   Persisted to the notes/actions store via the existing action endpoint, keyed by
   (market_slug, week_start) with a sentinel ce_id + bucket='market_review' — so a review survives
   across users/devices and each week keeps its own, with prior weeks shown as history. localStorage
   is the offline cache; the Sheet is source-of-truth (marketReviewPull reconciles on load/switch).
   bucket='market_review' keeps these out of the losing_money consumers (perf export, drawer log). */
const MR_CE='__market__', MR_BUCKET='market_review', MR_WEEKS=6;
let mrHistory={}, mrTimer=null;
function mrKey(wk){ return 'wr_market_review::'+MARKETS[mi].meta.market_slug+'::'+(wk||curWeek()); }
function getMarketReview(wk){ try{ return JSON.parse(localStorage.getItem(mrKey(wk))||'null'); }catch(e){ return null; } }
function saveMarketReview(text){
  const wk=curWeek(), t=(text||'').trim();
  if(t) localStorage.setItem(mrKey(wk), JSON.stringify({text:text, updated:new Date().toISOString()}));
  else localStorage.removeItem(mrKey(wk));
  if(!SYNC_OK) return Promise.resolve();
  const p = t
    ? {action:'action_upsert',market_slug:slugKey(),ce_id:MR_CE,week_start:wk,bucket:MR_BUCKET,checkbox:'',note:text,status:'',owner:getAuthor()}
    : {action:'action_delete',market_slug:slugKey(),ce_id:MR_CE,week_start:wk,bucket:MR_BUCKET};
  return fetch(NOTES_URL+'?'+new URLSearchParams(p).toString(),{redirect:'follow'}).then(r=>r.json()).catch(()=>({}));
}
/* reconcile localStorage with Sheet-truth for the current week + prior MR_WEEKS; repaint if mounted */
function marketReviewPull(){
  if(!SYNC_OK) return Promise.resolve();
  const s=slugKey(), w=curWeek(); if(!w) return Promise.resolve();
  const w0=new Date(w+'T00:00:00Z'), weeks=[];
  for(let i=0;i<MR_WEEKS;i++){ const x=new Date(w0); x.setUTCDate(x.getUTCDate()-7*i); weeks.push(x.toISOString().slice(0,10)); }
  mrHistory={};
  return Promise.all(weeks.map(wk=>fetch(NOTES_URL+'?action=action_list&market='+encodeURIComponent(s)+'&week='+encodeURIComponent(wk),{redirect:'follow'})
      .then(r=>r.json())
      .then(d=>{ const rev=(d.actions||[]).find(a=>String(a.ce_id)===MR_CE&&a.bucket===MR_BUCKET);
        if(rev&&(rev.note||'').trim()){ mrHistory[wk]={text:rev.note,updated:rev.updated||'',owner:rev.owner||''};
          localStorage.setItem(mrKey(wk), JSON.stringify({text:rev.note,updated:rev.updated||''})); } })
      .catch(()=>{})))
    .then(()=>{ const ta=document.getElementById('mrText');
      const cur=mrHistory[curWeek()];
      if(ta && cur && cur.text!==ta.value){ ta.value=cur.text;
        const el=document.getElementById('mrSaved'); if(el) el.textContent='saved '+new Date(cur.updated).toLocaleString(); }
      paintMrHistory(); });
}
function mrHistoryHtml(){
  const wks=Object.keys(mrHistory).filter(wk=>wk!==curWeek()).sort().reverse();

function passesFilters(r){
  if(state.watchOnly && !getWatch().has(r.ce.ce_id)) return false;
  if(state.search){
    const q=state.search.toLowerCase();
    const md=r.ce.metadata;
    const hay=(r.ce.ce_name+' '+r.ce.ce_id+' '+(md.city||'')+' '+(md.category||'')+' '+(md.subcategory||'')).toLowerCase();
    if(hay.indexOf(q)<0) return false;
  }
  const bsel=state.filters.__bkt;
  if(bsel && bsel.length){ const m=bucketMembers()[r.ce.ce_id]||{}; if(!bsel.some(t=>m[t])) return false; }
  for(const key in state.filters){
    if(key==='__bkt') continue;
    const sel=state.filters[key];
    if(sel && sel.length){ if(sel.indexOf(r.ce.metadata[key])<0) return false; }
  }
  return true;
}

function sortRows(rows){
  const k=state.sortKey, dir=state.dir;
  let sv;
  if(k==='__mover') sv=r=>Math.abs(r.dwk);
  else {
    const sc=STATIC_COLS.find(c=>c.k===k);
    if(sc&&sc.sv) sv=sc.sv;
    else { const mc=METRIC_COLS.find(c=>c.k===k); sv = mc ? (r=>mW0(r,mc)) : (r=>0); }
  }
  return rows.slice().sort((a,a2)=>{
    let x=sv(a), y=sv(a2);
    const xn=(x==null||(typeof x==='number'&&isNaN(x))), yn=(y==null||(typeof y==='number'&&isNaN(y)));
    if(xn&&yn) return 0; if(xn) return 1; if(yn) return -1;  // nulls always last
    if(typeof x==='string') return dir*x.localeCompare(y);
    return dir*(x-y);
  });
}

// Σ-based aggregation of the raw components for one period (pick returns the
// weekly row: r.w0 | r.w1 | lyRow(r)). Ratio metrics recompute as Σnum/Σden —
// never an average of per-CE ratios.
function _aggPeriod(rows, pick){
  const a={rev:0,ord:0,clk:0,pclk:0,spd:0,cpw:0,cm1:0,gbv:0,gbvC:0,adConv:0,organic:0,prev:0};
  rows.forEach(r=>{ const w=pick(r); if(!w) return;
    a.rev+=w.revenue||0; a.ord+=w.orders||0; a.clk+=w.clicks||0; a.pclk+=w.paid_clicks||0;
    a.spd+=w.spend||0; a.cpw+=w.coupon_wallet||0; a.cm1+=w.cm1||0; a.gbv+=w.gbv||0;
    a.gbvC+=w.gbv_completed||0; a.adConv+=w.ad_conversions||0; a.organic+=w.organic_gbv||0;
    a.prev+=w.paid_revenue||0; });   // prev = paid-attributed net revenue (for RPC)
  return a;
}
function _metricVal(a,k){ switch(k){
  case 'rev':return a.rev; case 'orders':return a.ord; case 'clicks':return a.clk;
  case 'cpc':return a.pclk?a.spd/a.pclk:null; case 'cvr':return a.clk?a.adConv/a.clk*100:null;
  case 'aov':return a.ord?a.gbv/a.ord:null; case 'tr':return a.gbvC?a.rev/a.gbvC*100:null;
  case 'cr':return a.gbv?a.gbvC/a.gbv*100:null;
  case 'rpc':return a.pclk?a.prev/a.pclk:null;   // paid-attributed net revenue ÷ paid clicks
  case 'spend':return a.spd; case 'cm1':return a.cm1; case 'cm2':return a.prev-a.spd;
  case 'roi':return (a.spd+a.cpw)?a.cm1/(a.spd+a.cpw)*100:null;
  case 'paid':return a.gbvC?Math.max(0,Math.min(100,100*(1-a.organic/a.gbvC))):null;
  default:return null; } }

// group key for a row under the current group-by (metadata dim, "My groups",
// or diagnostic bucket). Returns the raw group *value* (the collapse key is
// "<groupDim>|<value>").
function groupValueOf(r){
  const gk=state.group;
  if(gk==='__mygrp') return groupOf(r.ce.ce_id)||'— ungrouped';
  if(gk==='__bucket'){ const b=bucketOf(r.ce.ce_id); return b?bucketLabel(b):'— not flagged'; }
  return r.ce.metadata[gk]||'—';
}

  const rows=MARKETS[mi].ces.map(ceRow).filter(passesFilters);

function toggleAllGroups(){

}

function paintCETable(){
  const M=MARKETS[mi];
  let rows = M.ces.map(ceRow).filter(passesFilters);
  // total filtered W0 revenue — powers the Contrib % column + group contrib in
  // subtotals/strip. Set before any row/subtotal render reads it.
  ceCtxTotRev = rows.reduce((s,r)=>s+(r.w0.revenue||0),0);
  const allRows = M.ces.map(ceRow);
  ceMktTotRev = allRows.reduce((s,r)=>s+(r.w0.revenue||0),0);   // full-market denom for TOTAL row
  const byAbs = allRows.slice().sort((a,b)=>Math.abs(b.dwk)-Math.abs(a.dwk));
  const topMovers={}; byAbs.slice(0,10).forEach(r=>{ topMovers[r.ce.ce_id]= r.dwk>=0?'up':'down'; });

  const rf=ruleFn();

  // header — 2 rows: metric names (with expand toggles) + sub-label row (only
  // when a metric is expanded). Overall/Paid split is shown by the divider
  // (gdiv) before the first paid column; the "Paid" context lives in tooltips.
  const arrow=c=>{
    if(state.sortKey===c) return '<span class="ar">'+(state.dir<0?'▼':'▲')+'</span>';
    if(state.sortKey==='__mover'&&c==='rev') return '<span class="ar">↕</span>';
    return '';
  };
  const firstPaid=(METRIC_COLS.find(m=>m.grp==='paid')||{}).k;
  const dv=m=>m.k===firstPaid?' gdiv':'';   // divider before the first paid col
  const anyExp=anyMetricExpanded();
  let r1=(state.selMode?'<th class="selcol stick" rowspan="2"></th>':'');
  STATIC_COLS.forEach(c=>{
    const isSort=c.sort!==false;
    r1+='<th rowspan="2" class="'+(c.num?'num ':'')+(c.stick?'stick ':'')+(isSort?'sortable':'')+'"'+
      (isSort?' data-sort="'+c.k+'"':'')+(c.tip?' title="'+esc(c.tip)+'"':'')+'>'+esc(c.label)+arrow(c.k)+'</th>';
  });
  METRIC_COLS.forEach(m=>{
    const ex=state.expand[m.k], tog='<span class="mtog" data-expand="'+m.k+'" title="'+(ex?'collapse':'expand W0/W-1/Δ/YoY')+'">'+(ex?'&gt;&lt;':'&lt;&gt;')+'</span>';
    const ti=m.tip?' title="'+esc(m.tip)+'"':'';
    const pc=(m.grp==='paid')?' paidcol':'';   // whole paid block gets a subtle tint
    if(ex) r1+='<th class="num mexp'+dv(m)+pc+'" colspan="5"'+ti+'><span class="sortable" data-sort="'+m.k+'">'+esc(m.label)+arrow(m.k)+'</span> '+tog+'</th>';
    else   r1+='<th rowspan="2" class="num sortable mcolh'+dv(m)+pc+'" data-sort="'+m.k+'"'+ti+'>'+esc(m.label)+arrow(m.k)+' '+tog+'</th>';
  });
  let r2='';
  METRIC_COLS.forEach(m=>{ if(state.expand[m.k]){ const pc=(m.grp==='paid')?' paidcol':''; r2+='<th class="num sub exp0'+dv(m)+pc+'">W0</th><th class="num sub'+pc+'">W-1</th><th class="num sub'+pc+'">Change</th><th class="num sub'+pc+'">WoW %</th><th class="num sub exp1'+pc+'">YoY %</th>'; } });
  let head='<tr class="hrow1">'+r1+'</tr>'+(anyExp?'<tr class="hrow2">'+r2+'</tr>':'');

  const gspan=colCount();
  let body=totalRowHtml(rows);   // grand total for the current filter, pinned at top
  if(state.group){
    const gk=state.group;
    // "My groups" clusters by custom-group membership, "Diagnostic bucket" by
    // the B1 signal+direction, others by metadata value.
    const glabel = gk==='__mygrp' ? 'my group' : (gk==='__bucket' ? 'bucket' : gk);
    const groups={};
    rows.forEach(r=>{ const v=groupValueOf(r); (groups[v]=groups[v]||[]).push(r); });
    // sort group headers by descending subtotal revenue (matches mockup)
    const grev=gv=>groups[gv].reduce((s,r)=>s+(r.w0.revenue||0),0);
    Object.keys(groups).sort((a,b)=>grev(b)-grev(a)).forEach(gv=>{
      const gr=sortRows(groups[gv]);
      // collapsed state keyed by "groupByDim|groupValue" (survives re-renders this session)
      const ckey=gk+'|'+gv, open=!state.collapsed[ckey];
      // combined header+subtotal row (1 line per group); members below when open
      body+=groupRowHtml(ckey, glabel, gv, gr, open);
      if(open) body+=gr.map(r=>rowHtml(r,topMovers,rf)).join('');
    });
  } else {
    body+=sortRows(rows).map(r=>rowHtml(r,topMovers,rf)).join('');   // += keeps the TOTAL row
  }

  document.getElementById('ceTableWrap').innerHTML='<table><thead>'+head+'</thead><tbody>'+body+'</tbody></table>';
  renderContributionStrip(rows);
  const totRev=rows.reduce((s,r)=>s+(r.w0.revenue||0),0);
  const hotN=rf?rows.filter(rf).length:0;
  document.getElementById('ceCount').innerHTML=
    'Showing <b>'+rows.length+'</b> of <b>'+M.ces.length+'</b> CEs · '+
    'filtered revenue <b>'+fmtMoney(totRev)+'</b>'+
    (state.sortKey==='__mover'?' · sorted by <b>|Δ rev WoW|</b> (top movers first)':'')+
    (rf?' · <b>'+hotN+'</b> row(s) match rule <b>'+esc(state.rule)+'</b>':'')+
    ' · <b>'+getWatch().size+'</b> watched · <b>'+Object.keys(getGroups()).length+'</b> custom group(s)';
}

/* ---------- (P2) contribution strip — per-group Δ-rev-WoW diverging bars ----------
   Only shown when grouped. Bar length ∝ |Δ rev WoW|; the index badge =
   share-of-move ÷ share-of-revenue (>1.5× = the group punches above its weight).
   Clicking a bar expands + scrolls to its group. */
function renderContributionStrip(rows){
  const box=document.getElementById('ceStrip'); if(!box) return;
  if(!state.group){ box.innerHTML=''; return; }
  const gk=state.group;
  const glabel = gk==='__mygrp' ? 'my group' : (gk==='__bucket' ? 'diagnostic bucket' : gk);
  const groups={};
  rows.forEach(r=>{ const v=groupValueOf(r); (groups[v]=groups[v]||[]).push(r); });
  const stats=Object.keys(groups).map(gv=>{
    const gr=groups[gv];
    const rev0=gr.reduce((s,r)=>s+(r.w0.revenue||0),0);
    const dwk=gr.reduce((s,r)=>s+(r.dwk||0),0);
    return {val:gv, rev0:rev0, dwk:dwk};
  });
  const totRev=stats.reduce((s,g)=>s+g.rev0,0)||1;
  const totAbsMove=stats.reduce((s,g)=>s+Math.abs(g.dwk),0)||1;
  // MATERIALITY FLOOR: the "punch above weight" index = share-of-move ÷
  // share-of-revenue is unstable for tiny-revenue groups — a small $ move on a
  // near-zero base explodes the ratio (e.g. Unmanaged $3.8K → 35×, pure noise).
  // Show the index only for groups holding >=3% of revenue; everyone gets the
  // always-stable contribution-% (share of revenue).
  const IDX_MIN_REV_SHARE=0.03;
  stats.forEach(g=>{ g.shRev=g.rev0/totRev;
    const shMove=Math.abs(g.dwk)/totAbsMove;
    g.idx = g.shRev>=IDX_MIN_REV_SHARE ? shMove/g.shRev : null; });
  const maxAbs=Math.max.apply(null,stats.map(g=>Math.abs(g.dwk)).concat([1]));
  const bars=stats.slice().sort((a,b)=>Math.abs(b.dwk)-Math.abs(a.dwk)).slice(0,10).map(g=>{
    const neg=g.dwk<0, w=(Math.abs(g.dwk)/maxAbs*48).toFixed(1);

      '<span class="k">'+esc(g.val)+'</span>'+
      '<span class="strack"><span class="mid"></span><span class="sfill '+(neg?'n':'p')+'" style="width:'+w+'%"></span></span>'+
      '<span class="d '+sgn(g.dwk)+'">'+fmtMoneyDelta(g.dwk)+
        '<span class="idx mute" title="contribution to revenue">'+cpct.toFixed(cpct>=10?0:1)+'% rev</span>'+

  }).join('');
  box.innerHTML='<div class="strip"><div class="sh">What drove the week — by <b>'+esc(glabel)+
    '</b> · Δ Rev WoW <span class="muted">% rev = contribution to revenue · idx = share-of-move ÷ share-of-revenue (groups ≥3% rev only)</span></div>'+
    '<div class="sbars">'+bars+'</div></div>';
}

  state.dir=s.dir==null?-1:s.dir; state.watchOnly=!!s.watchOnly; state.rule=s.rule||'';

function saveCurrentView(){

// SECTION 4 — Diagnostic buckets (B1 ROI/CM2 · B2 CM1/Conv · B3 Losing Ground · B4 Scale)
function renderBuckets(M){
  _bktIdCnt={};

  const rpcVs4w=(rpc,v)=>{ const base=(rpc==null||isNaN(rpc))?'—':(+rpc).toFixed(2); if(v==null||isNaN(v)) return base; const s=v<0?MINUS:'+'; return base+' '+colr(v,'('+s+Math.abs(v).toFixed(0)+'% 4w)'); };
  const swingCell=(sig,sw)=>{ sig=esc(sig||''); if(sw==null||isNaN(sw)) return (sig+' —').trim(); const ar=sw>=0?'↑':'↓'; const col=sw>=0?'var(--green)':'var(--red)'; const inner='<span style="color:'+col+'">'+ar+Math.abs(sw).toFixed(0)+'%</span>'; return sig?sig+' '+inner:inner; };
  const dsub=txt=>' <span class="d" style="color:var(--ink-faint)">('+txt+')</span>';
  const tierMini=t=>(['Hero','Pro','Seed','Longtail'].indexOf(''+t)>=0)?' '+tierChip(t):'';
  // Explore-layer info tag: FORWARD-LOOKING season phase (builds-to-peak / in-peak / winding-down / off)
  const seasonTag=id=>{ const s=(ceBy[id]||{}).season; if(!s||!s.note) return '';
    const m=({peak:['☀','amber'],pre:['↗','green'],post:['↘','ghost'],off:['❄','blue'],unknown:['·','ghost']})[s.phase]||['·','ghost'];

  // Δrev decomposition: lead driver inline; "+N" expands the remaining factors in-row (no drawer)
  const drvCell=r=>{ const fs=(r.factor_deltas||[]).filter(f=>f.usd!=null&&Math.abs(f.usd)>=1); if(!fs.length) return '—';
    const seg=f=>{ const u=f.usd,col=u>=0?'var(--green)':'var(--red)',ar=u>=0?'↑':'↓'; return '<span style="color:'+col+'">'+ar+esc(f.label)+' '+fmtMoney(Math.abs(u))+'</span>'; };

  const dualSpark=id=>{ const ce=ceBy[id]||{}; const ty=(ce.weekly||[]).slice(-10).map(w=>w.revenue), ly=(ce.weekly_ly||[]).slice(-10).map(w=>w.revenue); return kmSparkline('fx_'+id, ty, ly); };
  const fluxCbar=items=>{ if(!items.length) return '';
    const byDrv={}; items.forEach(r=>{ const k=r.dominant||'mixed'; byDrv[k]=(byDrv[k]||0)+1; });
    const reason='root driver: '+Object.entries(byDrv).sort((a,b)=>b[1]-a[1]).map(([k,v])=>v+' '+k).join(' · ');
    return cbar(items.length,'Flagged',''+items.length,'','Google Search only · '+reason); };
  const cbar=(n,ml,mv,mc,reason)=>'<div class="cbar"><span class="cbar-k">Cohort ('+n+' CEs)</span>'+
    '<div class="cbar-m"><span class="cbar-l">'+ml+'</span><span class="cbar-v '+(mc||'')+'">'+mv+'</span></div>'+
    (reason?'<div class="cbar-r">'+reason+'</div>':'')+'</div>';

  // DEFEND - Losing Money v2 — two tables (Existing / New CEs), C1-C4 criteria chips,
  // per-metric collapsible W0..W3 raw weekly columns (header click toggles; W0 leftmost),
  // driver metric bolded, action dropdown with mandatory comment. Engine: buckets.losing_money.
  const lmTier=t=>(t==='Hero'||t==='Pro')?' <span class="chip ghost">'+t+'</span>':'';
  // value-over-Δ cell. good:+1 up-good, -1 down-good, 0 neutral(gray). dp decimals, pre/suf affixes.
  const lmVD=(val,delta,o)=>{ o=o||{}; const good=o.good==null?1:o.good, dp=o.dp==null?0:o.dp, pre=o.pre||'', suf=o.suf||'', u=o.pp?'pp':'%';
    const v=(val==null||isNaN(val))?'—':pre+(+val).toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp})+suf;
    if(delta==null||isNaN(delta)) return '<div class="lmv">'+v+'</div>';
    const r=Math.round(delta), s=delta>0?'+':MINUS;
    if(good===0||r===0){ const t=(r===0)?('0'+u):(s+Math.abs(delta).toFixed(0)+u); return '<div class="lmv">'+v+'</div><div class="lmd mut">'+t+'</div>'; }
    const fav=good>0?(delta>0):(delta<0);

  // Headout aggregate: bucket rows carry a `market` tag → add a Market column.
  const showMkt=_isHeadout(M);
  const mktTh=showMkt?'<th>Market</th>':'';
  const mktTd=r=>showMkt?'<td><span class="chip ghost" style="font-size:9.5px">'+esc(r.market||'—')+'</span></td>':'';
  // metric columns — always-visible weekly micro-rows per cell: W0 big + WoW sub-delta,

  // Two groups: MONEY (outcome + efficiency, tROAS extras render between the groups)
  // then FUNNEL (the four CM2 levers in decomposition order — each boldable as driver).
  const LM_METRICS_MONEY=[
    {k:'cm2',   label:'CM2',     f:v=>{const t=fmtMoney(v); return (v!=null&&v<0)?'<span class="neg">'+t+'</span>':t;}, tip:'Google-Search CM2 = paid CM1 − spend. W0 on top, W-1..W-3 beneath (newest first); dates are the week starts.'},
    {k:'cm1',   label:'Revenue', f:v=>fmtMoney(v), tip:'Paid CM1 = Google-Search conversion value (= revenue for all practical purposes). W0 on top, W-1..W-3 beneath.'},
    {k:'roi',   label:'ROI',     f:v=>fmtPct(v,0), tip:'Paid ROI = CM1 ÷ spend — read against the tROAS column. W0 on top, W-1..W-3 beneath.'},
    {k:'troas', label:'tROAS',   f:v=>fmtPct(v,0), tip:'Target ROAS that week (spend-weighted across the CE&rsquo;s Search campaigns). W0 on top, W-1..W-3 beneath — a step-down here means the target was already corrected.'},
  ];
  const LM_METRICS_FUNNEL=[
    {k:'clicks', label:'Clicks',   f:v=>fmtInt(v),   tip:'Google-Search paid clicks. W0 on top, W-1..W-3 beneath.'},
    {k:'cvr',    label:'CVR',      f:v=>fmtPct(v,2), tip:'Google-Search conversions ÷ clicks. W0 on top, W-1..W-3 beneath.'},
    {k:'cm1conv',label:'CM1/conv', f:v=>fmtCpc(v),   tip:'Avg CM1 = paid CM1 ÷ conversions (value per conversion). W0 on top, W-1..W-3 beneath.'},
    {k:'cpc',    label:'CPC',      f:v=>fmtCpc(v),   tip:'Spend ÷ clicks — up is bad. W0 on top, W-1..W-3 beneath.'},
  ];
  const LM_DRIVER_COL={clicks:'clicks',cvr:'cvr',cpc:'cpc',valconv:'cm1conv',rpc:'cm1'};
  const LM_DRIVER_LBL={clicks:'Clicks',cvr:'CVR',cpc:'CPC',valconv:'CM1/conv',rpc:'RPC'};
  const lmCEcell=r=>'<span class="cn">'+esc(r.ce_name)+'</span> <span class="idbr">['+esc(r.ce_id)+']</span>'+lmTier(r.tier)+seasonTag(r.ce_id);
  const lmLabelChip=r=>{

  // Triage chip, two decoupled facts: chronicity (flag streak from the engine) and

  const lmStateChip=r=>{

  // Criteria column — on what basis the CE qualified, with the qualifying value per criterion
  const lmCritCell=r=>{

    if(c.indexOf('C3')>=0) seg.push('<div class="lmd gn" style="font-weight:800">vs 3wk avg '+fmtMoneyDelta(r.delta_3w)+'</div>');

    return seg.join('')||'—'; };
  const lmMetricCells=(r,list)=>list.map(m=>{

      else { const p=b?100*(a/b-1):null; sub=(p==null||Math.round(p)===0)?'<div class="lmd mut">0%</div>':'<div class="lmd mut">'+(p>0?'+':MINUS)+Math.abs(p).toFixed(0)+'%</div>'; }

  const lmDriverCell=r=>{

  // Perf's working vocabulary (2026-08-03): 4 options; Skip and No-change are ONE thing
  // (meeting: "no change required is skip only"). Older stored values (scale_down / pause /
  // intentional / no_change) still display via the legacy-value fallback below.
  const LM_ACTIONS=[['','—'],['skip','Skip / No change required'],['roas_change','tROAS change'],['negative_seasonality','-ve Seasonality'],['pause_review','Pause &amp; Review']];
  const LM_ACT_LBL={}; LM_ACTIONS.forEach(p=>LM_ACT_LBL[p[0]]=p[1]);
  const lmAction=r=>{

    const lw=pv.status?'<div class="lm-who" title="'+esc(pv.note||'')+'">last wk: <b>'+(LM_ACT_LBL[pv.status]||esc(pv.status))+'</b>'+(pv.owner?' · '+esc(pv.owner):'')+'</div>':'';

      '<textarea class="lm-note'+(req?' lm-note-req':'')+'" onclick="event.stopPropagation()" onfocus="wrLmNoteFocus(this)" placeholder="'+ph+'" onchange="wrLmNote(\''+esc(r.ce_id)+'\',this.value,this)">'+esc(n)+'</textarea>'+attr+lw; };
  const lmNewExtras=r=>
    '<td class="num">'+((r.troas_now!=null)?fmtPct(r.troas_now,0):'—')+((r.troas_l4w!=null)?'<div class="lmd mut">L4W '+fmtPct(r.troas_l4w,0)+'</div>':'')+'</td>'+
    '<td class="num"><span class="'+(r.cm2_90d<0?'neg':'')+'">'+fmtMoneyDelta(r.cm2_90d)+'</span>'+(((r.criteria||[]).indexOf('C4')>=0)?'<div class="lmd gn" style="font-weight:800">C4</div>':'')+'</td>'+
    '<td class="num">'+(r.launch_date?esc(r.launch_date)+((r.days_since_launch!=null)?'<div class="lmd mut">'+fmtInt(r.days_since_launch)+'d ago</div>':''):'—')+'</td>';
  const lmHeadCore='<th class="stick">Combined Entity</th>'+mktTh+
    '<th title="Status label — a tag, not a grouping; the sort is by CM2 drop regardless of label.">Status</th>'+
    '<th class="num" title="On what basis the CE qualified, with the qualifying value. W0 loss = CM2 negative this week (any amount — the base check) · 0 conv = spend with zero conversions this week · WoW = CM2 drop vs last week · vs 3wk avg = drop vs the W-1..W-3 average · 90d = cumulative CM2 loss (New CEs only). Drop thresholds: ≥ $500 flags always · $200–500 only when W0 Paid ROI &lt; 140%. Sorted by the worst fired drop.">Criteria <span class="lm-hb">ⓘ</span></th>';
  const lmHeadTail='<th title="What drove the CM2 drop — that metric&rsquo;s column is bolded. From the exact CM2 decomposition vs the W-1..W-3 baseline: Clicks · CVR · CPC · CM1-per-conversion (value).">Driver <span class="lm-hb">ⓘ</span></th>'+
    '<th title="Your call. Actions save immediately; a missing comment shows a warning until the why is added. Growth reviews Tue/Wed; finalized Thursday.">Action</th>';

    '<th class="num" title="Oldest Google-Ads campaign launch for this CE (first paid click).">Launched</th>';
  const lmHeadEx=lmHeadCore+lmMetricHeads(LM_METRICS_MONEY)+lmMetricHeads(LM_METRICS_FUNNEL)+lmHeadTail;
  const lmHeadNew=lmHeadCore+lmMetricHeads(LM_METRICS_MONEY)+lmHeadNewX+lmMetricHeads(LM_METRICS_FUNNEL)+lmHeadTail;
  const lmRow=(r,isNew)=>'<tr class="cerow'+(r.label==='full_waste'?' lm-waste':'')+'" data-ce="'+esc(r.ce_id)+'">'+
      '<td class="ce stick">'+lmCEcell(r)+'</td>'+mktTd(r)+
      '<td>'+lmLabelChip(r)+lmStateChip(r)+'</td>'+
      '<td class="num">'+lmCritCell(r)+'</td>'+
      lmMetricCells(r,LM_METRICS_MONEY)+
      (isNew?lmNewExtras(r):'')+
      lmMetricCells(r,LM_METRICS_FUNNEL)+
      lmDriverCell(r)+
      '<td>'+lmAction(r)+'</td></tr>';
  const lmHowto='<div class="lm-howto"><b>How to read:</b> a CE is flagged when any <b>Criteria</b> fires — <b>W0 loss</b> (CM2 negative this week, any amount — the base check) · <b>0 conv</b> (spend, zero conversions this week) · <b>WoW</b> / <b>vs 3wk avg</b> (CM2 dropped ≥ $500; or ≥ $200 with W0 ROI &lt; 140%) · <b>90d</b> (New CEs: ≥ $500 cumulative loss). Sorted by the worst fired drop — the Status label is a tag, not the order. Each metric cell shows <b>w0 on top</b> (with its WoW change), then <b>w1 · w2 · w3</b> beneath, newest first (hover a row for its week date; the toggle above hides them). The <b>bolded metric</b> is the driver of the drop. Status carries a triage chip: <b>new this wk</b> · <b>Nth wk · last wk ✓</b> = flagged N weeks running, last week has an action on record (shown in the Action cell, hover for the comment) · <b>Nth wk · no action on record</b> = flagged N weeks running and last week has nothing recorded in the report — review these first and record what was (or wasn&rsquo;t) done. <b>Review guideline:</b> read delivered ROI against <b>tROAS</b> first — if the campaign is running below its target, the first intervention is correcting ROAS (~10% step); <b>negative seasonality</b> applies only when ROAS is already running as expected. Every action <b>saves immediately</b>; a missing comment shows a <b>⚠ warning until the why is added</b>.</div>';
  const lmLegend='<div class="lm-legend"><span class="chip red">Bleeding</span>W0 CM2 &lt; 0 &nbsp;·&nbsp; <span class="chip amber">Eroding</span>W0 CM2 ≥ 0 but dropping &nbsp;·&nbsp; <span class="chip green">Recovering</span>loss ≥ halved vs W-1 &nbsp;·&nbsp; <span class="chip red">Full waste</span>spend, 0 conversions &nbsp;·&nbsp; Google-Search Paid only (Bing excluded).</div>';
  const lmSubhead=(t,n,sub)=>'<div style="margin:16px 0 6px;font-family:var(--sans);font-size:13px;font-weight:800;color:var(--ink-head)">'+t+' <span style="color:var(--ink-faint);font-weight:600">('+n+')</span>'+(sub?' <span style="color:var(--ink-faint);font-weight:500;font-size:11.5px">— '+sub+'</span>':'')+'</div>';
  let lmBody;
  if(!lmExist.length && !lmNew.length){ lmBody='<div class="emptystate">No CEs flagged on the Losing Money criteria this week. <b>✅</b></div>'; }
  else{
    let lmWkHidden=false; try{ lmWkHidden=localStorage.getItem('wr_lm_wk_hidden')==='1'; }catch(_){ }
    const lmTog='<div style="display:flex;align-items:center;gap:12px;margin:0 0 10px;flex-wrap:wrap">'+
      '<button id="lmWkToggle" class="lm-wktog">'+(lmWkHidden?'▸ Show weekly numbers':'▾ Hide weekly numbers')+'</button>'+
      '<span class="sub" style="color:var(--ink-faint)">Collapsed = this week + WoW · Expanded = w1&ndash;w3 raw weekly values under each metric (hover a row for the week date).</span></div>';
    lmBody=lmHowto+lmLegend+lmTog+
      '<div id="lmwrap"'+(lmWkHidden?' class="lm-wk-hidden"':'')+'>'+
      lmSubhead('Existing CEs',lmExist.length,'')+
      (lmExist.length?_tbl(lmHeadEx,lmExist.map(r=>lmRow(r,false)).join('')):'<div class="emptystate">No existing CEs flagged. <b>✅</b></div>')+
      lmSubhead('New CEs',lmNew.length,'losing money can be intentional while scaling — read against launch date &amp; tROAS before acting')+
      (lmNew.length?_tbl(lmHeadNew,lmNew.map(r=>lmRow(r,true)).join('')):'<div class="emptystate">No new CEs flagged. <b>✅</b></div>')+
      '</div>';
  }
  let lmFn='';
  if(paused.length){ lmFn+='<div class="sub" style="margin-top:6px;color:var(--ink-soft)"><b>⏸ '+paused.length+' paused this week (was funded 4w):</b> '+paused.map(r=>esc(r.ce_name)+' ('+fmtMoney(r.spend_4w)+' 4w, '+fmtInt(r.orders_4w)+' orders)').join(' · ')+' — spend stopped, ROI reads null. Confirm the pause was intentional.</div>'; }
  if(trackingGap.length){ lmFn+='<div class="sub" style="margin-top:6px;color:var(--amber)"><b>⚠️ '+trackingGap.length+' null-ROI — feed gap (verify tracking):</b> '+trackingGap.map(r=>esc(r.ce_name)+' ('+fmtInt(r.orders_4w)+' orders, '+fmtMoney(r.spend_4w)+' 4w)').join(' · ')+' — spending &amp; converting, but current-week CM1 didn&rsquo;t populate. NOT waste.</div>'; }
  if(burn.count){ const bn=esc((burn.names||[]).join(' · ')); lmFn+='<div class="sub" style="margin-top:6px" title="'+bn+'">+ '+burn.count+' sub-$1k/4wk CEs losing <span class="neg">'+fmtMoneyDelta(burn.bleed_wk)+'/wk</span> below the report&rsquo;s materiality gate — full ungated list in the Weekly Flagged sheet <span style="color:var(--ink-faint)">(hover for names + $)</span></div>'; }

  // Fluctuations — expanded weekly metrics matching the Losing Money UX (W0+WoW on top, W1..W3 beneath).
  // Swing = L3W-vs-W0 ratio change. Driver = dominant RPC factor from CVR × AOV × CR × TR decomposition.
  // Every cell is W0 + its WoW change, then W-1..W-3 beneath — all on equal-length,
  // weekday-aligned spans anchored to the analysis window (alerts._week_blocks).
  // CVR·AOV·Completion·Take-rate ARE the RPC decomposition: RPC = CVR × AOV × CR × TR.
  const FX_METRICS=[
    {k:'spend',   label:'Spend',      f:v=>fmtMoney(v), tip:'Google-Search spend over the window. W0 on top, W-1..W-3 beneath.'},
    {k:'roi',     label:'ROI',        f:v=>fmtPct(v,0), tip:'Google-Search Paid ROI = CM1 ÷ spend. This is the value the bucket’s ROI gate is applied to. W0 on top, W-1..W-3 beneath.'},
    {k:'clicks',  label:'Clicks',     f:v=>fmtInt(v),   tip:'Google-Search paid clicks — context only, never a qualifier. W0 on top, W-1..W-3 beneath.'},
    {k:'cvr',     label:'CVR',        f:v=>fmtPct(v,2), tip:'RPC driver 1 of 4: orders ÷ clicks (paid Google-Search funnel). W0 on top, W-1..W-3 beneath.'},
    {k:'aov',     label:'AOV',        f:v=>fmtMoney(v), tip:'RPC driver 2 of 4: booked GBV ÷ orders. W0 on top, W-1..W-3 beneath.'},
    {k:'cr',      label:'Completion', f:v=>fmtPct(v,1), tip:'RPC driver 3 of 4: completed ÷ booked attributed value. W0 on top, W-1..W-3 beneath.'},
    {k:'tr',      label:'Take rate',  f:v=>fmtPct(v,1), tip:'RPC driver 4 of 4: net revenue ÷ completed GBV. W0 on top, W-1..W-3 beneath.'},
    {k:'cm1conv', label:'CM1/conv',   f:v=>fmtCpc(v),   tip:'CM1 per conversion (Google-Search ads). W0 on top, W-1..W-3 beneath.'},
    {k:'cpc',     label:'CPC',        f:v=>fmtCpc(v),   tip:'Cost per click (Google-Search) — up is bad. W0 on top, W-1..W-3 beneath.'},
  ];
  const fxDriverCell=r=>{ if(!r.dominant) return '<td>—</td>'; const d=r[r.dominant_key+'_d']; return '<td><b>'+esc(r.dominant)+'</b>'+((d!=null)?'<div class="lmd '+(d<0?'gn':'gp')+'">'+(d>0?'+':MINUS)+Math.abs(d).toFixed(0)+'%</div>':'')+'</td>'; };
  // Action cell — same structure as Losing Money (status dropdown + mandatory comment),
  // with a per-direction option list. 'No change required' / 'Skip' exist so a reviewer who
  // looks and disagrees can record that: a blank cell reads as "never reviewed" downstream.
  const FX_ACTIONS_DOWN=[['','—'],['negative_seasonality','−ve seasonality'],['roas_change','ROAS target change'],['pause_review','Pause &amp; review'],['no_change','No change required'],['skip','Skip']];
  const FX_ACTIONS_UP=[['','—'],['positive_seasonality','+ve seasonality'],['no_change','No change required'],['skip','Skip']];
  const FX_ACT_LBL={}; FX_ACTIONS_DOWN.concat(FX_ACTIONS_UP).forEach(p=>FX_ACT_LBL[p[0]]=p[1]);
  const fxAction=(r,bucket)=>{ bucket=bucket||'flux_down';
    const a=getAction(bucket,r.ce_id), v=a.status||'', n=a.note||'', who=a.owner||'', when=a.updated||'';
    const opts=(bucket==='flux_up'?FX_ACTIONS_UP:FX_ACTIONS_DOWN).slice();
    if(v&&!opts.some(p=>p[0]===v)) opts.push([v,v]);   // legacy stored value still displays
    const o=opts.map(p=>'<option value="'+p[0]+'"'+(v===p[0]?' selected':'')+'>'+p[1]+'</option>').join('');
    let attr='';
    if(who||when){ const ago=when?_ago(when):''; attr='<div class="lm-who">'+(who?esc(who):'')+(ago?' · '+ago:'')+'</div>'; }
    const pv=getPrevAction(bucket,r.ce_id);
    const lw=pv.status?'<div class="lm-who" title="'+esc(pv.note||'')+'">last wk: <b>'+(FX_ACT_LBL[pv.status]||esc(pv.status))+'</b>'+(pv.owner?' · '+esc(pv.owner):'')+'</div>':'';
    const req=(v&&!(n||'').trim());
    // Comment box only appears once an action is chosen (or one is already on record) — an

    const noteBox = (v || (n||'').trim())
      ? '<textarea class="lm-note'+(req?' lm-note-req':'')+'" onclick="event.stopPropagation()" placeholder="'+(req?'comment required — why?':'why?')+'" onchange="wrFxNote(\''+esc(bucket)+'\',\''+esc(r.ce_id)+'\',this.value,this)">'+esc(n)+'</textarea>'

    return '<select class="lm-act" data-bucket="'+esc(bucket)+'" data-ce="'+esc(r.ce_id)+'" onclick="event.stopPropagation()" onchange="wrFxAction(\''+esc(bucket)+'\',\''+esc(r.ce_id)+'\',this.value,this)">'+o+'</select>'+
      noteBox+attr+lw; };
  const fluxHead='<th class="stick">Combined Entity</th>'+mktTh+

    '<th title="Verdict · cause tag · recommended default action (guideline only).">Read</th>'+
    '<th title="Your call. Selecting an action requires a comment. Saved per week.">Action</th>';
  const fluxRows=(items,bucket)=>items.map(r=>'<tr class="cerow" data-ce="'+esc(r.ce_id)+'">'+
    '<td class="ce stick"><span class="cn">'+esc(r.ce_name)+'</span> <span class="idbr">['+esc(r.ce_id)+']</span>'+seasonTag(r.ce_id)+'</td>'+mktTd(r)+
    lmMetricCells(r,FX_METRICS)+
    fxDriverCell(r)+

    '<td>'+fxAction(r,bucket)+'</td>'+

  const fluxHowtoDn=_howto('All <b>paid Google-Search</b>. A CE is flagged when CM1/conv or RPC moved <b>≥35%</b> vs the <b>prior 3 weeks (L3W)</b>, and its <b>W0 ROI is ≤180%</b> — above that it is still profitable despite the drop, so no action is needed. Each metric cell shows <b>W0 on top</b> (with its WoW change), then <b>W-1 · W-2 · W-3</b> beneath — read the four weeks to tell a real trend from a one-week wobble. <b>Driver</b> = dominant factor from the RPC decomposition (CVR × AOV × Completion × Take-rate). Sorted by W0 spend, biggest first. Selecting an <b>Action requires a comment</b>.');
  const fluxHowtoUp=_howto('All <b>paid Google-Search</b>. A CE is flagged when CM1/conv or RPC moved <b>≥35%</b> vs the <b>prior 3 weeks (L3W)</b>, and its <b>W0 ROI is >100%</b> — below break-even there is nothing to lean into. Each metric cell shows <b>W0 on top</b> (with its WoW change), then <b>W-1 · W-2 · W-3</b> beneath. <b>Driver</b> = dominant factor from the RPC decomposition. Sorted by W0 spend, biggest first. Selecting an <b>Action requires a comment</b>.');
  // Maturity-lag banner — this bucket runs on the last FULLY-MATURED week (paid Google-Search

    ? '<div class="lm-howto" style="background:#fff7ed;border-color:#fed7aa"><b>⏳ Matured-window comparison.</b> '

      + 'attribution (orders / revenue / completion) takes ~3 days to settle. So this bucket compares the '
      + 'settled part of the week — <b>'+esc(_mt.fluctuation_window_start)+' → '+esc(_mt.fluctuation_window_end)
      + '</b> ('+esc(_mt.fluctuation_days)+'d) — against the <b>prior 3 weeks</b> (<b>'
      + esc(_mt.fluctuation_compare_start)+' → '+esc(_mt.fluctuation_compare_end)+'</b>). The unsettled tail is '

    : '<div class="sub" style="color:var(--ink-faint);margin:0 0 8px">Paid fluctuations · full report week <b>'
      + esc(_mt.fluctuation_window_start||_mt.week_start)+' → '+esc(_mt.fluctuation_window_end||_mt.week_end)
      + '</b> vs the prior 3 weeks (<b>'+esc(_mt.fluctuation_compare_start)+' → '+esc(_mt.fluctuation_compare_end)+'</b>)</div>';
  const seasDnBody=seasDn.length?(fluxLagNote+fluxHowtoDn+_tbl(fluxHead,fluxRows(seasDn,'flux_down'))):(fluxLagNote+'<div class="emptystate">No revenue-quality drops this week on a CE returning ≤180% ROI. <b>✅</b></div>');
  const seasUpBody=seasUp.length?(fluxLagNote+fluxHowtoUp+_tbl(fluxHead,fluxRows(seasUp,'flux_up'))):(fluxLagNote+'<div class="emptystate">No revenue-quality spikes this week on a CE above break-even.</div>');

  // COMPOUND - Scale-Up — clean value(Δ) layout + cohort bar + dual spark
  let scaleBody;
  if(!scale.length){ scaleBody='<div class="emptystate">No CEs clearing ROI ≥155% (≥3-of-4 wk).</div>'; }
  else{

      scale.map(r=>{ const flag=r.seasonality_flag?' '+chip('green','seas↑'):'';

          '<td class="ce stick"><span class="cn">'+esc(r.ce_name)+'</span> <span class="idbr">['+esc(r.ce_id)+']</span>'+seasonTag(r.ce_id)+''+tierMini(r.tier)+'</td>'+
          '<td class="num">'+fmtPct(r.roi_agg4,0)+dsub((r.wks_ge_155||0)+'/4 ≥155')+'</td>'+
          '<td class="num '+sgn(r.pp_vs_troas)+'">'+ppDelta(r.pp_vs_troas)+flag+dsub('tROAS '+fmtPct(r.troas,0))+'</td>'+
          '<td class="num pos"><b>'+fmtMoney(r.est_incremental_wk)+'</b></td>'+
          '<td class="num">'+fmtMoney(r.spend_4w)+'</td>'+
          '<td>'+((r.rpc==null)?'—':'$'+(+r.rpc).toFixed(2))+rvc+'</td>'+
          '<td class="num">'+fmtPct(r.cvr_pct,1)+'</td>'+
          '<td>'+dualSpark(r.ce_id)+'</td></tr>'; }).join(''));
  }

  // LIFECYCLE - New CEs
  const newLane={A_graduated:['New Pro+','green'],B_on_pace:['On pace → Pro','blue']};
  let newBody;
  if(!newCes.length){ newBody='<div class="emptystate">No CEs newly Pro+ or on pace to Pro.</div>'; }
  else{
    const nGrad=newCes.filter(r=>r.lane==='A_graduated').length, nPace=newCes.filter(r=>r.lane==='B_on_pace').length;
    newBody=_howto('CEs that just crossed <b>Pro+</b> for the first time in 4 quarters (graduated), or are on pace to. <b>Run-rate/mo</b> vs the Pro line and <b>Δ Rev WoW</b> show whether they&rsquo;re still climbing.')+
      _tbl('<th class="stick">Combined Entity</th><th>Lane</th><th>Band</th><th class="num" title="Months since the CE first paid Google-Ads click (earliest report_date with clicks over 0, Google Ads only). NOT the Headout launch/creation date — understates age for CEs that ran on Bing or grew organically first.">Mo since launch ⓘ</th><th class="num">Run-rate/mo</th><th class="num">Paid ROI</th><th class="num">Δ Rev WoW</th><th class="num">Clicks</th><th class="num">RPC</th><th>Rev &rsquo;26 v &rsquo;25</th>',
      newCes.map(r=>{ const ln=newLane[r.lane]||[r.lane,'ghost'];
        return '<tr class="cerow" data-ce="'+esc(r.ce_id)+'">'+
          '<td class="ce stick"><span class="cn">'+esc(r.ce_name)+'</span> <span class="idbr">['+esc(r.ce_id)+']</span>'+seasonTag(r.ce_id)+'</td>'+
          '<td>'+chip(ln[1],ln[0])+'</td><td><b>'+esc(r.band||'—')+'</b></td>'+
          '<td class="num">'+(r.mo_since_launch==null?'<span class="idbr">—</span>':'<b>'+r.mo_since_launch+'</b>mo')+'</td>'+
          '<td class="num">'+fmtMoney(r.run_rate_mo)+dsub((r.dollars_to_pro>0?fmtMoney(r.dollars_to_pro)+' to Pro':'at Pro+'))+'</td>'+
          '<td class="num">'+fmtPct(r.roi,0)+'</td>'+
          '<td class="num '+sgn(r.rev_wow_pct)+'">'+fmtDelta(r.rev_wow_pct,0)+'</td>'+
          '<td class="num">'+fmtInt(r.clicks)+dsub(fmtDelta(r.clicks_wow_pct,0))+'</td>'+
          '<td class="num">'+((r.rpc==null)?'—':'$'+(+r.rpc).toFixed(2))+dsub('CVR '+fmtPct(r.cvr_pct,1))+'</td>'+
          '<td>'+dualSpark(r.ce_id)+'</td></tr>'; }).join(''));
  }

  // LIFECYCLE - Iteration
  const itReasonC={'Waiting for takeoff':'amber','Needs inputs':'blue','Manual check':'ghost','Untapped':'violet'};
  let itBody;
  if(!iters.length){ itBody='<div class="emptystate">No iteration / untapped candidates.</div>'; }
  else{
    const nIt=iters.filter(r=>r.lane==='iteration').length, nUn=iters.filter(r=>r.lane==='untapped').length, nNew=iters.filter(r=>r.new_this_week).length;
    itBody=_howto('Non-graduated CEs (<b>never Pro+</b>). <b>Iteration</b> = team is on it — the Reason says what&rsquo;s stuck (waiting for takeoff · needs inputs · manual check). <b>Untapped</b> = real scale, nobody working it. Clicks/CVR pooled over 4 weeks; <b>new</b> = handed over in the last 2 weeks.')+
      _tbl('<th class="stick">Combined Entity</th><th>Reason</th><th>Band</th><th class="num" title="Months since the CE first paid Google-Ads click (earliest report_date with clicks over 0, Google Ads only). NOT the Headout launch/creation date — understates age for CEs that ran on Bing or grew organically first.">Mo since launch ⓘ</th><th class="num">Run-rate/mo</th><th class="num">Clicks 4w</th><th class="num">CVR 4w</th><th>MMP handover</th><th>Rev &rsquo;26 v &rsquo;25</th>',
      iters.map(r=>{ const t=r.traction||{};
        const cvrCls=(r.cvr_4w!=null&&r.cvr_cat_med!=null)?(r.cvr_4w<r.cvr_cat_med?'neg':'pos'):'';
        return '<tr class="cerow" data-ce="'+esc(r.ce_id)+'">'+
          '<td class="ce stick"><span class="cn">'+esc(r.ce_name)+'</span> <span class="idbr">['+esc(r.ce_id)+']</span>'+seasonTag(r.ce_id)+''+(r.has_mmp?' <span class="chip ghost">MMP ✓</span>':'')+(r.new_this_week?' <span class="chip green">NEW</span>':'')+'</td>'+

// dual-line sparkline: TY solid (green/red by net dir) + optional LY dashed grey,
// shared scale across both series. Returns SVG markup carrying a data-k hook so
// hover tooltips can be wired after the HTML is injected.
function kmSparkline(kId, ty, ly){
  const W=150,H=30,PAD=3;
  const tyN=ty.map(v=>(v==null||isNaN(v))?null:+v);
  const lyN=ly?ly.map(v=>(v==null||isNaN(v))?null:+v):null;
  const all=tyN.concat(lyN||[]).filter(v=>v!=null);
  if(all.length<2) return '<svg class="spark" width="'+W+'" height="'+H+'"></svg>';
  const lo=Math.min.apply(null,all), hi=Math.max.apply(null,all), rng=(hi-lo)||1, n=tyN.length;
  const X=i=>PAD+(W-2*PAD)*(i/(n-1)), Y=v=>H-PAD-(H-2*PAD)*((v-lo)/rng);
  const poly=arr=>arr.map((v,i)=>v==null?null:X(i).toFixed(1)+','+Y(v).toFixed(1)).filter(Boolean).join(' ');
  const tyPresent=tyN.filter(v=>v!=null);
  const up=tyPresent[tyPresent.length-1]>=tyPresent[0];
  const col=up?'var(--green)':'var(--red)';
  let lastI=n-1; while(lastI>=0 && tyN[lastI]==null) lastI--;
  const dot = lastI>=0 ? '<circle cx="'+X(lastI).toFixed(1)+'" cy="'+Y(tyN[lastI]).toFixed(1)+'" r="2.2" fill="'+col+'"/>' : '';
  const lyLine = (lyN && lyN.filter(v=>v!=null).length>=2)
    ? '<polyline fill="none" stroke="var(--ink-faint)" stroke-width="1.3" stroke-dasharray="3 2" points="'+poly(lyN)+'"/>' : '';
  return '<svg class="spark" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" data-k="'+esc(kId)+'" style="cursor:crosshair">'+
    lyLine+
    '<polyline fill="none" stroke="'+col+'" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" points="'+poly(tyN)+'"/>'+
    dot+
    '<line class="cursor" x1="0" y1="0" x2="0" y2="'+H+'" stroke="var(--ink)" stroke-width="1" opacity="0"/>'+
    '</svg>';
}
// format a value by metric type (money / pct / count) — matches mockup formatters
function kmFmt(v,t){
  if(v==null||isNaN(v)) return '—';
  if(t==='money'){ const a=Math.abs(v);
    if(a>=1e6) return '$'+(v/1e6).toFixed(2)+'M'; if(a>=1e3) return '$'+(v/1e3).toFixed(1)+'K'; return '$'+Math.round(v); }
  if(t==='cpc') return '$'+(+v).toFixed(2);   // CPC/RPC — always cents (double-decimal)
  if(t==='pct') return (+v).toFixed(2)+'%';
  if(t==='count'){ const a=Math.abs(v); return a>=1e3?(v/1e3).toFixed(1)+'K':''+Math.round(v); }
  return ''+v;
}
// Δ-abs formatting: ratio metrics in pp, money in $, counts raw.
function kmDeltaAbs(v,t){
  if(v==null||isNaN(v)) return '—';
  const s=v>0?'+':(v<0?MINUS:''); const a=Math.abs(v);
  if(t==='pct') return s+a.toFixed(2)+'pp';
  if(t==='money'){ if(a>=1e6) return s+'$'+(a/1e6).toFixed(2)+'M'; if(a>=1e3) return s+'$'+(a/1e3).toFixed(1)+'K'; return s+'$'+Math.round(a); }
  if(a>=1e3) return s+(a/1e3).toFixed(1)+'K';
  return s+Math.round(a);
}
// map metric id -> display format bucket
const KM_FMT = { revenue:'money', gbv:'money', orders:'count', aov:'money', cr_pct:'pct', tr_pct:'pct',

    '<table class="km"><thead><tr><th>Metric</th><th>W0</th><th>W-1</th><th>Δ abs</th><th>Δ %</th>'+
