<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap');

:root{
  --purps:#8000FF; --purps-deep:#6a00d6; --purps-soft:#F1E8FF;
  --candy:#FF2D6F; --candy-soft:#FFE3EC;
  --paper:#ffffff; --paper-deep:#F7F3FF; --card:#ffffff;
  --ink:#1A1526; --ink-soft:#5C5470; --ink-faint:#9B93AC; --ink-head:#332D45;
  --rule:#ECE6F8; --rule-dark:#DAD1EF;
  --red:#E5384F; --red-bg:#FDE7EA;
  --amber:#B5810B; --amber-bg:#FAF0D5;
  --green:#12A150; --green-bg:#E2F5EA;
  --blue:#2F6FE0; --blue-bg:#E7EEFC;
  --violet:#8000FF; --violet-bg:#F1E8FF;
  --sans:'Figtree',ui-sans-serif,system-ui,-apple-system,'Helvetica Neue',sans-serif;
  --mono:'Figtree',ui-sans-serif,system-ui,sans-serif;
  --disp:'Figtree',ui-sans-serif,system-ui,sans-serif;
  --shadow:0 2px 10px rgba(88,0,170,.06),0 1px 3px rgba(88,0,170,.05);
  --shadow-lg:0 18px 50px rgba(40,0,90,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--paper);
  background-image:radial-gradient(1100px 460px at 8% -8%, #F2EAFF 0%, transparent 62%),
                   radial-gradient(900px 420px at 100% 4%, #FFEAF2 0%, transparent 55%);
  color:var(--ink); font-family:var(--sans); font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
.page{max-width:1280px;margin:0 auto;padding:38px 32px 120px}

.masthead{border-bottom:2px solid var(--rule);padding-bottom:20px;position:relative}
.mast-kicker{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--purps)}
.masthead h1{font-family:var(--disp);font-weight:800;font-size:44px;line-height:1.02;letter-spacing:-.025em;margin:9px 0 6px;color:var(--ink-head)}
.masthead h1 em{font-style:normal;font-weight:800;color:var(--purps)}
.mast-meta{font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--ink-soft);display:flex;gap:22px;flex-wrap:wrap;margin-top:10px}
.mast-meta b{font-weight:700;color:var(--ink)}

.tabs{display:flex;gap:8px;margin:22px 0 4px;flex-wrap:wrap}
.tab{font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.01em;padding:9px 18px;border:1.5px solid var(--rule-dark);
     border-radius:999px;background:#fff;color:var(--ink-soft);cursor:pointer;white-space:nowrap;transition:all .14s}
.tab:hover{color:var(--purps);border-color:var(--purps)}
.tab.active{background:var(--purps);color:#fff;border-color:var(--purps);font-weight:700;box-shadow:0 4px 14px rgba(128,0,255,.28)}
.tab .trev{opacity:.85;margin-left:9px;font-size:12px;font-weight:600}

section{margin-top:44px;scroll-margin-top:52px}
.sec-head{display:flex;align-items:baseline;gap:13px;border-bottom:1.5px solid var(--rule-dark);padding-bottom:8px;margin-bottom:17px}
.sec-num{font-family:var(--sans);font-size:12px;font-weight:700;color:#fff;background:var(--purps);padding:3px 10px;border-radius:7px;letter-spacing:.02em}
.sec-head h2{font-family:var(--disp);font-size:23px;font-weight:800;letter-spacing:-.02em;color:var(--ink-head)}
.sec-head .sub{font-family:var(--sans);font-size:11.5px;font-weight:500;color:var(--ink-faint);margin-left:auto;text-align:right}
/* jumplinks nav — slides in on scroll */
.jumpnav{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);padding:7px 32px;display:flex;gap:5px;flex-wrap:nowrap;align-items:center;justify-content:center;transform:translateY(-100%);opacity:0;transition:transform .25s ease,opacity .2s ease;pointer-events:none}
.jumpnav.visible{transform:translateY(0);opacity:1;pointer-events:auto}
.jumpnav a{font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:.02em;padding:4px 11px;border-radius:999px;border:1px solid var(--rule-dark);background:#fff;color:var(--ink-soft);text-decoration:none;white-space:nowrap;transition:all .12s}
.jumpnav a:hover{color:var(--purps);border-color:var(--purps)}
.jumpnav a.active{background:var(--purps);color:#fff;border-color:var(--purps)}
.jumpnav .sep{width:1px;height:14px;background:var(--rule-dark);margin:0 1px;flex-shrink:0}
/* collapsible section (§2) — explicit Show/Hide button, collapsed by default */
.sec-btn{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.02em;margin-left:14px;padding:6px 15px;
  border-radius:999px;border:1.5px solid var(--purps);background:var(--purps);color:#fff;cursor:pointer;white-space:nowrap;
  align-self:center;transition:background .15s,color .15s}
.sec-btn:hover{background:var(--purps-dark,#6B00D6)}
.collapsible.collapsed .sec-btn{background:#fff;color:var(--purps)}
.collapsible.collapsed .sec-body{display:none}
.collapsible.collapsed .expanded-only{display:none}
.collapsible:not(.collapsed) .collapsed-only{display:none}
.collapsible.collapsed .sec-head{margin-bottom:0;border-bottom-style:dashed}

.chip{display:inline-block;font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:2px 9px;border-radius:99px;white-space:nowrap;vertical-align:1px}
.chip.red{background:var(--red-bg);color:var(--red)} .chip.amber{background:var(--amber-bg);color:var(--amber)}
.chip.green{background:var(--green-bg);color:var(--green)} .chip.blue{background:var(--blue-bg);color:var(--blue)}
.chip.violet{background:var(--violet-bg);color:var(--violet)}
.chip.ghost{background:transparent;border:1.3px solid var(--rule-dark);color:var(--ink-soft);font-weight:600}
.pos{color:var(--green)} .neg{color:var(--red)} .amb{color:var(--amber)}

.head-grid{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:16px}
.card{border:1px solid var(--rule);border-radius:16px;padding:18px 20px;background:var(--card);box-shadow:var(--shadow)}
.card h3{font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:11px}
.bignum{font-family:var(--disp);font-size:40px;font-weight:800;line-height:1;letter-spacing:-.02em}
.bignum small{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink-soft);letter-spacing:0}
.clockrow{display:flex;justify-content:space-between;font-family:var(--sans);font-size:12.5px;font-weight:500;padding:6px 0;border-top:1px solid var(--rule)}
.clockrow b{font-weight:700}
.movers h3 .n{color:var(--ink-faint);font-weight:500}
.mover{display:grid;grid-template-columns:16px 1fr auto;gap:9px;align-items:baseline;font-size:13px;padding:5px 0;border-top:1px solid var(--rule)}
.mover:first-of-type{border-top:none}
.mover .rk{font-family:var(--sans);font-size:11px;font-weight:600;color:var(--ink-faint)}
.mover .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.mover .nm:hover{color:var(--purps);text-decoration:underline}
.mover .dv{font-family:var(--sans);font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
/* trend mover rows — one directional Δ + lens label + seasonal tag */
.mvr{display:grid;grid-template-columns:15px 1fr auto 92px;gap:9px;align-items:baseline;font-size:13px;padding:6px 0;border-top:1px solid var(--rule)}
.mvr:first-of-type{border-top:none}
.mvr .rk{font-family:var(--sans);font-size:11px;font-weight:600;color:var(--ink-faint)}
.mvr .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.mvr .nm:hover{color:var(--purps);text-decoration:underline}
.mvr .st{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;white-space:nowrap}
.mvr .st .prim{font-family:var(--sans);font-variant-numeric:tabular-nums;font-weight:700}
.mvr .st .prim.pos{color:var(--green)} .mvr .st .prim.neg{color:var(--red)} .mvr .st .prim.amb{color:var(--amber)}
.mvr .st .lens{font-size:9px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-faint);margin-left:5px}
.mvr .st .alt{font-size:10px;color:var(--ink-faint);font-variant-numeric:tabular-nums;margin-top:1px}
.mvr .st .alt .lens{color:var(--ink-faint)}
.mvr .tag{font-family:var(--sans);font-size:9.5px;font-weight:600;white-space:nowrap;padding:2px 7px;border-radius:5px;text-align:center;justify-self:end}
.mvr .tag.seasonal{background:var(--rule);color:var(--ink-faint)}
.mvr .tag.against{background:var(--amber-bg);color:var(--amber)}
.mvr .tag.mostly-ty{background:#E8F5E9;color:#2E7D32}
.mvr .tag.no-ly{background:transparent;color:var(--ink-faint);opacity:0.5}
.mvh{display:grid;grid-template-columns:15px 1fr auto 92px;gap:9px;font-family:var(--sans);font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);padding-bottom:6px;border-bottom:1.3px solid var(--rule-dark)}
.mvh span:nth-child(3){text-align:right} .mvh span:nth-child(4){text-align:center}
.mvh{display:grid;grid-template-columns:15px 1fr 72px 64px auto;gap:6px;font-family:var(--sans);font-size:8.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);padding-bottom:5px;border-bottom:1.3px solid var(--rule-dark)}
.mvh span:nth-child(3),.mvh span:nth-child(4){text-align:right}
.spark-wrap{margin-top:7px}

.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:16px;background:var(--card);max-height:74vh;box-shadow:var(--shadow)}
.cbar{display:flex;flex-wrap:wrap;gap:24px;align-items:center;background:#FAF8FE;border:1px solid var(--rule);border-radius:12px;padding:11px 18px;margin:0 0 12px}
.cbar-k{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--purps);white-space:nowrap}
.cbar-m{display:flex;flex-direction:column;gap:1px}
.cbar-l{font-size:9.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint)}
.cbar-v{font-family:var(--disp);font-size:16px;font-weight:800;white-space:nowrap;color:var(--ink)}
.cbar-r{font-size:13.5px;font-weight:600;color:var(--ink);margin-left:auto}
.d{font-weight:600;font-size:11px;white-space:nowrap}
.idbr{color:var(--ink-faint);font-weight:600;font-size:11.5px}
/* Losing Money — value-over-Δ cells + full-waste band + how-to/legend */
.lmv{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.lmv.neg{color:var(--red)}
.lmd{font-size:10.5px;font-weight:600;margin-top:1px;white-space:nowrap;line-height:1.3}
.lmd.gp{color:var(--green)} .lmd.gn{color:var(--red)} .lmd.mut{color:var(--ink-faint)}
.lm-hb{font-weight:600;font-size:9px;color:var(--ink-faint);letter-spacing:0}
thead th[title]{cursor:help}
tr.lm-waste td{background:var(--red-bg)}
.lm-howto{font-size:12px;color:var(--ink-soft);background:var(--paper-deep);border:1px solid var(--rule);border-radius:10px;padding:9px 14px;margin:0 0 8px;line-height:1.6}
.lm-howto b{color:var(--ink)}
/* bucket collapsible */
.bkt-wrap{margin-top:36px;scroll-margin-top:52px}
.bkt-head{display:flex;align-items:center;gap:10px;border:0;padding-bottom:6px;border-bottom:1.5px solid var(--rule-dark);margin-bottom:0;cursor:pointer;user-select:none}
.bkt-head:hover h2{color:var(--purps)}
.bkt-icon{font-size:16px;flex-shrink:0}
.bkt-head h2{font-family:var(--disp);font-size:18px;font-weight:800;letter-spacing:-.02em;color:var(--ink-head);margin:0}
.bkt-head .bkt-stat{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--purps);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.bkt-head .bkt-val{font-family:var(--disp);font-size:15px;font-weight:800;color:var(--ink);margin-left:4px;text-transform:none;letter-spacing:0}
.bkt-head .bkt-sub{font-family:var(--sans);font-size:11.5px;font-weight:500;color:var(--ink-faint);white-space:nowrap}
.bkt-head .bkt-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.bkt-head .bkt-caret{font-size:11px;color:var(--purps);transition:transform .2s;display:inline-block}
.bkt-collapsed .bkt-caret{transform:rotate(-90deg)}
.bkt-collapsed .bkt-body{display:none}
.bkt-collapsed .bkt-head{border-bottom-style:dashed;margin-bottom:0}
.bkt-body{padding-top:10px}
.bkt-head .bkt-info{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--paper-deep);border:1px solid var(--rule-dark);color:var(--ink-faint);font-size:10px;font-weight:700;cursor:help;flex-shrink:0}
.bkt-tooltip{position:relative;display:inline-block}
.bkt-tooltip .bkt-tip{visibility:hidden;opacity:0;position:absolute;z-index:60;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);width:380px;font-family:var(--sans);font-size:11.5px;font-weight:500;line-height:1.55;color:var(--ink);background:#fff;border:1px solid var(--rule-dark);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow-lg);transition:opacity .15s;pointer-events:none}
.bkt-tooltip:hover .bkt-tip{visibility:visible;opacity:1}
.lm-legend{font-size:11px;color:var(--ink-faint);margin:0 0 12px}
.lm-legend .chip{margin-right:2px}
/* Fluctuations — highlight the root-cause driver cell */
.fxdom{background:var(--paper-deep);border-radius:6px;padding:2px 5px;margin:-2px -3px;box-shadow:inset 2px 0 var(--ink-soft)}
/* Losing Money — per-row action dropdown + note + attribution */
.lm-act{font-family:var(--sans);font-size:11px;font-weight:600;border:1px solid var(--rule-dark);border-radius:6px;padding:3px 5px;background:#fff;color:var(--ink);cursor:pointer}
.lm-note{font-family:var(--sans);font-size:11px;border:1px solid var(--rule-dark);border-radius:6px;padding:5px 7px;background:#fff;color:var(--ink);width:170px;min-height:52px;margin-top:5px;display:block;resize:vertical}
.lm-note-req{border-color:var(--red);box-shadow:0 0 0 2px rgba(220,38,38,.12)}
.lm-warn{color:var(--red);font-size:10px;font-weight:700;margin-top:3px;max-width:170px;line-height:1.4}
/* Losing Money v2 — always-visible weekly micro-rows per metric cell:
   W0 big (+WoW sub-delta), then W-1..W-3 beneath, newest first. Dates only in CM2. */
.lmw{font-size:10px;font-weight:600;color:var(--ink-faint);font-variant-numeric:tabular-nums;line-height:1.55;white-space:nowrap}
.lmw .neg{color:var(--red);opacity:.72}
.lmwd{font-size:9px;font-weight:500;opacity:.75;margin-right:4px}
.lmw-rule{border-top:1px dashed var(--rule);margin-top:3px;padding-top:2px}
/* section-level weekly-numbers toggle */
.lm-wktog{font-family:var(--sans);font-size:11.5px;font-weight:700;color:#fff;background:var(--purps);border:0;border-radius:16px;padding:6px 14px;cursor:pointer}
.lm-wktog:hover{background:var(--purps-deep)}
.lm-wk-hidden .lmw{display:none}
.lm-who{font-family:var(--sans);font-size:9.5px;font-weight:500;color:var(--ink-faint);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
/* Fluctuations — per-row reviewer: confirm-seasonality checkbox + roomy note */
.fx-chk{display:flex;align-items:center;gap:6px;font-family:var(--sans);font-size:11px;font-weight:600;color:var(--ink);white-space:nowrap;cursor:pointer}
.fx-chk input{cursor:pointer;width:14px;height:14px;accent-color:var(--purps)}
.fx-note{font-family:var(--sans);font-size:11px;border:1px solid var(--rule-dark);border-radius:6px;padding:5px 7px;background:#fff;color:var(--ink);width:170px;min-height:38px;margin-top:5px;display:block;resize:vertical}
.drv{font-weight:600;white-space:nowrap}
#s4 tbody td{padding-top:13px;padding-bottom:13px;vertical-align:middle;font-variant-numeric:tabular-nums}
#s4 .cn{font-weight:700}
.fxexp{cursor:pointer;color:var(--purps);font-weight:700;font-size:10px;background:#F3ECFF;border-radius:6px;padding:1px 6px;margin-left:5px;user-select:none;white-space:nowrap;vertical-align:1px}
.fxexp:hover{background:#E7DAFF}
.fxfull{font-size:11px;line-height:1.6;margin-top:4px;padding-left:2px;border-left:2px solid var(--rule);padding-left:8px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
thead th{font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);text-align:left;
  padding:11px 11px;border-bottom:1.5px solid var(--rule-dark);background:var(--paper-deep);position:sticky;top:0;white-space:nowrap;z-index:3}
thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover{color:var(--purps)}
thead th .ar{color:var(--purps);margin-left:3px}
tbody td{padding:8px 11px;border-bottom:1px solid var(--rule);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr.cerow{cursor:pointer;transition:background .12s}
tbody tr.cerow:hover td{background:rgba(128,0,255,.055)}
td.num,th.num{text-align:right;font-family:var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap}
td.ce{font-weight:700;white-space:nowrap}
td.ce .cn{display:block}
td.ce small{display:block;font-weight:500;font-family:var(--sans);font-size:10px;color:var(--ink-faint)}
th.stick,td.stick{position:sticky;left:0;background:var(--paper);z-index:2}
tbody tr.cerow:hover td.stick{background:#F5EFFF}
thead th.stick{z-index:4;background:var(--paper-deep)}
tr.grouphead td{background:var(--paper-deep);font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--purps-deep);border-top:2px solid var(--rule-dark);border-bottom:1px solid var(--rule-dark)}
tr.grouphead td.gtoggle{cursor:pointer;user-select:none}
tr.grouphead:hover td.gtoggle{color:var(--purps)}
tr.grouphead .caret{display:inline-block;width:14px;color:var(--purps);font-weight:700}
tr.grouphead .gcnt{color:var(--ink-faint);font-weight:600;letter-spacing:0;text-transform:none;margin-left:7px}
/* combined group row: header label + inline Σ-subtotal metrics on one line */
tr.grouprow td{background:var(--paper-deep);font-weight:700;border-top:2px solid var(--rule-dark);border-bottom:1px solid var(--rule-dark)}
tr.grouprow td.gtoggle{cursor:pointer;user-select:none;color:var(--purps-deep);font-family:var(--sans);
  font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
tr.grouprow:hover td.gtoggle{color:var(--purps)}
tr.grouprow td.gtoggle .caret{display:inline-block;width:14px;color:var(--purps);font-weight:700}
tr.grouprow td.gtoggle .gcnt{color:var(--ink-faint);font-weight:600;letter-spacing:0;text-transform:none;margin-left:7px}
tr.grouprow td.mcell .md{font-size:9.5px;font-weight:600}
tr.grouprow:hover td.stick{background:var(--paper-deep)}
/* overall→paid divider */
th.gdiv,td.gdiv{border-left:2px solid var(--rule-dark)}
tr.subtot td{background:rgba(128,0,255,.055);font-family:var(--sans);font-weight:700;font-size:12px;border-bottom:1.5px solid var(--rule-dark)}
/* per-metric expand/collapse */
thead tr.hrow1 th{top:0}
thead tr.hrow2 th{top:36px}
/* paid block: opaque tint so sticky headers don't bleed through on scroll */
thead th.paidcol{background:#F1EBFE}
/* grand-total row for the current filter/group set — sticky under the header */
tr.totrow td{background:#efe6ff;font-weight:800;font-size:12px;border-top:2px solid var(--purps);border-bottom:2px solid var(--rule-dark);position:sticky;top:37px;z-index:1}
tr.totrow td.totlabel{color:var(--purps-deep);text-transform:uppercase;font-size:11px;letter-spacing:.05em}
tr.totrow td.stick{z-index:2}
tr.totrow.exp td{top:69px}   /* taller header when any metric is expanded */
tr.totrow td.mcell .md{font-size:9.5px;font-weight:700}
thead th.mexp{text-align:center;background:var(--violet-bg);color:var(--purps);border-left:1px solid var(--rule-dark);border-right:1px solid var(--rule-dark)}
thead th.mexp .sortable{cursor:pointer}
thead th.sub{font-size:8.5px;color:var(--ink-faint);padding:6px 9px;background:var(--paper-deep)}
thead th.sub.exp0{border-left:1px solid var(--rule-dark)}
thead th.sub.exp1{border-right:1px solid var(--rule-dark)}
.mtog{cursor:pointer;user-select:none;margin-left:5px;font-size:10px;color:var(--purps);border:1px solid var(--rule-dark);border-radius:5px;padding:0 4px;background:#fff;letter-spacing:0}
.mtog:hover{background:var(--violet-bg)}
td.mcell .mv{font-weight:600}
td.mcell .md{display:block;font-size:9.5px;font-weight:600;margin-top:1px;letter-spacing:0}
td.exp0,th.sub.exp0{border-left:1px solid var(--rule-dark)}
td.exp1,th.sub.exp1{border-right:1px solid var(--rule-dark)}
td.exp0{font-weight:700}
td.exp0,td.exp,td.exp1{background:rgba(128,0,255,.022)}
tbody tr.cerow:hover td.exp0,tbody tr.cerow:hover td.exp,tbody tr.cerow:hover td.exp1{background:rgba(128,0,255,.06)}
.moverbadge{font-size:11px;margin-right:4px}
.cmtdot{color:var(--purps);margin-left:5px}
.ceid{font-family:var(--sans);font-size:10px;font-weight:600;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.howto{font-family:var(--sans);font-size:11.5px;line-height:1.6;color:var(--ink-soft);background:var(--paper-deep);border:1px solid var(--rule);border-radius:10px;padding:11px 14px;margin:14px 0}
.howto b{color:var(--ink);font-weight:700}
a.omni{text-decoration:none;color:var(--purps);font-weight:700;font-size:11px;margin-left:2px;opacity:.65}
a.omni:hover{opacity:1}
.dr-head .kick a.omni{color:var(--purps);text-decoration:none;border-bottom:1px solid rgba(128,0,255,.35)}

.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px;padding:14px 16px;border:1px solid var(--rule);border-radius:16px;background:var(--card);box-shadow:var(--shadow)}
.controls .search{flex:1;min-width:200px}
.controls input[type=text],.controls select{font-family:var(--sans);font-size:12.5px;font-weight:500;padding:8px 12px;border:1.5px solid var(--rule-dark);
  border-radius:10px;background:#fff;color:var(--ink);width:100%}
.controls input[type=text]:focus,.controls select:focus{outline:none;border-color:var(--purps)}
.controls label{font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);display:block;margin-bottom:5px}
.ctl-group{min-width:150px}
.fchips{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.fgroup{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fgroup .flabel{font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-right:2px}
.fchip{font-family:var(--sans);font-size:11.5px;font-weight:600;padding:4px 12px;border:1.3px solid var(--rule-dark);border-radius:99px;background:#fff;color:var(--ink-soft);cursor:pointer;transition:all .12s}
.fchip:hover{border-color:var(--purps);color:var(--purps)}
.fchip.on{background:var(--purps);color:#fff;border-color:var(--purps)}
.fcount{color:var(--ink-faint);font-weight:700;font-size:9.5px} .fchip.on .fcount{color:rgba(255,255,255,.8)}
.fchips.hidden{display:none}
.moref{border-style:dashed!important;color:var(--purps)!important;border-color:var(--purps)!important;margin-left:6px}
.btn{font-family:var(--sans);font-size:11.5px;font-weight:600;padding:8px 14px;border:1.5px solid var(--rule-dark);border-radius:10px;background:#fff;color:var(--ink);cursor:pointer;transition:all .12s}
.btn:hover{border-color:var(--purps);color:var(--purps)}
.btn.dark{background:var(--purps);color:#fff;border-color:var(--purps)}
.btn.dark:hover{background:var(--purps-deep);color:#fff}
.ce-km-tab.on{background:var(--purps);color:#fff;border-color:var(--purps)}
.countline{font-family:var(--sans);font-size:12px;font-weight:500;color:var(--ink-soft);margin-top:11px;display:flex;gap:24px;flex-wrap:wrap}
.countline b{color:var(--ink);font-weight:700}

.emptystate{border:1.5px dashed var(--rule-dark);border-radius:14px;padding:18px 22px;font-size:13.5px;color:var(--ink-soft);background:var(--paper-deep)}
.emptystate b{color:var(--green);font-weight:700}

svg.spark{display:block}

.scrim{position:fixed;inset:0;background:rgba(26,21,38,.42);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:640px;max-width:96vw;background:var(--paper);border-left:1px solid var(--rule);
  box-shadow:var(--shadow-lg);transform:translateX(102%);transition:transform .22s cubic-bezier(.4,0,.2,1);z-index:50;
  display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.dr-head{padding:22px 24px 16px;border-bottom:1.5px solid var(--rule);position:relative}
.dr-head .close{position:absolute;top:18px;right:20px;font-size:22px;cursor:pointer;color:var(--ink-faint);line-height:1;background:none;border:none}
.dr-head .close:hover{color:var(--purps)}
.dr-head .kick{font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--purps)}
.dr-head h2{font-family:var(--disp);font-size:26px;font-weight:800;line-height:1.1;letter-spacing:-.02em;margin:5px 40px 9px 0}
.dr-chips{display:flex;gap:6px;flex-wrap:wrap}
.dr-body{overflow-y:auto;padding:20px 24px 44px}
.dr-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:18px}
.dr-stat{border:1px solid var(--rule);border-radius:12px;padding:11px 13px;background:var(--paper-deep)}
.dr-stat .l{font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.dr-stat .v{font-family:var(--disp);font-size:23px;font-weight:800;line-height:1.15;letter-spacing:-.02em;margin-top:4px}
.dr-sec-t{font-family:var(--sans);font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--purps);margin:24px 0 11px;border-bottom:1px solid var(--rule-dark);padding-bottom:7px}
.trend-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.trend{border:1px solid var(--rule);border-radius:12px;padding:11px 12px;background:var(--paper-deep)}
.trend .tl{font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);display:flex;justify-content:space-between}
.trend .tl b{color:var(--ink);font-weight:700}
.dr-table{width:100%;font-size:12px;border-collapse:collapse;margin-top:4px}
.dr-table th{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);text-align:right;padding:7px 7px;border-bottom:1.3px solid var(--rule-dark);background:var(--paper)}
.dr-table th:first-child{text-align:left}
.dr-table td{padding:6px 7px;text-align:right;font-family:var(--sans);font-variant-numeric:tabular-nums;border-bottom:1px solid var(--rule)}
.dr-table td:first-child{text-align:left;color:var(--ink);font-weight:600}
/* last-row emphasis only for tables that actually have a total row (non-plain).
   Plain composition/TGID tables keep every row identical — no last-row override,
   so the sticky Experience cell stays opaque (no bleed-through). */
.dr-table:not(.plain) tr:last-child td{font-weight:700;background:rgba(128,0,255,.05)}
/* Enriched TGID table — horizontally scrollable, compound cells */
.tgid-scroll{overflow-x:auto;margin-top:4px;-webkit-overflow-scrolling:touch}
.tgid-tbl{font-size:11px}
.tgid-tbl th,.tgid-tbl td{padding:8px 10px;white-space:nowrap;vertical-align:top}
.tgid-tbl tbody td{line-height:1.25}
.tgid-tbl th.lft,.tgid-tbl td.lft{position:sticky;left:0;background:var(--paper);z-index:1;min-width:170px;max-width:190px;white-space:normal}
.tgid-tbl td.lft{background:#fff}
.tgid-tbl .cc-v{font-weight:600}
.tgid-tbl .cc-d{font-size:9px;font-weight:600;line-height:1.2;margin-top:1px}
.tgid-tbl .cc-d.pos{color:var(--green)}
.tgid-tbl .cc-d.neg{color:var(--red)}
/* TGID band headers (Size / Value / Funnel / Booking window) */
.tgid-tbl tr.tgbandrow th.tgband{text-align:center;background:var(--violet-bg);color:var(--purps);font-size:9px;font-weight:800;
  letter-spacing:.08em;text-transform:uppercase;cursor:pointer;user-select:none;border-left:1px solid var(--rule-dark)}
.tgid-tbl tr.tgbandrow th.tgband:hover{background:#ece0ff}
.tgid-tbl tr.tgbandrow th.tgband.coll{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;padding:8px 3px;min-width:24px}
.tgid-tbl .tgcaret{font-size:8px}
.tgid-tbl td.coll{cursor:pointer;color:var(--ink-faint);text-align:center;min-width:24px;background:var(--paper-deep)}
.tgid-tbl td.coll:hover{background:#ece0ff;color:var(--purps)}
.tgid-tbl th.bandstart,.tgid-tbl td.bandstart{border-left:1px solid var(--rule)}
.cmt-box textarea{width:100%;min-height:120px;font-family:var(--sans);font-size:13.5px;padding:12px 14px;border:1.5px solid var(--rule-dark);
  border-radius:12px;background:#fff;color:var(--ink);resize:vertical;line-height:1.5}
.cmt-box textarea:focus{outline:none;border-color:var(--purps)}
.cmt-meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-family:var(--sans);font-size:10.5px;font-weight:500;color:var(--ink-faint)}
.cmt-saved{color:var(--green);font-weight:600}
.sync-badge{font-family:var(--sans);font-size:10.5px;font-weight:600;margin-left:auto}
.cmt-author{font-family:var(--sans);font-size:12.5px;font-weight:500;padding:7px 11px;border:1.5px solid var(--rule-dark);
  border-radius:10px;background:#fff;color:var(--ink);width:180px;margin-bottom:8px}
.cmt-author:focus{outline:none;border-color:var(--purps)}
.io-row{display:flex;gap:8px;margin-top:12px}

/* ── GM note component ── */
.gm-note-card{border:1px solid var(--rule);border-radius:16px;padding:16px 18px 14px;background:var(--card);box-shadow:var(--shadow)}
.gm-note-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:11px}
.gm-note-title{font-size:14px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:6px}
.gm-note-title .icon{font-size:15px}
.gm-note-meta{font-size:11.5px;font-weight:500;color:var(--ink-faint);margin-left:8px}
.gm-note-hint{font-size:10px;font-weight:500;color:var(--ink-faint);text-align:right;white-space:nowrap;flex-shrink:0}
.gm-textarea-wrap{margin:2px 0 10px}
.gm-textarea{width:100%;min-height:88px;font-family:var(--sans);font-size:13.5px;font-weight:500;line-height:1.55;color:var(--ink);
  padding:12px 14px 12px 16px;border:1.5px solid var(--rule-dark);border-left:3.5px solid var(--green);border-radius:12px;background:#fff;resize:vertical;transition:border-color .14s}
.gm-textarea:focus{outline:none;border-color:var(--purps);border-left-color:var(--green)}
.gm-textarea::placeholder{color:var(--ink-faint);font-weight:400}
.gm-actions{display:flex;align-items:center;gap:8px}
.btn-save{background:var(--purps);color:#fff;border:1.5px solid var(--purps);font-weight:700}
.btn-save:hover{background:var(--purps-deep);border-color:var(--purps-deep);color:#fff}
.btn-save.saved{background:var(--green);border-color:var(--green);color:#fff}
.btn-clear{background:#fff;color:var(--ink-soft);border:1.5px solid var(--rule-dark);font-weight:700}
.btn-clear:hover{border-color:var(--purps);color:var(--purps)}
.btn-post{background:#fff;color:var(--green);border:1.5px solid var(--green);font-weight:700;display:inline-flex;align-items:center;gap:6px}
.btn-post:hover{background:var(--green-bg)}
.btn-post.posting{opacity:.6;pointer-events:none}
.btn-thread{background:#fff;color:var(--green);border:1.5px solid var(--green);font-weight:700;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn-thread:hover{background:var(--green-bg)}
.btn-thread .arr{font-size:13px;line-height:1;transition:transform .14s}
.btn-thread:hover .arr{transform:translateX(2px)}
.char-count{margin-left:auto;font-size:11px;font-weight:500;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.char-count.warn{color:var(--amber);font-weight:700}
.hist-toggle{display:flex;align-items:center;gap:5px;margin-top:14px;padding:0;background:none;border:none;font-family:var(--sans);font-size:12px;font-weight:700;color:var(--purps);cursor:pointer}
.hist-toggle:hover{color:var(--purps-deep)}
.hist-toggle .caret{display:inline-block;transition:transform .2s;font-size:10px}
.hist-toggle .caret.open{transform:rotate(90deg)}
.hist-list{overflow:hidden;max-height:0;opacity:0;transition:max-height .3s ease,opacity .2s ease,margin .2s ease}
.hist-list.open{max-height:600px;opacity:1;margin-top:12px}
.hist-entry{margin-bottom:13px}
.hist-entry:last-child{margin-bottom:0}
.hist-when{font-size:10.5px;font-weight:600;color:var(--ink-faint);margin-bottom:4px}
.hist-when .hist-link{color:var(--purps);text-decoration:none;font-weight:700}
.hist-text{font-size:12.5px;font-style:italic;color:var(--ink-soft);line-height:1.55;padding-left:12px;border-left:3px solid var(--rule-dark)}
.mono{font-family:var(--sans)}
a.outlink{color:var(--purps);text-decoration:none;font-family:var(--sans);font-size:12px;font-weight:600;border-bottom:1px solid rgba(128,0,255,.35)}
a.outlink:hover{color:var(--purps-deep);border-bottom-color:var(--purps-deep)}
.footnote{margin-top:64px;border-top:2px solid var(--rule);padding-top:16px;font-family:var(--sans);font-size:10.5px;font-weight:500;color:var(--ink-faint);line-height:1.7}

/* --- Section-1 clickable headline card --- */
.card.click{cursor:pointer;position:relative;transition:box-shadow .14s,border-color .14s}
.card.click:hover{border-color:var(--purps);box-shadow:0 0 0 1.5px var(--purps),0 12px 30px -14px rgba(128,0,255,.32)}
.card.click .hint{position:absolute;top:13px;right:15px;font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.06em;
  color:var(--purps);background:var(--violet-bg);border:1px solid var(--rule-dark);border-radius:6px;padding:2px 7px}

/* --- Market drawer (wider than CE drawer) + key-metrics table --- */
.drawer.wide{width:880px}
.km-legend{margin-left:auto;font-family:var(--sans);font-size:10.5px;font-weight:500;color:var(--ink-faint);display:flex;gap:13px;align-items:center;text-transform:none;letter-spacing:0}
.km-legend i{display:inline-block;width:15px;height:0;border-top:2px solid var(--ink);margin-right:5px;vertical-align:middle}
.km-legend i.ly{border-top:2px dashed var(--ink-faint)}
table.km{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
table.km th{font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);
  text-align:right;padding:6px 8px 8px;border-bottom:1.3px solid var(--rule-dark)}
table.km th:first-child{text-align:left}table.km th.spk{text-align:right}
table.km td{padding:6px 8px;border-bottom:1px solid var(--rule);text-align:right;font-family:var(--sans);font-variant-numeric:tabular-nums}
table.km td:first-child{text-align:left;color:var(--ink-soft);font-weight:600}
table.km td.w0{font-weight:800;color:var(--ink)}
table.km td.spk{padding-right:0;width:158px;text-align:right}
table.km tr:hover td{background:rgba(128,0,255,.04)}
table.km td.spk svg{vertical-align:middle;cursor:crosshair}
.lyna{font-family:var(--sans);font-size:9.5px;font-style:italic;color:var(--ink-faint)}
#kmtip{position:fixed;pointer-events:none;z-index:60;background:var(--ink);color:#fff;border-radius:8px;padding:9px 11px;
  font-family:var(--sans);font-size:11.5px;opacity:0;transition:opacity .08s;box-shadow:0 8px 24px -6px rgba(0,0,0,.5);min-width:150px}
#kmtip .wk{color:#b7aecb;font-size:10px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:5px}
#kmtip .r{display:flex;justify-content:space-between;gap:16px;font-variant-numeric:tabular-nums}
#kmtip .r .k{color:#c9c2d8}#kmtip .r .ty{font-weight:700}#kmtip .r .ly{color:#b0a8c2}
#kmtip .yoy{margin-top:5px;padding-top:5px;border-top:1px solid rgba(255,255,255,.15);font-weight:700}

/* --- WoW Shapley diverging bars --- */
.shaprow{display:grid;grid-template-columns:88px 1fr 82px;align-items:center;gap:12px;padding:6px 0;border-top:1px solid var(--rule)}
.shaprow:first-of-type{border-top:none}
.shaprow .k{font-family:var(--sans);color:var(--ink-soft);font-size:12.5px;font-weight:600}
.shaprow .d{text-align:right;font-family:var(--sans);font-variant-numeric:tabular-nums;font-weight:700;font-size:13px}
.barwrap{position:relative;height:15px;background:linear-gradient(90deg,var(--red-bg) 0 50%,var(--green-bg) 50% 100%);border-radius:4px}
.barwrap .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--rule-dark)}
.bar{position:absolute;top:2px;height:11px;border-radius:3px}
.bar.n{right:50%;background:var(--red)}.bar.p{left:50%;background:var(--green)}
.shapnet{display:flex;justify-content:space-between;margin-top:10px;padding-top:9px;border-top:1.5px solid var(--rule-dark);
  font-family:var(--sans);font-weight:800;font-size:13.5px}

/* --- Pacing placeholders --- */
.pace{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.pacecard{border:1px dashed var(--rule-dark);border-radius:12px;padding:12px 14px;opacity:.7}
.pacecard .l{font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.pacecard .v{font-family:var(--disp);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:4px}
.dr-cap{font-family:var(--sans);color:var(--ink-soft);font-size:11px;margin-top:11px;line-height:1.55}

/* --- BGM customization: saved views bar, select bar, star, hot rows, group tag --- */
.views{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:11px 16px;margin-bottom:12px;
  border:1px solid var(--rule);border-radius:16px;background:var(--card);box-shadow:var(--shadow)}
.views .vlbl{font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-right:2px}
.vchip{font-family:var(--sans);font-size:11.5px;font-weight:600;padding:5px 11px;border:1.3px solid var(--rule-dark);border-radius:99px;
  background:#fff;color:var(--ink-soft);cursor:pointer;display:inline-flex;gap:7px;align-items:center;transition:all .12s}
.vchip:hover{border-color:var(--purps);color:var(--purps)}
.vchip.on{background:var(--purps);color:#fff;border-color:var(--purps)}
.vchip .del{color:var(--ink-faint);font-weight:700}.vchip:hover .del{color:var(--purps)}.vchip.on .del{color:#e9defc}
.selbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;padding:11px 16px;
  border:1.3px solid var(--rule-dark);border-radius:14px;background:var(--paper-deep);font-family:var(--sans);font-size:12.5px;color:var(--ink-soft)}
.selbar b{color:var(--purps);font-weight:800}
.selbar input[type=text]{font-family:var(--sans);font-size:12.5px;font-weight:500;padding:7px 11px;border:1.5px solid var(--rule-dark);border-radius:10px;background:#fff;color:var(--ink);width:190px}
.selbar input[type=text]:focus{outline:none;border-color:var(--purps)}
.selbar .glist{color:var(--ink-faint);font-size:11.5px}
tbody tr.hot td{box-shadow:inset 3px 0 0 var(--red)!important;background:rgba(229,56,79,.045)}
tbody tr.cerow.hot:hover td{background:rgba(229,56,79,.08)}
.star{cursor:pointer;color:var(--ink-faint);font-size:15px;user-select:none;padding:0 2px}
.star.on{color:var(--amber)}.star:hover{color:var(--amber)}
td.selcol,th.selcol{text-align:center;width:30px}
td.selcol input,th.selcol input{cursor:pointer}
.gtag{display:inline-block;font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.02em;background:var(--violet-bg);
  border:1px solid var(--rule-dark);border-radius:5px;padding:1px 6px;color:var(--purps);margin-left:6px;vertical-align:1px}

/* --- (P2) contribution strip: per-group Δ-rev-WoW diverging bars --- */
.strip{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:14px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.strip .sh{font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:12px}
.strip .sh b{color:var(--ink)} .strip .sh .muted{color:var(--ink-faint);font-weight:600;letter-spacing:0;text-transform:none}
.sbars{display:flex;flex-direction:column;gap:7px}
.sbar{display:grid;grid-template-columns:190px 1fr 128px;align-items:center;gap:12px;cursor:pointer}
.sbar .k{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar:hover .k{color:var(--purps)}
.strack{position:relative;height:18px;background:linear-gradient(90deg,var(--red-bg) 0 50%,var(--green-bg) 50% 100%);border-radius:4px}
.strack .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--rule-dark)}
.sfill{position:absolute;top:2px;height:14px;border-radius:3px}
.sfill.n{right:50%;background:var(--red)}.sfill.p{left:50%;background:var(--green)}
.sbar .d{text-align:right;font-family:var(--sans);font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:700}
.idx{font-family:var(--sans);font-size:11px;font-weight:800;padding:1px 5px;border-radius:4px;margin-left:6px}
.idx.hot{background:var(--red-bg);color:var(--red)}.idx.warm{background:var(--green-bg);color:var(--green)}.idx.mute{background:var(--paper-deep);color:var(--ink-faint)}

/* --- Section-2 sub-tabs (Follow-up / Market Review toggle) --- */
.s2tabs{display:flex;gap:0;margin-bottom:16px;border:1.5px solid var(--rule-dark);border-radius:10px;overflow:hidden;width:fit-content}
.s2tab{font-family:var(--sans);font-size:12.5px;font-weight:600;padding:8px 18px;background:#fff;color:var(--ink-soft);cursor:pointer;
  border-right:1.5px solid var(--rule-dark);transition:all .12s;user-select:none;white-space:nowrap}
.s2tab:last-child{border-right:none}
.s2tab:hover{color:var(--purps);background:var(--purps-soft)}
.s2tab.active{background:var(--purps);color:#fff;font-weight:700}
.s2tab .cnt{font-size:11px;font-weight:500;margin-left:6px;opacity:.8}
.s2pane{display:none}.s2pane.active{display:block}

/* --- Market Review panel --- */
.mr-panel{padding:0}
.mr-review textarea{width:100%;min-height:200px;font-family:var(--sans);font-size:13.5px;padding:14px 16px;border:1.5px solid var(--rule-dark);
  border-radius:12px;background:#fff;color:var(--ink);resize:vertical;line-height:1.6}
.mr-review textarea:focus{outline:none;border-color:var(--purps)}
.mr-review textarea::placeholder{color:var(--ink-faint)}
.mr-meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-family:var(--sans);font-size:10.5px;font-weight:500;color:var(--ink-faint)}
.mr-saved{color:var(--green);font-weight:600}
.mr-context{margin-top:18px}
.mr-ctx-head{font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:11px;display:flex;align-items:center;gap:8px}
.mr-ctx-head .cnt{background:var(--rule);color:var(--ink-soft);border-radius:999px;padding:1px 8px;font-size:10px}
.mr-context-item{border:1px solid var(--rule);border-left:3px solid var(--rule-dark);border-radius:10px;padding:11px 15px;background:var(--paper-deep);margin-bottom:8px}
.mr-context-item.k-drop{border-left-color:var(--red)}
.mr-context-item.k-gain{border-left-color:var(--green)}
.mr-context-item.k-ops{border-left-color:var(--ink-faint)}
.mr-ctx-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px}
.mr-context-item .mr-title{font-family:var(--sans);font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.3}
.mr-context-item .mr-meta2{font-family:var(--sans);font-size:9.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);white-space:nowrap}
.mr-context-item .mr-txt{font-family:var(--sans);font-size:12.5px;color:var(--ink-soft);line-height:1.5}
.mr-prompt{font-family:var(--sans);font-size:12px;color:var(--ink-faint);line-height:1.6;margin-bottom:14px}
.mr-prompt b{color:var(--ink);font-weight:600}
</style>
