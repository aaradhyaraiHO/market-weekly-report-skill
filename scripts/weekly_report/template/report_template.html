<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap');

:root{
  --purps:#8000FF; --purps-deep:#6a00d6; --purps-soft:#F1E8FF;
  --candy:#FF2D6F; --candy-soft:#FFE3EC;
  --paper:#ffffff; --paper-deep:#F7F3FF; --card:#ffffff;
  --ink:#1A1526; --ink-soft:#5C5470; --ink-faint:#9B93AC; --ink-head:#332D45;
  --rule:#ECE6F8; --rule-dark:#DAD1EF;
  --red:#E5384F; --red-bg:#FDE7EA;
  --amber:#B5810B; --amber-bg:#FAF0D5;
  --green:#12A150; --green-bg:#E2F5EA;
  --blue:#2F6FE0; --blue-bg:#E7EEFC;
  --violet:#8000FF; --violet-bg:#F1E8FF;
  --sans:'Figtree',ui-sans-serif,system-ui,-apple-system,'Helvetica Neue',sans-serif;
  --mono:'Figtree',ui-sans-serif,system-ui,sans-serif;
  --disp:'Figtree',ui-sans-serif,system-ui,sans-serif;
  --shadow:0 2px 10px rgba(88,0,170,.06),0 1px 3px rgba(88,0,170,.05);
  --shadow-lg:0 18px 50px rgba(40,0,90,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--paper);
  background-image:radial-gradient(1100px 460px at 8% -8%, #F2EAFF 0%, transparent 62%),
                   radial-gradient(900px 420px at 100% 4%, #FFEAF2 0%, transparent 55%);
  color:var(--ink); font-family:var(--sans); font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
.page{max-width:1280px;margin:0 auto;padding:38px 32px 120px}

.masthead{border-bottom:2px solid var(--rule);padding-bottom:20px;position:relative}
.mast-kicker{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--purps)}
.masthead h1{font-family:var(--disp);font-weight:800;font-size:44px;line-height:1.02;letter-spacing:-.025em;margin:9px 0 6px;color:var(--ink-head)}
.masthead h1 em{font-style:normal;font-weight:800;color:var(--purps)}
.mast-meta{font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--ink-soft);display:flex;gap:22px;flex-wrap:wrap;margin-top:10px}
.mast-meta b{font-weight:700;color:var(--ink)}

.tabs{display:flex;gap:8px;margin:22px 0 4px;flex-wrap:wrap}
.tab{font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.01em;padding:9px 18px;border:1.5px solid var(--rule-dark);
     border-radius:999px;background:#fff;color:var(--ink-soft);cursor:pointer;white-space:nowrap;transition:all .14s}
.tab:hover{color:var(--purps);border-color:var(--purps)}
.tab.active{background:var(--purps);color:#fff;border-color:var(--purps);font-weight:700;box-shadow:0 4px 14px rgba(128,0,255,.28)}
.tab .trev{opacity:.85;margin-left:9px;font-size:12px;font-weight:600}

section{margin-top:44px}
.sec-head{display:flex;align-items:baseline;gap:13px;border-bottom:1.5px solid var(--rule-dark);padding-bottom:8px;margin-bottom:17px}
.sec-num{font-family:var(--sans);font-size:12px;font-weight:700;color:#fff;background:var(--purps);padding:3px 10px;border-radius:7px;letter-spacing:.02em}
.sec-head h2{font-family:var(--disp);font-size:23px;font-weight:800;letter-spacing:-.02em;color:var(--ink-head)}
.sec-head .sub{font-family:var(--sans);font-size:11.5px;font-weight:500;color:var(--ink-faint);margin-left:auto;text-align:right}
/* collapsible section (§2) — explicit Show/Hide button, collapsed by default */
.sec-btn{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.02em;margin-left:14px;padding:6px 15px;
  border-radius:999px;border:1.5px solid var(--purps);background:var(--purps);color:#fff;cursor:pointer;white-space:nowrap;
  align-self:center;transition:background .15s,color .15s}
.sec-btn:hover{background:var(--purps-dark,#6B00D6)}
.collapsible.collapsed .sec-btn{background:#fff;color:var(--purps)}
.collapsible.collapsed .sec-body{display:none}
.collapsible.collapsed .expanded-only{display:none}
.collapsible:not(.collapsed) .collapsed-only{display:none}
.collapsible.collapsed .sec-head{margin-bottom:0;border-bottom-style:dashed}

.chip{display:inline-block;font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:2px 9px;border-radius:99px;white-space:nowrap;vertical-align:1px}
.chip.red{background:var(--red-bg);color:var(--red)} .chip.amber{background:var(--amber-bg);color:var(--amber)}
.chip.green{background:var(--green-bg);color:var(--green)} .chip.blue{background:var(--blue-bg);color:var(--blue)}
.chip.violet{background:var(--violet-bg);color:var(--violet)}
.chip.ghost{background:transparent;border:1.3px solid var(--rule-dark);color:var(--ink-soft);font-weight:600}
.pos{color:var(--green)} .neg{color:var(--red)} .amb{color:var(--amber)}

.head-grid{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:16px}
.card{border:1px solid var(--rule);border-radius:16px;padding:18px 20px;background:var(--card);box-shadow:var(--shadow)}
.card h3{font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:11px}
.bignum{font-family:var(--disp);font-size:40px;font-weight:800;line-height:1;letter-spacing:-.02em}
.bignum small{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink-soft);letter-spacing:0}
.clockrow{display:flex;justify-content:space-between;font-family:var(--sans);font-size:12.5px;font-weight:500;padding:6px 0;border-top:1px solid var(--rule)}
.clockrow b{font-weight:700}
.movers h3 .n{color:var(--ink-faint);font-weight:500}
.mover{display:grid;grid-template-columns:16px 1fr auto;gap:9px;align-items:baseline;font-size:13px;padding:5px 0;border-top:1px solid var(--rule)}
.mover:first-of-type{border-top:none}
.mover .rk{font-family:var(--sans);font-size:11px;font-weight:600;color:var(--ink-faint)}
.mover .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.mover .nm:hover{color:var(--purps);text-decoration:underline}
.mover .dv{font-family:var(--sans);font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
/* trend mover rows — one directional Δ + lens label + seasonal tag */
.mvr{display:grid;grid-template-columns:15px 1fr auto 92px;gap:9px;align-items:baseline;font-size:13px;padding:6px 0;border-top:1px solid var(--rule)}
.mvr:first-of-type{border-top:none}
.mvr .rk{font-family:var(--sans);font-size:11px;font-weight:600;color:var(--ink-faint)}
.mvr .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.mvr .nm:hover{color:var(--purps);text-decoration:underline}
.mvr .st{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;white-space:nowrap}
.mvr .st .prim{font-family:var(--sans);font-variant-numeric:tabular-nums;font-weight:700}
.mvr .st .prim.pos{color:var(--green)} .mvr .st .prim.neg{color:var(--red)} .mvr .st .prim.amb{color:var(--amber)}
.mvr .st .lens{font-size:9px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-faint);margin-left:5px}
.mvr .st .alt{font-size:10px;color:var(--ink-faint);font-variant-numeric:tabular-nums;margin-top:1px}
.mvr .st .alt .lens{color:var(--ink-faint)}
.mvr .tag{font-family:var(--sans);font-size:9.5px;font-weight:600;white-space:nowrap;padding:2px 7px;border-radius:5px;text-align:center;justify-self:end}
.mvr .tag.seasonal{background:var(--rule);color:var(--ink-faint)}
.mvr .tag.against{background:var(--amber-bg);color:var(--amber)}
.mvr .tag.mostly-ty{background:#E8F5E9;color:#2E7D32}
.mvr .tag.no-ly{background:transparent;color:var(--ink-faint);opacity:0.5}
.mvh{display:grid;grid-template-columns:15px 1fr auto 92px;gap:9px;font-family:var(--sans);font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);padding-bottom:6px;border-bottom:1.3px solid var(--rule-dark)}
.mvh span:nth-child(3){text-align:right} .mvh span:nth-child(4){text-align:center}
.mvh{display:grid;grid-template-columns:15px 1fr 72px 64px auto;gap:6px;font-family:var(--sans);font-size:8.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);padding-bottom:5px;border-bottom:1.3px solid var(--rule-dark)}
.mvh span:nth-child(3),.mvh span:nth-child(4){text-align:right}
.spark-wrap{margin-top:7px}

.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:16px;background:var(--card);max-height:74vh;box-shadow:var(--shadow)}
.cbar{display:flex;flex-wrap:wrap;gap:24px;align-items:center;background:#FAF8FE;border:1px solid var(--rule);border-radius:12px;padding:11px 18px;margin:0 0 12px}
.cbar-k{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--purps);white-space:nowrap}
.cbar-m{display:flex;flex-direction:column;gap:1px}
.cbar-l{font-size:9.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint)}
.cbar-v{font-family:var(--disp);font-size:16px;font-weight:800;white-space:nowrap;color:var(--ink)}
.cbar-r{font-size:13.5px;font-weight:600;color:var(--ink);margin-left:auto}
.d{font-weight:600;font-size:11px;white-space:nowrap}
.idbr{color:var(--ink-faint);font-weight:600;font-size:11.5px}
/* Losing Money — value-over-Δ cells + full-waste band + how-to/legend */
.lmv{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.lmv.neg{color:var(--red)}
.lmd{font-size:10.5px;font-weight:600;margin-top:1px;white-space:nowrap;line-height:1.3}
.lmd.gp{color:var(--green)} .lmd.gn{color:var(--red)} .lmd.mut{color:var(--ink-faint)}
.lm-hb{font-weight:600;font-size:9px;color:var(--ink-faint);letter-spacing:0}
tr.lm-waste td{background:var(--red-bg)}
.lm-howto{font-size:12px;color:var(--ink-soft);background:var(--paper-deep);border:1px solid var(--rule);border-radius:10px;padding:9px 14px;margin:0 0 8px;line-height:1.6}
.lm-howto b{color:var(--ink)}
.lm-legend{font-size:11px;color:var(--ink-faint);margin:0 0 12px}
.lm-legend .chip{margin-right:2px}
.drv{font-weight:600;white-space:nowrap}
#s4 tbody td{padding-top:13px;padding-bottom:13px;vertical-align:middle;font-variant-numeric:tabular-nums}
#s4 .cn{font-weight:700}
.fxexp{cursor:pointer;color:var(--purps);font-weight:700;font-size:10px;background:#F3ECFF;border-radius:6px;padding:1px 6px;margin-left:5px;user-select:none;white-space:nowrap;vertical-align:1px}
.fxexp:hover{background:#E7DAFF}
.fxfull{font-size:11px;line-height:1.6;margin-top:4px;padding-left:2px;border-left:2px solid var(--rule);padding-left:8px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
thead th{font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);text-align:left;
  padding:11px 11px;border-bottom:1.5px solid var(--rule-dark);background:var(--paper-deep);position:sticky;top:0;white-space:nowrap;z-index:3}
thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover{color:var(--purps)}
thead th .ar{color:var(--purps);margin-left:3px}
tbody td{padding:8px 11px;border-bottom:1px solid var(--rule);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr.cerow{cursor:pointer;transition:background .12s}
tbody tr.cerow:hover td{background:rgba(128,0,255,.055)}
td.num,th.num{text-align:right;font-family:var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap}
td.ce{font-weight:700;white-space:nowrap}
td.ce .cn{display:block}
td.ce small{display:block;font-weight:500;font-family:var(--sans);font-size:10px;color:var(--ink-faint)}
th.stick,td.stick{position:sticky;left:0;background:var(--paper);z-index:2}
tbody tr.cerow:hover td.stick{background:#F5EFFF}
thead th.stick{z-index:4;background:var(--paper-deep)}
tr.grouphead td{background:var(--paper-deep);font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--purps-deep);border-top:2px solid var(--rule-dark);border-bottom:1px solid var(--rule-dark)}
tr.grouphead td.gtoggle{cursor:pointer;user-select:none}
tr.grouphead:hover td.gtoggle{color:var(--purps)}
tr.grouphead .caret{display:inline-block;width:14px;color:var(--purps);font-weight:700}
tr.grouphead .gcnt{color:var(--ink-faint);font-weight:600;letter-spacing:0;text-transform:none;margin-left:7px}
/* combined group row: header label + inline Σ-subtotal metrics on one line */
tr.grouprow td{background:var(--paper-deep);font-weight:700;border-top:2px solid var(--rule-dark);border-bottom:1px solid var(--rule-dark)}
tr.grouprow td.gtoggle{cursor:pointer;user-select:none;color:var(--purps-deep);font-family:var(--sans);
  font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
tr.grouprow:hover td.gtoggle{color:var(--purps)}
tr.grouprow td.gtoggle .caret{display:inline-block;width:14px;color:var(--purps);font-weight:700}
tr.grouprow td.gtoggle .gcnt{color:var(--ink-faint);font-weight:600;letter-spacing:0;text-transform:none;margin-left:7px}
tr.grouprow td.mcell .md{font-size:9.5px;font-weight:600}
tr.grouprow:hover td.stick{background:var(--paper-deep)}
/* overall→paid divider */
th.gdiv,td.gdiv{border-left:2px solid var(--rule-dark)}
tr.subtot td{background:rgba(128,0,255,.055);font-family:var(--sans);font-weight:700;font-size:12px;border-bottom:1.5px solid var(--rule-dark)}
/* per-metric expand/collapse */
thead tr.hrow1 th{top:0}
thead tr.hrow2 th{top:36px}
/* paid block: subtle tint on the whole group's headers (unifies them as "paid") */
thead th.paidcol{background:rgba(128,0,255,.05)}
/* grand-total row for the current filter/group set — sticky under the header */
tr.totrow td{background:#efe6ff;font-weight:800;font-size:12px;border-top:2px solid var(--purps);border-bottom:2px solid var(--rule-dark);position:sticky;top:37px;z-index:1}
tr.totrow td.totlabel{color:var(--purps-deep);text-transform:uppercase;font-size:11px;letter-spacing:.05em}
tr.totrow td.stick{z-index:2}
tr.totrow.exp td{top:69px}   /* taller header when any metric is expanded */
tr.totrow td.mcell .md{font-size:9.5px;font-weight:700}
thead th.mexp{text-align:center;background:var(--violet-bg);color:var(--purps);border-left:1px solid var(--rule-dark);border-right:1px solid var(--rule-dark)}
thead th.mexp .sortable{cursor:pointer}
thead th.sub{font-size:8.5px;color:var(--ink-faint);padding:6px 9px;background:var(--paper-deep)}
thead th.sub.exp0{border-left:1px solid var(--rule-dark)}
thead th.sub.exp1{border-right:1px solid var(--rule-dark)}
.mtog{cursor:pointer;user-select:none;margin-left:5px;font-size:10px;color:var(--purps);border:1px solid var(--rule-dark);border-radius:5px;padding:0 4px;background:#fff;letter-spacing:0}
.mtog:hover{background:var(--violet-bg)}
td.mcell .mv{font-weight:600}
td.mcell .md{display:block;font-size:9.5px;font-weight:600;margin-top:1px;letter-spacing:0}
td.exp0,th.sub.exp0{border-left:1px solid var(--rule-dark)}
td.exp1,th.sub.exp1{border-right:1px solid var(--rule-dark)}
td.exp0{font-weight:700}
td.exp0,td.exp,td.exp1{background:rgba(128,0,255,.022)}
tbody tr.cerow:hover td.exp0,tbody tr.cerow:hover td.exp,tbody tr.cerow:hover td.exp1{background:rgba(128,0,255,.06)}
.moverbadge{font-size:11px;margin-right:4px}
.cmtdot{color:var(--purps);margin-left:5px}
.ceid{font-family:var(--sans);font-size:10px;font-weight:600;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.howto{font-family:var(--sans);font-size:11.5px;line-height:1.6;color:var(--ink-soft);background:var(--paper-deep);border:1px solid var(--rule);border-radius:10px;padding:11px 14px;margin:14px 0}
.howto b{color:var(--ink);font-weight:700}
a.omni{text-decoration:none;color:var(--purps);font-weight:700;font-size:11px;margin-left:2px;opacity:.65}
a.omni:hover{opacity:1}
.dr-head .kick a.omni{color:var(--purps);text-decoration:none;border-bottom:1px solid rgba(128,0,255,.35)}

.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px;padding:14px 16px;border:1px solid var(--rule);border-radius:16px;background:var(--card);box-shadow:var(--shadow)}
.controls .search{flex:1;min-width:200px}
.controls input[type=text],.controls select{font-family:var(--sans);font-size:12.5px;font-weight:500;padding:8px 12px;border:1.5px solid var(--rule-dark);
  border-radius:10px;background:#fff;color:var(--ink);width:100%}
.controls input[type=text]:focus,.controls select:focus{outline:none;border-color:var(--purps)}
.controls label{font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);display:block;margin-bottom:5px}
.ctl-group{min-width:150px}
.fchips{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.fgroup{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fgroup .flabel{font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-right:2px}
.fchip{font-family:var(--sans);font-size:11.5px;font-weight:600;padding:4px 12px;border:1.3px solid var(--rule-dark);border-radius:99px;background:#fff;color:var(--ink-soft);cursor:pointer;transition:all .12s}
.fchip:hover{border-color:var(--purps);color:var(--purps)}
.fchip.on{background:var(--purps);color:#fff;border-color:var(--purps)}
.fcount{color:var(--ink-faint);font-weight:700;font-size:9.5px} .fchip.on .fcount{color:rgba(255,255,255,.8)}
.fchips.hidden{display:none}
.moref{border-style:dashed!important;color:var(--purps)!important;border-color:var(--purps)!important;margin-left:6px}
.btn{font-family:var(--sans);font-size:11.5px;font-weight:600;padding:8px 14px;border:1.5px solid var(--rule-dark);border-radius:10px;background:#fff;color:var(--ink);cursor:pointer;transition:all .12s}
.btn:hover{border-color:var(--purps);color:var(--purps)}
.btn.dark{background:var(--purps);color:#fff;border-color:var(--purps)}
.btn.dark:hover{background:var(--purps-deep);color:#fff}
.ce-km-tab.on{background:var(--purps);color:#fff;border-color:var(--purps)}
.countline{font-family:var(--sans);font-size:12px;font-weight:500;color:var(--ink-soft);margin-top:11px;display:flex;gap:24px;flex-wrap:wrap}
.countline b{color:var(--ink);font-weight:700}

.emptystate{border:1.5px dashed var(--rule-dark);border-radius:14px;padding:18px 22px;font-size:13.5px;color:var(--ink-soft);background:var(--paper-deep)}
.emptystate b{color:var(--green);font-weight:700}

svg.spark{display:block}

.scrim{position:fixed;inset:0;background:rgba(26,21,38,.42);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:640px;max-width:96vw;background:var(--paper);border-left:1px solid var(--rule);
  box-shadow:var(--shadow-lg);transform:translateX(102%);transition:transform .22s cubic-bezier(.4,0,.2,1);z-index:50;
  display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.dr-head{padding:22px 24px 16px;border-bottom:1.5px solid var(--rule);position:relative}
.dr-head .close{position:absolute;top:18px;right:20px;font-size:22px;cursor:pointer;color:var(--ink-faint);line-height:1;background:none;border:none}
.dr-head .close:hover{color:var(--purps)}
.dr-head .kick{font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--purps)}
.dr-head h2{font-family:var(--disp);font-size:26px;font-weight:800;line-height:1.1;letter-spacing:-.02em;margin:5px 40px 9px 0}
.dr-chips{display:flex;gap:6px;flex-wrap:wrap}
.dr-body{overflow-y:auto;padding:20px 24px 44px}
.dr-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:18px}
.dr-stat{border:1px solid var(--rule);border-radius:12px;padding:11px 13px;background:var(--paper-deep)}
.dr-stat .l{font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}

<script>
"use strict";
const DATA = JSON.parse(document.getElementById('report-data').textContent);
const MARKETS = DATA.markets;
let mi = 0;                       // current market index
const state = { sortKey:'__mover', dir:-1, group:'', search:'', filters:{}, watchOnly:false, rule:'', selMode:false, collapsed:{}, filtersOpen:false, expand:{} };
let ceCtxTotRev = 0;   // total W0 revenue of the currently-filtered rows (for Contrib %); set in paintCETable
let ceMktTotRev = 0;   // total W0 revenue of the WHOLE market (unfiltered) — for the TOTAL row's share-of-market
const sel = new Set();            // CE ids checked in select mode (transient)
let activeView = null;            // index of the currently-applied saved view

/* ---------- formatting ---------- */
const MINUS = '−';
function fmtMoney(v){ if(v==null||isNaN(v)) return '—'; const a=Math.abs(v);
  let s; if(a>=1e6) s='$'+(v/1e6).toFixed(1)+'M'; else if(a>=1e3) s='$'+(v/1e3).toFixed(1)+'K'; else s='$'+Math.round(v);
  return s.replace('$-','-$'); }
function fmtInt(v){ return (v==null||isNaN(v))?'—':Math.round(v).toLocaleString('en-US'); }
function fmtCpc(v){ return (v==null||isNaN(v))?'—':'$'+(+v).toFixed(2); }   // sub-$ metric — needs cents
// Per-CE Omni deep link — 12-week window, filtered to this CE (format from
// monthly rca_helper.build_omni_month_link; weekly date-filter variant).
function omniLink(ceId){
  const f = encodeURIComponent(JSON.stringify({values:[String(ceId)]}));
  const d = encodeURIComponent(JSON.stringify({left_side:'12 complete weeks ago',right_side:'12 weeks'}));
  const c = encodeURIComponent('combined_entity_stats.report_timestamp[week]');
  return 'https://headout.omniapp.co/dashboards/5368ab53?f--iv8lWOuS='+f+'&f--uvd3KWWJ='+d+'&c--fYgxW0mY='+c;
}
function fmtPct(v,dp){ dp=dp==null?1:dp; return (v==null||isNaN(v))?'—':(+v).toFixed(dp)+'%'; }
function fmtDelta(v,dp){ dp=dp==null?1:dp; if(v==null||isNaN(v)) return '—';
  const s=v>0?'+':(v<0?MINUS:''); return s+Math.abs(v).toFixed(dp)+'%'; }
function fmtMoneyDelta(v){ if(v==null||isNaN(v)) return '—';
  const s=v>0?'+':MINUS; return s+fmtMoney(Math.abs(v)); }
function sgn(v){ return (v==null||isNaN(v))?'':(v>0?'pos':(v<0?'neg':'')); }
function esc(s){ return (''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ---------- sparkline (inline SVG, null = gap, auto-scaled) ---------- */
function sparkline(vals, opt){
  opt=opt||{}; const w=opt.w||120,h=opt.h||26,pad=2.5;
  const nums=vals.map(v=>(v==null||isNaN(v))?null:+v);
  const present=nums.filter(v=>v!=null);
  if(present.length<2) return '<svg class="spark" width="'+w+'" height="'+h+'"></svg>';
  const min=Math.min.apply(null,present), max=Math.max.apply(null,present), span=(max-min)||1, n=nums.length;
  const X=i=>pad+(w-2*pad)*(i/(n-1)), Y=v=>h-pad-(h-2*pad)*((v-min)/span);
  let d='',started=false;
  nums.forEach((v,i)=>{ if(v==null){started=false;return;} d+=(started?' L':' M')+X(i).toFixed(1)+' '+Y(v).toFixed(1); started=true; });
  const up = present[present.length-1] >= present[0];
  const color = opt.color || (up?'var(--green)':'var(--red)');
  const last=nums[n-1];
  const dot = last!=null ? '<circle cx="'+X(n-1).toFixed(1)+'" cy="'+Y(last).toFixed(1)+'" r="1.9" fill="'+color+'"/>' : '';
  return '<svg class="spark" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">'+
    '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>'+dot+'</svg>';
}

/* ---------- GM notes (per-week, localStorage cache + Google Sheet + Slack) ----------
   A note is one-per-CE-per-week. The current week is editable; prior weeks
   render as a read-only History trail. Sheet is source of truth; localStorage
   is an instant cache + offline fallback. Save → sheet; Post → Slack thread. */
const NOTES_URL = DATA.notes_url || '';
const NOTES_CHANNELS = DATA.notes_channels || {};
const SYNC_OK = NOTES_URL.length > 0;
let syncStatus = SYNC_OK ? 'idle' : 'off';

// notesData[slug][ce_id] = [ {week_start, note, author, updated, slack_channel,
//                             slack_thread_ts, slack_permalink}, … ]  (any order)
let notesData = {};

function slugKey(){ return MARKETS[mi].meta.market_slug; }
function curWeek(){ return MARKETS[mi].meta.week_start || ''; }
function getAuthor(){ return localStorage.getItem('wr_author')||''; }
function setAuthor(v){ localStorage.setItem('wr_author', v.trim()); }
function channelFor(slug){ return NOTES_CHANNELS[slug] || null; }

function cacheKey(){ return 'wr_notes::'+slugKey(); }
function loadCache(){ try{ notesData[slugKey()] = JSON.parse(localStorage.getItem(cacheKey())||'{}'); }catch(e){ notesData[slugKey()]={}; } }
function saveCache(){ try{ localStorage.setItem(cacheKey(), JSON.stringify(notesData[slugKey()]||{})); }catch(e){} }

function ceNotes(ceId){ const m=notesData[slugKey()]||{}; return m[String(ceId)]||[]; }
function noteFor(ceId){ return ceNotes(ceId).find(n=>String(n.week_start)===String(curWeek())) || null; }
function historyFor(ceId){
  return ceNotes(ceId)
    .filter(n=>String(n.week_start)!==String(curWeek()) && n.note && n.note.trim())
    .sort((a,b)=>String(b.week_start).localeCompare(String(a.week_start)));
}
// "has a note this week" — drives the ● dot in the CE table.
function hasComment(ceId){ const n=noteFor(ceId); return !!(n && n.note && n.note.trim()); }

function putLocal(ceId, patch){
  const slug=slugKey(); notesData[slug]=notesData[slug]||{};
  const arr=notesData[slug][String(ceId)]=notesData[slug][String(ceId)]||[];
  let row=arr.find(n=>String(n.week_start)===String(curWeek()));
  if(!row){ row={week_start:curWeek()}; arr.push(row); }
  Object.assign(row, patch);
  saveCache();
}

function saveNote(ceId, text){
  const now=new Date().toISOString();
  putLocal(ceId, {note:text, author:getAuthor(), updated:now});
  if(!SYNC_OK) return Promise.resolve();
  const M=MARKETS[mi], ce=M.ces.find(c=>String(c.ce_id)===String(ceId));
  const params=new URLSearchParams({
    action:'upsert', market_slug:M.meta.market_slug, ce_id:String(ceId),
    ce_name:ce?ce.ce_name:'', week_start:curWeek(), note:text, author:getAuthor()
  });
  syncStatus='syncing'; updateSyncBadge();
  return fetch(NOTES_URL+'?'+params.toString(),{redirect:'follow'})
    .then(r=>r.json()).then(()=>{ syncStatus='synced'; updateSyncBadge(); })
    .catch(()=>{ syncStatus='error'; updateSyncBadge(); });
}

function postNote(ceId, text){
  if(!SYNC_OK) return Promise.reject('sync off');
  const M=MARKETS[mi], ce=M.ces.find(c=>String(c.ce_id)===String(ceId));
  const ch=channelFor(M.meta.market_slug);
  if(!ch) return Promise.reject('no channel');
  const params=new URLSearchParams({
    action:'post', market_slug:M.meta.market_slug, ce_id:String(ceId),
    ce_name:ce?ce.ce_name:'', week_start:curWeek(), channel:ch.id,
    text:text, author:getAuthor(), report_url:location.href
  });
  return fetch(NOTES_URL+'?'+params.toString(),{redirect:'follow'})
    .then(r=>r.json())
    .then(res=>{
      if(!res.ok) throw new Error(res.error||'post failed');
      putLocal(ceId, {note:text, author:getAuthor(), updated:new Date().toISOString(),
                      slack_channel:ch.id, slack_thread_ts:res.ts, slack_permalink:res.permalink});
      return res;
    });
}

function deleteNote(ceId){
  // remove this week's row from cache + sheet
  const slug=slugKey(), m=notesData[slug]||{};
  if(m[String(ceId)]) m[String(ceId)]=m[String(ceId)].filter(n=>String(n.week_start)!==String(curWeek()));
  saveCache();
  if(!SYNC_OK) return Promise.resolve();
  const M=MARKETS[mi];
  const params=new URLSearchParams({action:'delete', market_slug:M.meta.market_slug,
    ce_id:String(ceId), week_start:curWeek()});
  return fetch(NOTES_URL+'?'+params.toString(),{redirect:'follow'})
    .then(r=>r.json()).catch(()=>{});
}

function syncPull(){
  loadCache();
  if(!SYNC_OK){ updateSyncBadge(); return Promise.resolve(); }
  const M=MARKETS[mi]; syncStatus='syncing'; updateSyncBadge();
  return fetch(NOTES_URL+'?action=list&market='+encodeURIComponent(M.meta.market_slug),{redirect:'follow'})
    .then(r=>r.json())
    .then(data=>{
      const slug=M.meta.market_slug; notesData[slug]={};
      (data.notes||[]).forEach(n=>{
        if(!n.ce_id) return;
        const id=String(n.ce_id);
        (notesData[slug][id]=notesData[slug][id]||[]).push({
          week_start:String(n.week_start||''), note:n.note||'', author:n.author||'',
          updated:n.updated||'', slack_channel:n.slack_channel||'',
          slack_thread_ts:n.slack_thread_ts||'', slack_permalink:n.slack_permalink||''
        });
      });
      saveCache();
      syncStatus='synced'; updateSyncBadge(); paintCETable();
    })
    .catch(()=>{ syncStatus='error'; updateSyncBadge(); });
}

function updateSyncBadge(){
  const el=document.getElementById('syncBadge');
  if(!el) return;
  const map={off:'● local only', idle:'', syncing:'↻ syncing…', synced:'✓ synced', error:'⚠ sync failed'};
  const cls={off:'amb', syncing:'amb', synced:'pos', error:'neg'};
  el.textContent=map[syncStatus]||''; el.className='sync-badge '+(cls[syncStatus]||'');
}

/* CM2-trend sparkline: weekly CM1−spend, dashed zero line, per-point hover, green/red by direction */
function cm2Spark(series, weeks){
  const w=104,h=26,pad=2;
  const nums=(series||[]).map(v=>(v==null||isNaN(v))?null:+v);
  const present=nums.filter(v=>v!=null);
  if(present.length<2) return '';
  const lo=Math.min.apply(null,present), hi=Math.max.apply(null,present), rng=(hi-lo)||1, n=nums.length;
  const X=i=>pad+(w-2*pad)*(i/(n-1)), Y=v=>h-pad-(h-2*pad)*((v-lo)/rng);
  let pts=[], dots='';
  nums.forEach((v,i)=>{ if(v==null) return; const x=X(i),y=Y(v); pts.push(x.toFixed(1)+','+y.toFixed(1));
    const lbl=(weeks&&weeks[i])?(''+weeks[i]).slice(5,10):('wk'+(i+1));
    dots+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="1.3" fill="'+(v<0?'var(--red)':'var(--green)')+'" fill-opacity="0.45"/>'+
          '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="8" fill="#000" fill-opacity="0" pointer-events="all"><title>'+esc(lbl)+'  CM2 '+fmtMoneyDelta(v)+'</title></circle>'; });
  const up=present[present.length-1]>=present[0], col=up?'var(--green)':'var(--red)';
  let lastI=n-1; while(lastI>=0 && nums[lastI]==null) lastI--;
  const dot=lastI>=0?'<circle cx="'+X(lastI).toFixed(1)+'" cy="'+Y(nums[lastI]).toFixed(1)+'" r="2" fill="'+col+'"/>':'';
  const zeroY=(lo<=0&&0<=hi)?(h-pad-(h-2*pad)*((0-lo)/rng)):null;
  const zl=zeroY!=null?'<line x1="0" y1="'+zeroY.toFixed(1)+'" x2="'+w+'" y2="'+zeroY.toFixed(1)+'" stroke="var(--rule-dark)" stroke-width="1" stroke-dasharray="2 2"/>':'';
  return '<svg class="spark" width="'+w+'" height="'+h+'" style="overflow:visible">'+zl+'<polyline fill="none" stroke="'+col+'" stroke-width="1.5" points="'+pts.join(' ')+'"/>'+dot+dots+'</svg>';
}


/* ---------- BGM customization: per-market saved views / groups / watchlist / rule ----------
   Keys mirror the comments pattern, scoped per market:
     wr_views::{slug}   -> [{name, st:{sortKey,dir,group,search,filters,watchOnly,rule}}]
     wr_groups::{slug}  -> {groupName:[ceId,...]}
     wr_watch::{slug}   -> [ceId,...]
     wr_rule::{slug}    -> "roi<145"  (last-used highlight rule string) */
function slug(){ return MARKETS[mi].meta.market_slug; }
function lsGet(kind, dflt){ try{ const v=localStorage.getItem('wr_'+kind+'::'+slug());
  return v==null?dflt:(JSON.parse(v)??dflt); }catch(e){ return dflt; } }
function lsSet(kind, val){ localStorage.setItem('wr_'+kind+'::'+slug(), JSON.stringify(val)); }
function getViews(){ return lsGet('views', []); }
function setViews(v){ lsSet('views', v); }
function getGroups(){ return lsGet('groups', {}); }
function setGroups(g){ lsSet('groups', g); }
function getWatch(){ return new Set(lsGet('watch', [])); }
function setWatch(s){ lsSet('watch', Array.from(s)); }
function toggleWatch(ceId){ const s=getWatch(); s.has(ceId)?s.delete(ceId):s.add(ceId); setWatch(s); }
function groupOf(ceId){ const g=getGroups(); for(const name in g){ if(g[name].indexOf(ceId)>=0) return name; } return null; }

/* ---------- diagnostic-bucket lookup (from bucket1_fluctuations) ---------- */
// Map ce_id -> {signal, direction} for the current market. Built lazily and
// cached per market index so the group-by / contribution strip stay instant.
let _bucketIdx=null, _bucketIdxMi=-1;
function bucketIndex(){
  if(_bucketIdxMi===mi && _bucketIdx) return _bucketIdx;
  _bucketIdx={}; (MARKETS[mi].bucket1_fluctuations||[]).forEach(f=>{ _bucketIdx[f.ce_id]={signal:f.signal,direction:f.direction}; });
  _bucketIdxMi=mi; return _bucketIdx;
}
function bucketOf(ceId){ return bucketIndex()[ceId]||null; }
// pretty label e.g. "B1 · CVR ▼" for a {signal,direction}
function bucketLabel(b){
  const sig={cvr:'CVR', rpc:'RPC', cm1_per_conv:'CM1/conv'}[b.signal]||b.signal;
  return 'B1 · '+sig+' '+(b.direction==='down'?'▼':'▲');
}
// highlight rule: parse "roi<145" / "wow<-20" / "rev>50000" -> predicate over a ceRow
function ruleFn(){
  const m=(state.rule||'').match(/(roi|wow|rev|yoy|cvr|aov|tr|dwk|spend|cm1|clicks|orders)\s*([<>]=?)\s*(-?\d+\.?\d*)/i);
  if(!m) return null;
  const field=m[1].toLowerCase(), op=m[2], val=parseFloat(m[3]);
  const pick={roi:r=>r.w0.roi_pct, wow:r=>r.wow, rev:r=>r.w0.revenue, yoy:r=>r.w0.yoy_pct,
    cvr:r=>r.w0.cvr_pct, aov:r=>r.w0.aov, tr:r=>r.w0.tr_pct, dwk:r=>r.dwk,
    spend:r=>r.w0.spend, cm1:r=>r.w0.cm1, clicks:r=>r.w0.clicks, orders:r=>r.w0.orders}[field];
  if(!pick) return null;
  return r=>{ const x=pick(r); if(x==null||isNaN(x)) return false;
    return op==='<'?x<val:op==='<='?x<=val:op==='>'?x>val:op==='>='?x>=val:false; };
}

/* ---------- per-CE derived W0/W1 row ---------- */
function ceRow(ce){
  const wk=ce.weekly, w0=wk[wk.length-1], w1=wk[wk.length-2];
  const wow = (w1&&w1.revenue)? (w0.revenue-w1.revenue)/w1.revenue*100 : null;
  const dwk = w0.revenue - ((w1&&w1.revenue)||0);
  return {ce:ce, w0:w0, w1:w1, wow:wow, dwk:dwk};
}

/* =====================================================================
   SECTION 1 — headlines + top movers + market sparkline
   ===================================================================== */
// SECTION 1 — Market header (merged: raw headline + structural dual-clock +
// dual-lens movers + themes). One header, not two — the structural and raw
// views live together so their DIVERGENCE (e.g. Cruises-Chicago −$3.3K raw but
// −$29.7K structural) is the signal, instead of two overlapping mover lists.
function renderHead(M){
  const h = M.market_summary.headlines;
  const wh = h.week_header || null;       // structural engine (may be absent on old snapshots)
  const wkly = M.market_summary.weekly;
  const nW = wkly.length;
  const w0rev = nW ? wkly[nW-1].revenue : null;
  const w1rev = nW>1 ? wkly[nW-2].revenue : null;
  const wowAbs = (w0rev!=null&&w1rev!=null) ? w0rev-w1rev : null;
  function trailing4wRoi(endIdx){
    let cm=0, sp=0, any=false;
    for(let i=endIdx-3;i<=endIdx;i++){ if(i<0||i>=nW) continue; const w=wkly[i];
      if(w.spend){ sp+=w.spend; any=true; } if(w.cm1){ cm+=w.cm1; } }
    return (any&&sp) ? cm/sp*100 : null;
  }
  const roiT4 = trailing4wRoi(nW-1), roiT4prev = trailing4wRoi(nW-2);
  const roiDeltaPP = (roiT4!=null&&roiT4prev!=null) ? roiT4-roiT4prev : null;
  const ppChip = roiDeltaPP==null ? '' :
    ' <span class="'+sgn(roiDeltaPP)+'" style="font-weight:600">('+
    (roiDeltaPP>0?'+':MINUS)+Math.abs(roiDeltaPP).toFixed(1)+'pp)</span>';

  // Trend movers: one directional number per row (the bigger move in the card's
  // direction), labelled with its lens (4-WK = vs 4-week avg · WoW = vs last week),
  // plus a seasonal tag vs LY. Both numbers are in the hover.
  const tagCls = t => t==='against season'?'against':t==='seasonal'?'seasonal':t==='mostly TY'?'mostly-ty':'no-ly';
  const MVHEAD='<div class="mvh"><span></span><span>Combined Entity</span><span>Δ move</span><span>vs LY</span></div>';
  const mvT = (c,dir,i)=>{
    const t=c.delta_4w, r=c.raw_wow;
    const prim = dir==='drop' ? Math.min(t,r) : Math.max(t,r);
    const other = (prim===t) ? r : t;
    const lens = (prim===t) ? '4-wk' : 'WoW', otherLens = (prim===t) ? 'WoW' : '4-wk';
    // second line only when the two lenses disagree in direction (choppy CE)
    const diverge = other!=null && Math.abs(other)>=100 && (prim>=0)!==(other>=0);
    const altLine = diverge ? '<span class="alt">'+fmtMoneyDelta(other)+'<span class="lens">'+otherLens+'</span></span>' : '';
    return '<div class="mvr"><span class="rk">'+(i+1)+'</span>'+
      '<span class="nm" data-ce="'+esc(c.ce_id)+'">'+esc(c.ce_name)+'</span>'+
      '<span class="st"><span class="prim '+sgn(prim)+'">'+fmtMoneyDelta(prim)+'<span class="lens">'+lens+'</span></span>'+altLine+'</span>'+
      (c.tag?'<span class="tag '+tagCls(c.tag)+'">'+esc(c.tag)+'</span>':'<span class="tag no-ly">—</span>')+'</div>'; };
  // fallback mover (no trend engine): raw only
  const mvR = (m,i)=> '<div class="mover"><span class="rk">'+(i+1)+'</span>'+
     '<span class="nm" data-ce="'+esc(m.ce_id)+'">'+esc(m.ce_name)+'</span>'+
     '<span class="dv '+sgn(m.delta_wow)+'">'+fmtMoneyDelta(m.delta_wow)+'</span></div>';

  let drops, gains, moverSub;
  if(wh && wh.trend){
    const dr=(wh.trend.top_droppers||[]).slice(0,10).map((c,i)=>mvT(c,'drop',i)).join('');
    const gn=(wh.trend.top_gainers||[]).slice(0,10).map((c,i)=>mvT(c,'gain',i)).join('');
    drops = dr ? MVHEAD+dr : ''; gains = gn ? MVHEAD+gn : '';
    moverSub='biggest move · 4-wk or WoW';
  } else {
    drops=(h.top_drops||[]).map(mvR).join(''); gains=(h.top_gainers||[]).map(mvR).join('');
    moverSub='Δ rev WoW';
  }
  const moverNote = (wh&&wh.trend) ?
    '<div class="sub" style="margin-top:11px;font-size:10px;line-height:1.55;color:var(--ink-faint)">'+
      '<b>Δ move</b> = the bigger swing, tagged <b>4-WK</b> (vs 4-week avg) or <b>WoW</b> (vs last week); '+
      'a muted second line appears only when the two disagree (up on one, down on the other). '+
      '<b>vs LY</b>: seasonal = last year moved the same way · '+
      '<span style="color:var(--amber)">against season</span> = opposite, investigate · mostly TY = real shift</div>' : '';

  // Plain-language read — translate the dual-clock into one sentence a BGM gets
  // instantly (the "so what", not the jargon). This is the header's headline.
  function plainRead(wh){
    const s=wh.structural, wow=h.wow_pct, tr=wh.trend||{};
    const rawTxt = (wow==null) ? 'moved' :
      Math.abs(wow)<2 ? 'roughly flat ('+fmtDelta(wow)+' WoW)' :
      (wow>0?'up ':'down ')+fmtDelta(Math.abs(wow))+' WoW';
    const pool = s.net_usd<0 ? (tr.top_droppers||[]) : (tr.top_gainers||[]);
    const names = pool.slice(0,2).map(c=>esc(c.ce_name));
    const drv = names.length ? ' — mostly '+names.join(' and ') : '';
    if(s.net_usd<0)
      return 'Revenue is <b>'+rawTxt+'</b>, but structurally <b class="neg">'+fmtMoney(Math.abs(s.net_usd))+' behind</b> last year’s seasonal ramp'+drv+'.';
    return 'Revenue is <b>'+rawTxt+'</b>, and structurally <b class="pos">'+fmtMoney(s.net_usd)+' ahead</b> of last year’s ramp'+drv+'.';
  }
  const verdict = wh ? (
      '<div class="bignum" style="font-size:20px;line-height:1.15;margin:2px 0 6px">'+esc(wh.dual_clock_label)+'</div>'+
      '<div style="font-size:13.5px;line-height:1.5;color:var(--ink-soft);margin-bottom:10px">'+plainRead(wh)+'</div>'
    ) : '';
  // N80 counts, hover to reveal the CEs behind them (native title tooltip).
  const lossN = wh ? wh.structural.n80_loss : 0, gainN = wh ? wh.structural.n80_gain : 0;
  const lossTip = wh&&wh.trend ? esc((wh.trend.top_droppers||[]).slice(0,lossN).map(c=>c.ce_name).join(', ')) : '';
  const gTop = wh&&wh.trend ? (wh.trend.top_gainers||[]).slice(0,10).map(c=>c.ce_name) : [];
  const gainTip = wh ? esc(gTop.join(', ')+(gainN>gTop.length?', …+'+(gainN-gTop.length)+' more':'')) : '';
  const hov = 'cursor:help;border-bottom:1px dotted var(--ink-faint)';
  const structRows = wh ? (
      '<div class="clockrow"><span>Structural net (vs LY ramp)</span><b class="'+sgn(wh.structural.net_usd)+'">'+fmtMoneyDelta(wh.structural.net_usd)+
        ' <span class="sub" style="font-weight:500">(gains +'+fmtMoney(wh.structural.gains_usd)+' · losses '+MINUS+fmtMoney(wh.structural.losses_usd)+')</span></b></div>'+
      '<div class="clockrow"><span>Concentration (N80) <span class="sub">hover for CEs</span></span><b>'+
        '<span title="'+lossTip+'" style="'+hov+'">'+lossN+' CEs</span> = 80% of loss · '+
        '<span title="'+gainTip+'" style="'+hov+'">'+gainN+'</span> of gains</b></div>'
    ) : '';
  const disagree = (wh && wh.clocks_disagree) ? '<div class="sub" style="margin-top:6px;color:var(--amber)">⚠ clocks disagree — raw & structural point opposite ways</div>' : '';


  return ''+
  '<section id="s1"><div class="sec-head"><span class="sec-num">1</span><h2>Market headlines</h2>'+
    '<span class="sub">week of '+esc(M.meta.week_start)+' · raw vs structural (LY seasonality)</span></div>'+
  '<div class="head-grid">'+
    '<div class="card click" data-market-drawer="1" role="button" tabindex="0" aria-label="Open market headline detail">'+
      '<span class="hint">▸ click for detail</span>'+
      '<h3>Revenue W0 · verdict</h3>'+
      '<div class="bignum">'+fmtMoney(h.revenue_w0)+'</div>'+
      verdict+
      '<div class="clockrow"><span>WoW Δ (raw)</span><b class="'+sgn(wowAbs)+'">'+fmtMoneyDelta(wowAbs)+' · '+fmtDelta(h.wow_pct)+'</b></div>'+

function passesFilters(r){
  if(state.watchOnly && !getWatch().has(r.ce.ce_id)) return false;
  if(state.search){
    const q=state.search.toLowerCase();
    const md=r.ce.metadata;
    const hay=(r.ce.ce_name+' '+(md.city||'')+' '+(md.category||'')+' '+(md.subcategory||'')).toLowerCase();
    if(hay.indexOf(q)<0) return false;
  }
  const bsel=state.filters.__bkt;
  if(bsel && bsel.length){ const m=bucketMembers()[r.ce.ce_id]||{}; if(!bsel.some(t=>m[t])) return false; }
  for(const key in state.filters){
    if(key==='__bkt') continue;
    const sel=state.filters[key];
    if(sel && sel.length){ if(sel.indexOf(r.ce.metadata[key])<0) return false; }
  }
  return true;
}

function sortRows(rows){
  const k=state.sortKey, dir=state.dir;
  let sv;
  if(k==='__mover') sv=r=>Math.abs(r.dwk);
  else {
    const sc=STATIC_COLS.find(c=>c.k===k);
    if(sc&&sc.sv) sv=sc.sv;
    else { const mc=METRIC_COLS.find(c=>c.k===k); sv = mc ? (r=>mW0(r,mc)) : (r=>0); }
  }
  return rows.slice().sort((a,a2)=>{
    let x=sv(a), y=sv(a2);
    const xn=(x==null||(typeof x==='number'&&isNaN(x))), yn=(y==null||(typeof y==='number'&&isNaN(y)));
    if(xn&&yn) return 0; if(xn) return 1; if(yn) return -1;  // nulls always last
    if(typeof x==='string') return dir*x.localeCompare(y);
    return dir*(x-y);
  });
}

// Σ-based aggregation of the raw components for one period (pick returns the
// weekly row: r.w0 | r.w1 | lyRow(r)). Ratio metrics recompute as Σnum/Σden —
// never an average of per-CE ratios.
function _aggPeriod(rows, pick){
  const a={rev:0,ord:0,clk:0,pclk:0,spd:0,cpw:0,cm1:0,gbv:0,gbvC:0,adConv:0,organic:0,prev:0};
  rows.forEach(r=>{ const w=pick(r); if(!w) return;
    a.rev+=w.revenue||0; a.ord+=w.orders||0; a.clk+=w.clicks||0; a.pclk+=w.paid_clicks||0;
    a.spd+=w.spend||0; a.cpw+=w.coupon_wallet||0; a.cm1+=w.cm1||0; a.gbv+=w.gbv||0;
    a.gbvC+=w.gbv_completed||0; a.adConv+=w.ad_conversions||0; a.organic+=w.organic_gbv||0;
    a.prev+=w.paid_revenue||0; });   // prev = paid-attributed net revenue (for RPC)
  return a;
}
function _metricVal(a,k){ switch(k){
  case 'rev':return a.rev; case 'orders':return a.ord; case 'clicks':return a.clk;
  case 'cpc':return a.pclk?a.spd/a.pclk:null; case 'cvr':return a.clk?a.adConv/a.clk*100:null;
  case 'aov':return a.ord?a.gbv/a.ord:null; case 'tr':return a.gbvC?a.rev/a.gbvC*100:null;
  case 'cr':return a.gbv?a.gbvC/a.gbv*100:null;
  case 'rpc':return a.pclk?a.prev/a.pclk:null;   // paid-attributed net revenue ÷ paid clicks
  case 'spend':return a.spd; case 'cm1':return a.cm1; case 'cm2':return a.prev-a.spd;
  case 'roi':return (a.spd+a.cpw)?a.cm1/(a.spd+a.cpw)*100:null;
  case 'paid':return a.gbvC?Math.max(0,Math.min(100,100*(1-a.organic/a.gbvC))):null;
  default:return null; } }

// One combined row per group: caret + label + CE count in the sticky name cell,

  });
  return '<tr class="grouprow'+(open?' open':'')+'" data-group="'+esc(ckey)+'">'+(state.selMode?'<td class="selcol"></td>':'')+tds+'</tr>';
}

// group key for a row under the current group-by (metadata dim, "My groups",
// or diagnostic bucket). Returns the raw group *value* (the collapse key is
// "<groupDim>|<value>").
function groupValueOf(r){
  const gk=state.group;
  if(gk==='__mygrp') return groupOf(r.ce.ce_id)||'— ungrouped';
  if(gk==='__bucket'){ const b=bucketOf(r.ce.ce_id); return b?bucketLabel(b):'— not flagged'; }
  return r.ce.metadata[gk]||'—';
}
// list of currently-visible group collapse-keys (for collapse-all/expand-all)
function currentGroupKeys(){
  if(!state.group) return [];
  const rows=MARKETS[mi].ces.map(ceRow).filter(passesFilters);
  const set=new Set(); rows.forEach(r=>set.add(state.group+'|'+groupValueOf(r)));
  return Array.from(set);

function collapseBtnLabel(){

function toggleAllGroups(){
  const keys=currentGroupKeys();

}

function paintCETable(){
  const M=MARKETS[mi];
  let rows = M.ces.map(ceRow).filter(passesFilters);
  // total filtered W0 revenue — powers the Contrib % column + group contrib in
  // subtotals/strip. Set before any row/subtotal render reads it.
  ceCtxTotRev = rows.reduce((s,r)=>s+(r.w0.revenue||0),0);
  const allRows = M.ces.map(ceRow);
  ceMktTotRev = allRows.reduce((s,r)=>s+(r.w0.revenue||0),0);   // full-market denom for TOTAL row
  const byAbs = allRows.slice().sort((a,b)=>Math.abs(b.dwk)-Math.abs(a.dwk));
  const topMovers={}; byAbs.slice(0,10).forEach(r=>{ topMovers[r.ce.ce_id]= r.dwk>=0?'up':'down'; });

  const rf=ruleFn();

  // header — 2 rows: metric names (with expand toggles) + sub-label row (only
  // when a metric is expanded). Overall/Paid split is shown by the divider
  // (gdiv) before the first paid column; the "Paid" context lives in tooltips.
  const arrow=c=>{
    if(state.sortKey===c) return '<span class="ar">'+(state.dir<0?'▼':'▲')+'</span>';
    if(state.sortKey==='__mover'&&c==='rev') return '<span class="ar">↕</span>';
    return '';
  };
  const firstPaid=(METRIC_COLS.find(m=>m.grp==='paid')||{}).k;
  const dv=m=>m.k===firstPaid?' gdiv':'';   // divider before the first paid col
  const anyExp=anyMetricExpanded();
  let r1=(state.selMode?'<th class="selcol stick" rowspan="2"></th>':'');
  STATIC_COLS.forEach(c=>{
    const isSort=c.sort!==false;
    r1+='<th rowspan="2" class="'+(c.num?'num ':'')+(c.stick?'stick ':'')+(isSort?'sortable':'')+'"'+
      (isSort?' data-sort="'+c.k+'"':'')+(c.tip?' title="'+esc(c.tip)+'"':'')+'>'+esc(c.label)+arrow(c.k)+'</th>';
  });
  METRIC_COLS.forEach(m=>{
    const ex=state.expand[m.k], tog='<span class="mtog" data-expand="'+m.k+'" title="'+(ex?'collapse':'expand W0/W-1/Δ/YoY')+'">'+(ex?'&gt;&lt;':'&lt;&gt;')+'</span>';
    const ti=m.tip?' title="'+esc(m.tip)+'"':'';
    const pc=(m.grp==='paid')?' paidcol':'';   // whole paid block gets a subtle tint
    if(ex) r1+='<th class="num mexp'+dv(m)+pc+'" colspan="5"'+ti+'><span class="sortable" data-sort="'+m.k+'">'+esc(m.label)+arrow(m.k)+'</span> '+tog+'</th>';
    else   r1+='<th rowspan="2" class="num sortable mcolh'+dv(m)+pc+'" data-sort="'+m.k+'"'+ti+'>'+esc(m.label)+arrow(m.k)+' '+tog+'</th>';
  });
  let r2='';
  METRIC_COLS.forEach(m=>{ if(state.expand[m.k]){ const pc=(m.grp==='paid')?' paidcol':''; r2+='<th class="num sub exp0'+dv(m)+pc+'">W0</th><th class="num sub'+pc+'">W-1</th><th class="num sub'+pc+'">Change</th><th class="num sub'+pc+'">WoW %</th><th class="num sub exp1'+pc+'">YoY %</th>'; } });
  let head='<tr class="hrow1">'+r1+'</tr>'+(anyExp?'<tr class="hrow2">'+r2+'</tr>':'');

  const gspan=colCount();
  let body=totalRowHtml(rows);   // grand total for the current filter, pinned at top
  if(state.group){
    const gk=state.group;
    // "My groups" clusters by custom-group membership, "Diagnostic bucket" by
    // the B1 signal+direction, others by metadata value.
    const glabel = gk==='__mygrp' ? 'my group' : (gk==='__bucket' ? 'bucket' : gk);
    const groups={};
    rows.forEach(r=>{ const v=groupValueOf(r); (groups[v]=groups[v]||[]).push(r); });
    // sort group headers by descending subtotal revenue (matches mockup)
    const grev=gv=>groups[gv].reduce((s,r)=>s+(r.w0.revenue||0),0);
    Object.keys(groups).sort((a,b)=>grev(b)-grev(a)).forEach(gv=>{
      const gr=sortRows(groups[gv]);
      // collapsed state keyed by "groupByDim|groupValue" (survives re-renders this session)
      const ckey=gk+'|'+gv, open=!state.collapsed[ckey];
      // combined header+subtotal row (1 line per group); members below when open
      body+=groupRowHtml(ckey, glabel, gv, gr, open);
      if(open) body+=gr.map(r=>rowHtml(r,topMovers,rf)).join('');
    });
  } else {
    body+=sortRows(rows).map(r=>rowHtml(r,topMovers,rf)).join('');   // += keeps the TOTAL row
  }

  document.getElementById('ceTableWrap').innerHTML='<table><thead>'+head+'</thead><tbody>'+body+'</tbody></table>';
  renderContributionStrip(rows);
  const totRev=rows.reduce((s,r)=>s+(r.w0.revenue||0),0);
  const hotN=rf?rows.filter(rf).length:0;
  document.getElementById('ceCount').innerHTML=
    'Showing <b>'+rows.length+'</b> of <b>'+M.ces.length+'</b> CEs · '+
    'filtered revenue <b>'+fmtMoney(totRev)+'</b>'+
    (state.sortKey==='__mover'?' · sorted by <b>|Δ rev WoW|</b> (top movers first)':'')+
    (rf?' · <b>'+hotN+'</b> row(s) match rule <b>'+esc(state.rule)+'</b>':'')+
    ' · <b>'+getWatch().size+'</b> watched · <b>'+Object.keys(getGroups()).length+'</b> custom group(s)';
}

/* ---------- (P2) contribution strip — per-group Δ-rev-WoW diverging bars ----------
   Only shown when grouped. Bar length ∝ |Δ rev WoW|; the index badge =
   share-of-move ÷ share-of-revenue (>1.5× = the group punches above its weight).
   Clicking a bar expands + scrolls to its group. */
function renderContributionStrip(rows){
  const box=document.getElementById('ceStrip'); if(!box) return;
  if(!state.group){ box.innerHTML=''; return; }
  const gk=state.group;
  const glabel = gk==='__mygrp' ? 'my group' : (gk==='__bucket' ? 'diagnostic bucket' : gk);
  const groups={};
  rows.forEach(r=>{ const v=groupValueOf(r); (groups[v]=groups[v]||[]).push(r); });
  const stats=Object.keys(groups).map(gv=>{
    const gr=groups[gv];
    const rev0=gr.reduce((s,r)=>s+(r.w0.revenue||0),0);
    const dwk=gr.reduce((s,r)=>s+(r.dwk||0),0);
    return {val:gv, rev0:rev0, dwk:dwk};
  });
  const totRev=stats.reduce((s,g)=>s+g.rev0,0)||1;
  const totAbsMove=stats.reduce((s,g)=>s+Math.abs(g.dwk),0)||1;
  // MATERIALITY FLOOR: the "punch above weight" index = share-of-move ÷
  // share-of-revenue is unstable for tiny-revenue groups — a small $ move on a
  // near-zero base explodes the ratio (e.g. Unmanaged $3.8K → 35×, pure noise).
  // Show the index only for groups holding >=3% of revenue; everyone gets the
  // always-stable contribution-% (share of revenue).
  const IDX_MIN_REV_SHARE=0.03;
  stats.forEach(g=>{ g.shRev=g.rev0/totRev;
    const shMove=Math.abs(g.dwk)/totAbsMove;
    g.idx = g.shRev>=IDX_MIN_REV_SHARE ? shMove/g.shRev : null; });
  const maxAbs=Math.max.apply(null,stats.map(g=>Math.abs(g.dwk)).concat([1]));
  const bars=stats.slice().sort((a,b)=>Math.abs(b.dwk)-Math.abs(a.dwk)).slice(0,10).map(g=>{
    const neg=g.dwk<0, w=(Math.abs(g.dwk)/maxAbs*48).toFixed(1);
    const ic=g.idx==null?'mute':(g.idx>=1.5?(neg?'hot':'warm'):'mute');
    const cpct=g.shRev*100;
    return '<div class="sbar" data-gstrip="'+esc(gk+'|'+g.val)+'">'+
      '<span class="k">'+esc(g.val)+'</span>'+
      '<span class="strack"><span class="mid"></span><span class="sfill '+(neg?'n':'p')+'" style="width:'+w+'%"></span></span>'+
      '<span class="d '+sgn(g.dwk)+'">'+fmtMoneyDelta(g.dwk)+
        '<span class="idx mute" title="contribution to revenue">'+cpct.toFixed(cpct>=10?0:1)+'% rev</span>'+
        (g.idx!=null?'<span class="idx '+ic+'" title="share of WoW move ÷ share of revenue">'+g.idx.toFixed(1)+'×</span>':'')+
      '</span></div>';
  }).join('');
  box.innerHTML='<div class="strip"><div class="sh">What drove the week — by <b>'+esc(glabel)+
    '</b> · Δ Rev WoW <span class="muted">% rev = contribution to revenue · idx = share-of-move ÷ share-of-revenue (groups ≥3% rev only)</span></div>'+
    '<div class="sbars">'+bars+'</div></div>';
}

/* ---------- BGM: saved-views chips + custom-group builder wiring ---------- */
function renderViewChips(){
  const box=document.getElementById('viewChips'); if(!box) return;
  const views=getViews();
  box.innerHTML=views.map((v,i)=>'<span class="vchip'+(activeView===i?' on':'')+'" data-view="'+i+'">'+
    esc(v.name)+'<span class="del" data-delview="'+i+'" title="delete view">✕</span></span>').join('');
}
function applyView(i){
  const v=getViews()[i]; if(!v) return;
  const s=v.st||{};
  state.search=s.search||''; state.group=s.group||''; state.sortKey=s.sortKey||'__mover';
  state.dir=s.dir==null?-1:s.dir; state.watchOnly=!!s.watchOnly; state.rule=s.rule||'';
  state.filters=JSON.parse(JSON.stringify(s.filters||{}));
  activeView=i;
  renderApp();          // rebuild controls to reflect restored state
}
function saveCurrentView(){
  const name=(prompt('Name this view:')||'').trim(); if(!name) return;
  const views=getViews();
  views.push({name:name, st:{search:state.search, group:state.group, sortKey:state.sortKey,
    dir:state.dir, watchOnly:state.watchOnly, rule:state.rule, filters:state.filters}});
  setViews(views); activeView=views.length-1; renderViewChips();
}
function deleteView(i){
  const views=getViews(); views.splice(i,1); setViews(views);
  if(activeView===i) activeView=null; else if(activeView>i) activeView--;
  renderViewChips();
}
function refreshGroupList(){
  const el=document.getElementById('grpList'); if(!el) return;
  const names=Object.keys(getGroups());
  el.textContent=names.length?('Groups: '+names.join(', ')):'No custom groups yet.';
}
// any manual control change breaks the "active view" highlight
function markDirty(){ activeView=null; renderViewChips(); }

/* =====================================================================
   SECTION 4 — Bucket 1 fluctuations
   ===================================================================== */
function dirChip(d){ return d==='up'?'<span class="chip green">▲ up-swing</span>':'<span class="chip red">▼ down-swing</span>'; }
function _moveChip(m){
  const c = (m==='EXIT') ? 'green' : (m==='ESCALATION'||m==='CLIFF') ? 'red' : (m==='NEW') ? 'amber' : 'ghost';
  return '<span class="chip '+c+'">'+esc(m)+'</span>';
}
function _laneChip(lane, label){
  const c = lane==='a' ? 'green' : lane==='b' ? 'amber' : 'blue';
  return '<span class="chip '+c+'">'+esc(label)+'</span>';
}
function _causeChip(t){
  const c = t==='unexplained' ? 'red' : t==='input-induced' ? 'ghost' : t==='supply-linked' ? 'amber' : 'green';
  return '<span class="chip '+c+'">'+esc(t)+'</span>';
}
function _bucketBlock(tag, title, sub, body){
  return '<div style="margin-top:20px"><div class="sec-head" style="border:0">'+
    '<span class="sec-num" style="background:var(--ink)">'+tag+'</span><h2 style="font-size:19px">'+title+'</h2>'+
    '<span class="sub">'+sub+'</span></div>'+body+'</div>';
}
function _tbl(head, bodyRows){
  return '<div class="tablewrap"><table><thead><tr>'+head+'</tr></thead><tbody>'+bodyRows+'</tbody></table></div>';
}

// SECTION 4 — Diagnostic buckets (B1 ROI/CM2 · B2 CM1/Conv · B3 Losing Ground · B4 Scale)
function renderBuckets(M){
  const BF=M.buckets_final||{};
  const D=BF.defend||{}, C=BF.compound||{}, L=BF.lifecycle||{};
  const LM=D.losing_money||{}, bleeders=LM.bleeders||[], recovered=LM.recovered||[], fullWaste=LM.full_waste||[], paused=LM.paused||[], trackingGap=LM.tracking_gap||[], burn=LM.burn_line||{};
  const seasDn=D.seasonality_down||[], seasUp=C.seasonality_up||[], scale=C.scale_up||[];
  const newCes=L.new_ces||[], iters=L.iteration||[];
  const ceBy={}; (M.ces||[]).forEach(c=>ceBy[c.ce_id]=c);
  const rev10=id=>{const c=ceBy[id]; return (c&&c.weekly)?c.weekly.slice(-10).map(w=>w.revenue):[];};
  const chip=(cls,txt)=>'<span class="chip '+cls+'">'+esc(txt)+'</span>';
  const tierChip=t=>{ if(t==null||(''+t).toLowerCase()==='none') return '—'; const c=({hero:'green',pro:'blue',seed:'amber',longtail:'ghost'})[(''+t).toLowerCase()]||'ghost'; return chip(c,t); };
  const lmStatus=s=>{ const u=(''+s).toUpperCase(); const c=(u==='ESCALATING'||u==='CHRONIC')?'red':(u==='NEW'||u==='NW')?'blue':'amber'; return chip(c,s); };
  const verdictChip=v=>chip(v==='+ve'?'green':v==='-ve'?'red':'ghost', v||'—');
  const causeChip=t=>{ if(!t) return '—'; const c=t==='unexplained'?'red':t==='input-induced'?'ghost':t==='supply-linked'?'amber':'green'; return chip(c,t); };
  const ppDelta=v=>(v==null||isNaN(v))?'—':((v>0?'+':(v<0?MINUS:''))+Math.abs(v).toFixed(0)+'pp');
  const colr=(v,txt)=>{ const c=v<=-25?'var(--red)':v<=-10?'var(--amber)':'var(--green)'; return '<span style="color:'+c+'">'+txt+'</span>'; };
  const rpcVs4w=(rpc,v)=>{ const base=(rpc==null||isNaN(rpc))?'—':(+rpc).toFixed(2); if(v==null||isNaN(v)) return base; const s=v<0?MINUS:'+'; return base+' '+colr(v,'('+s+Math.abs(v).toFixed(0)+'% 4w)'); };
  const swingCell=(sig,sw)=>{ sig=esc(sig||''); if(sw==null||isNaN(sw)) return (sig+' —').trim(); const ar=sw>=0?'↑':'↓'; const col=sw>=0?'var(--green)':'var(--red)'; const inner='<span style="color:'+col+'">'+ar+Math.abs(sw).toFixed(0)+'%</span>'; return sig?sig+' '+inner:inner; };
  const winAbbr=w=>(({sustained_3d:'3d',wow:'WoW',sdlw:'SDLW'})[w])||(w||'');
  const dsub=txt=>' <span class="d" style="color:var(--ink-faint)">('+txt+')</span>';
  const tierMini=t=>(['Hero','Pro','Seed','Longtail'].indexOf(''+t)>=0)?' '+tierChip(t):'';
  // Explore-layer info tag: FORWARD-LOOKING season phase (builds-to-peak / in-peak / winding-down / off)
  const seasonTag=id=>{ const s=(ceBy[id]||{}).season; if(!s||!s.note) return '';
    const m=({peak:['☀','amber'],pre:['↗','green'],post:['↘','ghost'],off:['❄','blue'],unknown:['·','ghost']})[s.phase]||['·','ghost'];
    const tip=(s.peak?('peak '+esc(s.peak)+' · '):'')+esc(s.state||'')+' now';
    return ' <span class="chip '+m[1]+'" title="'+tip+'">'+m[0]+' '+esc(s.note)+'</span>'; };
  // Δrev decomposition: lead driver inline; "+N" expands the remaining factors in-row (no drawer)
  const drvCell=r=>{ const fs=(r.factor_deltas||[]).filter(f=>f.usd!=null&&Math.abs(f.usd)>=1); if(!fs.length) return '—';
    const seg=f=>{ const u=f.usd,col=u>=0?'var(--green)':'var(--red)',ar=u>=0?'↑':'↓'; return '<span style="color:'+col+'">'+ar+esc(f.label)+' '+fmtMoney(Math.abs(u))+'</span>'; };
    const d=fs.find(f=>f.label===r.dominant)||fs[0]; const rest=fs.filter(f=>f!==d);
    if(!rest.length) return '<b>'+seg(d)+'</b>';
    return '<div><b>'+seg(d)+'</b><span class="fxexp" data-n="'+rest.length+'">+'+rest.length+'</span></div>'+
      '<div class="fxfull" style="display:none">'+rest.map(seg).join(' · ')+'</div>'; };
  const dualSpark=id=>{ const ce=ceBy[id]||{}; const ty=(ce.weekly||[]).slice(-10).map(w=>w.revenue), ly=(ce.weekly_ly||[]).slice(-10).map(w=>w.revenue); return kmSparkline('fx_'+id, ty, ly); };
  const fluxCbar=items=>{ if(!items.length) return '';
    const net=items.reduce((s,r)=>s+(+r.delta_rev||0),0);
    const nv=items.filter(r=>r.verdict==='-ve').length, np=items.filter(r=>r.verdict==='+ve').length, nh=items.filter(r=>r.verdict==='hold').length;
    const reason=[nv?nv+' −ve':'',np?np+' +ve':'',nh?nh+' hold':''].filter(Boolean).join(' · ');
    return cbar(items.length,'Net Δ Rev wk',fmtMoneyDelta(net),sgn(net),reason); };
  const cbar=(n,ml,mv,mc,reason)=>'<div class="cbar"><span class="cbar-k">Cohort ('+n+' CEs)</span>'+
    '<div class="cbar-m"><span class="cbar-l">'+ml+'</span><span class="cbar-v '+(mc||'')+'">'+mv+'</span></div>'+
    (reason?'<div class="cbar-r">'+reason+'</div>':'')+'</div>';

  // DEFEND - Losing Money — value-over-Δ cells, dual-ROI, CM2 sparkline, full-waste band,
  // paused/feed-gap/burn footnotes. All Δ4w vs prior-4 (mean-of-weekly, matches the report).
  const lmU=s=>(''+s).toUpperCase();
  const lmTier=t=>(t==='Hero'||t==='Pro')?' <span class="chip ghost">'+t+'</span>':'';
  // value-over-Δ cell. good:+1 up-good, -1 down-good, 0 neutral(gray). dp decimals, pre/suf affixes.
  const lmVD=(val,delta,o)=>{ o=o||{}; const good=o.good==null?1:o.good, dp=o.dp==null?0:o.dp, pre=o.pre||'', suf=o.suf||'', u=o.pp?'pp':'%';
    const v=(val==null||isNaN(val))?'—':pre+(+val).toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp})+suf;
    if(delta==null||isNaN(delta)) return '<div class="lmv">'+v+'</div>';
    const r=Math.round(delta), s=delta>0?'+':MINUS;
    if(good===0||r===0){ const t=(r===0)?('0'+u):(s+Math.abs(delta).toFixed(0)+u); return '<div class="lmv">'+v+'</div><div class="lmd mut">'+t+'</div>'; }
    const fav=good>0?(delta>0):(delta<0);
    return '<div class="lmv">'+v+'</div><div class="lmd '+(fav?'gp':'gn')+'">'+s+Math.abs(delta).toFixed(0)+u+'</div>'; };
  // ROI dual: value + WoW pp + 4w pp (labeled in-cell). neg Δ = red(gn), pos = green(gp).
  const lmRoi=(val,wow,v4)=>{ if(val==null||isNaN(val)) return '<div class="lmv">—</div>';
    const seg=(dv,lbl)=>{ if(dv==null||isNaN(dv)) return '<span class="lmd mut">— '+lbl+'</span>';
      if(Math.round(dv)===0) return '<span class="lmd mut">0pp '+lbl+'</span>';
      return '<span class="lmd '+(dv<0?'gn':'gp')+'">'+(dv>0?'+':MINUS)+Math.abs(dv).toFixed(0)+'pp '+lbl+'</span>'; };
    return '<div class="lmv">'+Math.round(val)+'%</div><div style="line-height:1.35">'+seg(wow,'WoW')+'<br>'+seg(v4,'4w')+'</div>'; };
  // CM2 bleed: /wk rate + 4w total
  const lmCm2=(w,f)=>'<div class="lmv neg">'+fmtMoneyDelta(w)+'<span class="lm-hb"> /wk</span></div><div class="lmd mut">'+fmtMoneyDelta(f)+' 4w</div>';
  // Spend: value + Δ4w %; ↑ amber if spend ramped >25% WoW on a bleeder (up = bad on a bleeder)
  const lmSpend=r=>{ const wk=r.spend_wk,dvs=r.spend_dvs4,wow=r.spend_wow, val=fmtMoney(wk);
    const ramp=(wow!=null&&wow>25);
    const top=ramp?'<div class="lmv" style="color:var(--amber)" title="spend +'+Math.round(wow)+'% vs last week — ramping on a bleeder">↑ '+val+'</div>':'<div class="lmv">'+val+'</div>';
    let dd=''; if(dvs!=null&&!isNaN(dvs)){ const r0=Math.round(dvs); dd=(r0===0)?'<div class="lmd mut">0%</div>':'<div class="lmd '+(dvs>0?'gn':'gp')+'">'+(dvs>0?'+':MINUS)+Math.abs(dvs).toFixed(0)+'%</div>'; }
    return top+dd; };
  const lmCEcell=r=>'<span class="cn">'+esc(r.ce_name)+'</span> <span class="idbr">['+esc(r.ce_id)+']</span>'+lmTier(r.tier)+seasonTag(r.ce_id);
  const lmHead='<th class="stick">Combined Entity</th><th>Status</th><th class="num">Paid ROI <span class="lm-hb">WoW · 4w</span></th><th class="num">CM2 bleed <span class="lm-hb">/wk · 4w</span></th><th class="num">Spend <span class="lm-hb">Δ4w</span></th><th class="num">RPC <span class="lm-hb">Δ4w</span></th><th class="num">CPC <span class="lm-hb">Δ4w</span></th><th class="num">Clicks <span class="lm-hb">Δ4w</span></th><th class="num">TR% <span class="lm-hb">Δ4w</span></th><th>CM2 trend 12w</th>';
  const lmRow=(r,cls,statusCell,ceSub)=>'<tr class="cerow'+(cls?' '+cls:'')+'" data-ce="'+esc(r.ce_id)+'">'+
      '<td class="ce stick">'+lmCEcell(r)+(ceSub||'')+'</td>'+
      '<td>'+statusCell+'</td>'+
      '<td class="num">'+lmRoi(r.roi,r.roi_dpp,r.roi_v4)+'</td>'+
      '<td class="num">'+lmCm2(r.cm2_bleed_wk,r.cm2_bleed_4w)+'</td>'+
      '<td class="num">'+lmSpend(r)+'</td>'+
      '<td class="num">'+lmVD(r.rpc,r.rpc_v4,{good:1,dp:2,pre:'$'})+'</td>'+
      '<td class="num">'+lmVD(r.cpc,r.cpc_v4,{good:-1,dp:2,pre:'$'})+'</td>'+
      '<td class="num">'+lmVD(r.clicks,r.clicks_v4,{good:0})+'</td>'+
      '<td class="num">'+lmVD(r.tr_pct,r.tr_v4,{good:1,pp:true,suf:'%'})+'</td>'+
      '<td>'+cm2Spark(r.cm2_series,r.cm2_weeks)+'</td></tr>';
  const lmHowto='<div class="lm-howto"><b>How to read:</b> ranked worst-first by 4-week CM2 bled. <b>Full-waste</b> rows (spend, 0 conversions) are pure loss — kill first. Then a bleeder that&rsquo;s <b>Escalating</b> or <b>Chronic</b> with rising spend and RPC decaying is the scale-down priority. Rule of thumb: <b>3–4 weeks bleeding with no recovery lever → scale down within the week.</b></div>';
  const lmLegend='<div class="lm-legend"><span class="chip red">FULL WASTE</span>spend, 0 conversions &nbsp;·&nbsp; <span class="chip blue">NEW</span>1st week &lt;100% &nbsp;·&nbsp; <span class="chip amber">2–5w</span>weeks bleeding &nbsp;·&nbsp; <span class="chip red">CHRONIC</span>≥6 weeks &nbsp;·&nbsp; <span class="chip red">ESCALATING</span>ROI dropped &gt;30pp WoW</div>';
  let lmBody;
  if(!bleeders.length && !fullWaste.length){ lmBody='<div class="emptystate">No CEs bleeding above the $1k / 4-week gate. <b>✅</b></div>'; }
  else{
    const lmTotal=bleeders.concat(fullWaste).reduce((s,r)=>s+(+r.cm2_bleed_wk||0),0);
    const nEsc=bleeders.filter(r=>lmU(r.status)==='ESCALATING').length, nChr=bleeders.filter(r=>lmU(r.status)==='CHRONIC').length, nNew=bleeders.filter(r=>lmU(r.status)==='NEW'||lmU(r.status)==='NW').length;
    const lmReason=[fullWaste.length?fullWaste.length+' full-waste':'',nEsc?nEsc+' escalating':'',nChr?nChr+' chronic':'',nNew?nNew+' new':''].filter(Boolean).join(' · ');
    const wasteRows=fullWaste.map(r=>lmRow(r,'lm-waste','<span class="chip red">FULL WASTE</span>',
        '<div class="idbr" style="margin-top:3px">0 paid conversions on '+fmtMoney(r.spend_4w)+' (4w) — total loss</div>')).join('');
    const bleedRows=bleeders.map(r=>lmRow(r,'',lmStatus(r.status)+'<div class="idbr" style="margin-top:2px">'+(r.weeks||0)+'w bleeding</div>')).join('');
    lmBody=cbar(fullWaste.length+bleeders.length,'Total CM2 bleed/wk',fmtMoneyDelta(lmTotal),'neg',lmReason)+
      lmHowto+lmLegend+_tbl(lmHead, wasteRows+bleedRows);
  }
  let lmFn='';
  if(recovered.length){ lmFn+='<div class="sub" style="margin-top:6px;color:var(--green)"><b>✅ '+recovered.length+' recovered:</b> '+recovered.map(r=>esc(r.ce_name)+' ('+fmtPct(r.roi,0)+', was bleeding '+r.was_bleeding_wks+'w)').join(' · ')+'</div>'; }
  if(paused.length){ lmFn+='<div class="sub" style="margin-top:6px;color:var(--ink-soft)"><b>⏸ '+paused.length+' paused this week (was funded 4w):</b> '+paused.map(r=>esc(r.ce_name)+' ('+fmtMoney(r.spend_4w)+' 4w, '+fmtInt(r.orders_4w)+' orders)').join(' · ')+' — spend stopped, ROI reads null. Confirm the pause was intentional.</div>'; }
  if(trackingGap.length){ lmFn+='<div class="sub" style="margin-top:6px;color:var(--amber)"><b>⚠️ '+trackingGap.length+' null-ROI — feed gap (verify tracking):</b> '+trackingGap.map(r=>esc(r.ce_name)+' ('+fmtInt(r.orders_4w)+' orders, '+fmtMoney(r.spend_4w)+' 4w)').join(' · ')+' — spending &amp; converting, but current-week CM1 didn&rsquo;t populate. NOT waste.</div>'; }
  if(burn.count){ const bn=esc((burn.names||[]).join(', ')); lmFn+='<div class="sub" style="margin-top:6px" title="'+bn+'">+ '+burn.count+' sub-$1k CEs bleeding <span class="neg">'+fmtMoneyDelta(burn.bleed_wk)+'/wk</span> below the individual gate <span style="color:var(--ink-faint)">(hover for names)</span></div>'; }

  // Fluctuations — clean value(Δ) layout, dominant driver inline (full 5 on hover), dual TY/LY spark
  const fluxHead='<th class="stick">Combined Entity</th><th>Swing (vs 28d)</th><th class="num">Paid ROI</th><th class="num">Δ Rev wk</th><th>Δrev by factor</th><th class="num">Spend</th><th class="num">YoY</th><th>Verdict · Action</th><th>Rev &rsquo;26 v &rsquo;25</th>';
  const fluxRows=items=>items.map(r=>'<tr class="cerow" data-ce="'+esc(r.ce_id)+'">'+
    '<td class="ce stick"><span class="cn">'+esc(r.ce_name)+'</span> <span class="idbr">['+esc(r.ce_id)+']</span>'+seasonTag(r.ce_id)+''+tierMini(r.tier)+'</td>'+
    '<td>'+swingCell(r.signal,r.swing_pct)+(r.window?dsub(winAbbr(r.window)):'')+'</td>'+
    '<td class="num">'+fmtPct(r.roi,0)+dsub('2wk '+fmtPct(r.roi_2wk,0))+'</td>'+
    '<td class="num '+sgn(r.delta_rev)+'">'+fmtMoneyDelta(r.delta_rev)+'</td>'+
    '<td>'+drvCell(r)+'</td>'+
    '<td class="num">'+fmtMoney(r.spend_wk)+dsub(fmtPct(r.paid_pct,0)+' paid')+'</td>'+
    '<td class="num '+sgn(r.yoy)+'">'+fmtDelta(r.yoy,0)+'</td>'+
    '<td><div>'+verdictChip(r.verdict)+' '+causeChip(r.cause)+'</div><div class="idbr" style="margin-top:3px">'+esc(r.recommendation||'—')+'</div></td>'+
    '<td>'+dualSpark(r.ce_id)+'</td></tr>').join('');
  const seasDnBody=seasDn.length?(fluxCbar(seasDn)+_tbl(fluxHead,fluxRows(seasDn))):'<div class="emptystate">No CM1/RPC fluctuation ↓ signals. <b>✅</b></div>';
  const seasUpBody=seasUp.length?(fluxCbar(seasUp)+_tbl(fluxHead,fluxRows(seasUp))):'<div class="emptystate">No CM1/RPC fluctuation ↑ signals.</div>';

  // COMPOUND - Scale-Up — clean value(Δ) layout + cohort bar + dual spark
  let scaleBody;
  if(!scale.length){ scaleBody='<div class="emptystate">No CEs clearing ROI ≥155% (≥3-of-4 wk).</div>'; }
  else{
    const scTotal=scale.reduce((s,r)=>s+(+r.est_incremental_wk||0),0), nSeas=scale.filter(r=>r.seasonality_flag).length;
    scaleBody=cbar(scale.length,'Est incremental/wk',fmtMoneyDelta(scTotal),'pos',(nSeas?nSeas+' seasonality-flagged':'all structural'))+
      _tbl('<th class="stick">Combined Entity</th><th class="num">Paid ROI 4w</th><th class="num">vs tROAS</th><th class="num">Est +/wk</th><th class="num">Spend 4w</th><th>RPC</th><th class="num">CVR</th><th>Rev &rsquo;26 v &rsquo;25</th>',
      scale.map(r=>{ const flag=r.seasonality_flag?' '+chip('green','seas↑'):'';
        const rvc=(r.rpc_vs_cat!=null)?dsub(fmtDelta(r.rpc_vs_cat,0)+' cat'):'';
        return '<tr class="cerow" data-ce="'+esc(r.ce_id)+'">'+
          '<td class="ce stick"><span class="cn">'+esc(r.ce_name)+'</span> <span class="idbr">['+esc(r.ce_id)+']</span>'+seasonTag(r.ce_id)+''+tierMini(r.tier)+'</td>'+
          '<td class="num">'+fmtPct(r.roi_agg4,0)+dsub((r.wks_ge_155||0)+'/4 ≥155')+'</td>'+
          '<td class="num '+sgn(r.pp_vs_troas)+'">'+ppDelta(r.pp_vs_troas)+flag+dsub('tROAS '+fmtPct(r.troas,0))+'</td>'+
          '<td class="num pos"><b>'+fmtMoney(r.est_incremental_wk)+'</b></td>'+
          '<td class="num">'+fmtMoney(r.spend_4w)+'</td>'+
          '<td>'+((r.rpc==null)?'—':'$'+(+r.rpc).toFixed(2))+rvc+'</td>'+
          '<td class="num">'+fmtPct(r.cvr_pct,1)+'</td>'+
          '<td>'+dualSpark(r.ce_id)+'</td></tr>'; }).join(''));
  }

  // LIFECYCLE - New CEs
  const newLane={A_graduated:['New Pro+','green'],B_on_pace:['On pace → Pro','blue']};
  let newBody;
  if(!newCes.length){ newBody='<div class="emptystate">No CEs newly Pro+ or on pace to Pro.</div>'; }
  else{
    const nGrad=newCes.filter(r=>r.lane==='A_graduated').length, nPace=newCes.filter(r=>r.lane==='B_on_pace').length;
    newBody=cbar(newCes.length,'New Pro+',nGrad,'',(nPace+' on pace to Pro'))+
      _tbl('<th class="stick">Combined Entity</th><th>Lane</th><th>Band</th><th class="num" title="Months since the CE first paid Google-Ads click (earliest report_date with clicks over 0, Google Ads only). NOT the Headout launch/creation date — understates age for CEs that ran on Bing or grew organically first.">Mo since launch ⓘ</th><th class="num">Run-rate/mo</th><th class="num">Paid ROI</th><th class="num">Δ Rev WoW</th><th class="num">Clicks</th><th class="num">RPC</th><th>Rev &rsquo;26 v &rsquo;25</th>',
      newCes.map(r=>{ const ln=newLane[r.lane]||[r.lane,'ghost'];
        return '<tr class="cerow" data-ce="'+esc(r.ce_id)+'">'+
          '<td class="ce stick"><span class="cn">'+esc(r.ce_name)+'</span> <span class="idbr">['+esc(r.ce_id)+']</span>'+seasonTag(r.ce_id)+'</td>'+
          '<td>'+chip(ln[1],ln[0])+'</td><td><b>'+esc(r.band||'—')+'</b></td>'+
          '<td class="num">'+(r.mo_since_launch==null?'<span class="idbr">—</span>':'<b>'+r.mo_since_launch+'</b>mo')+'</td>'+
          '<td class="num">'+fmtMoney(r.run_rate_mo)+dsub((r.dollars_to_pro>0?fmtMoney(r.dollars_to_pro)+' to Pro':'at Pro+'))+'</td>'+

// dual-line sparkline: TY solid (green/red by net dir) + optional LY dashed grey,
// shared scale across both series. Returns SVG markup carrying a data-k hook so
// hover tooltips can be wired after the HTML is injected.
function kmSparkline(kId, ty, ly){
  const W=150,H=30,PAD=3;
  const tyN=ty.map(v=>(v==null||isNaN(v))?null:+v);
  const lyN=ly?ly.map(v=>(v==null||isNaN(v))?null:+v):null;
  const all=tyN.concat(lyN||[]).filter(v=>v!=null);
  if(all.length<2) return '<svg class="spark" width="'+W+'" height="'+H+'"></svg>';
  const lo=Math.min.apply(null,all), hi=Math.max.apply(null,all), rng=(hi-lo)||1, n=tyN.length;
  const X=i=>PAD+(W-2*PAD)*(i/(n-1)), Y=v=>H-PAD-(H-2*PAD)*((v-lo)/rng);
  const poly=arr=>arr.map((v,i)=>v==null?null:X(i).toFixed(1)+','+Y(v).toFixed(1)).filter(Boolean).join(' ');
  const tyPresent=tyN.filter(v=>v!=null);
  const up=tyPresent[tyPresent.length-1]>=tyPresent[0];
  const col=up?'var(--green)':'var(--red)';
  let lastI=n-1; while(lastI>=0 && tyN[lastI]==null) lastI--;
  const dot = lastI>=0 ? '<circle cx="'+X(lastI).toFixed(1)+'" cy="'+Y(tyN[lastI]).toFixed(1)+'" r="2.2" fill="'+col+'"/>' : '';
  const lyLine = (lyN && lyN.filter(v=>v!=null).length>=2)
    ? '<polyline fill="none" stroke="var(--ink-faint)" stroke-width="1.3" stroke-dasharray="3 2" points="'+poly(lyN)+'"/>' : '';
  return '<svg class="spark" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" data-k="'+esc(kId)+'" style="cursor:crosshair">'+
    lyLine+
    '<polyline fill="none" stroke="'+col+'" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" points="'+poly(tyN)+'"/>'+
    dot+
    '<line class="cursor" x1="0" y1="0" x2="0" y2="'+H+'" stroke="var(--ink)" stroke-width="1" opacity="0"/>'+
    '</svg>';
}
// format a value by metric type (money / pct / count) — matches mockup formatters
function kmFmt(v,t){
  if(v==null||isNaN(v)) return '—';
  if(t==='money'){ const a=Math.abs(v);
    if(a>=1e6) return '$'+(v/1e6).toFixed(2)+'M'; if(a>=1e3) return '$'+(v/1e3).toFixed(1)+'K'; return '$'+Math.round(v); }
  if(t==='cpc') return '$'+(+v).toFixed(2);   // CPC/RPC — always cents (double-decimal)
  if(t==='pct') return (+v).toFixed(2)+'%';
  if(t==='count'){ const a=Math.abs(v); return a>=1e3?(v/1e3).toFixed(1)+'K':''+Math.round(v); }
  return ''+v;
}
// Δ-abs formatting: ratio metrics in pp, money in $, counts raw.
function kmDeltaAbs(v,t){
  if(v==null||isNaN(v)) return '—';
  const s=v>0?'+':(v<0?MINUS:''); const a=Math.abs(v);
  if(t==='pct') return s+a.toFixed(2)+'pp';
  if(t==='money'){ if(a>=1e6) return s+'$'+(a/1e6).toFixed(2)+'M'; if(a>=1e3) return s+'$'+(a/1e3).toFixed(1)+'K'; return s+'$'+Math.round(a); }
  if(a>=1e3) return s+(a/1e3).toFixed(1)+'K';
  return s+Math.round(a);
}
// map metric id -> display format bucket
const KM_FMT = { revenue:'money', gbv:'money', orders:'count', aov:'money', cr_pct:'pct', tr_pct:'pct',
  paid_clicks:'count', paid_cvr:'pct', paid_conv_value:'money', avg_cm1:'money', paid_roi:'pct', roi1:'pct' };
const KM_ORDER = ['revenue','gbv','orders','aov','cr_pct','tr_pct','paid_clicks','paid_cvr','paid_conv_value','avg_cm1','paid_roi','roi1'];
const KM_PAID = new Set(['paid_clicks','paid_cvr','paid_conv_value','avg_cm1','paid_roi']);

    km[bf.key]={w0:v0, wm1:v1, delta_abs:da!=null?+da.toFixed(2):null,

      '<td>'+kmFmt(m.wm1,t)+'</td>'+

  const kmBlock=''+
    '<div class="dr-sec-t" style="display:flex;align-items:baseline;gap:10px">'+
      '<span>Key metrics · 12-week trend</span>'+
      '<span class="km-legend"><span><i></i>This year</span><span><i class="ly"></i>Last year</span><span>hover for values</span></span>'+
    '</div>'+
    '<table class="km"><thead><tr><th>Metric</th><th>W0</th><th>W-1</th><th>Δ abs</th><th>Δ %</th>'+
      '<th class="spk">12-wk · TY vs LY</th></tr></thead><tbody>'+rowsHtml+'</tbody></table>'+
    '<div class="dr-cap">Solid = this year, dashed = last year (same 12 weeks, −364d), shared scale per metric.'+
