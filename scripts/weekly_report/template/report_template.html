    const bars=factors.map(f=>{
      const v=sh[f], pos=v>=0, w=Math.max(2,Math.round(Math.abs(v)/maxAbs*48));
      return '<div class="shaprow"><span class="k">'+esc(labs[f]||f)+'</span>'+
        '<div class="barwrap"><div class="mid"></div><div class="bar '+(pos?'p':'n')+'" style="width:'+w+'%"></div></div>'+
        '<span class="d '+sgn(v)+'">'+fmtMoneyDelta(v)+'</span></div>';
    }).join('');
    const net = sh.net_delta!=null ? sh.net_delta : sh.total;
    shapBlock=''+
      '<div class="dr-sec-t">WoW Shapley — what drove the '+fmtMoneyDelta(net)+'</div>'+
      bars+
      '<div class="shapnet"><span>Net WoW</span><span class="'+sgn(net)+'">'+fmtMoneyDelta(net)+'</span></div>'+
      '<div class="dr-cap">5-factor decomposition of the WoW revenue move (USD). Bars diverge from centre: red = drag, green = lift.</div>';
  }

  // ----- Pacing (deferred) -----
  const paceBlock=''+
    '<div class="dr-sec-t">Pacing <span class="chip ghost" style="text-transform:none;letter-spacing:0;font-weight:600">awaiting goals data</span></div>'+
    '<div class="pace">'+
      '<div class="pacecard"><div class="l">MTD attainment (adj)</div><div class="v">—</div></div>'+
      '<div class="pacecard"><div class="l">Target attainment</div><div class="v">—</div></div>'+
    '</div>'+
    '<div class="dr-cap">Lights up when the revenue_goals join is wired — MoM / target % at market level.</div>';

  document.getElementById('drawer').innerHTML=
    '<div class="dr-head"><button class="close" id="drClose">×</button>'+
      '<div class="kick">Market headline · detail</div>'+
      '<h2>'+esc(M.meta.market)+'</h2>'+
      '<div class="mono" style="font-size:12px;color:var(--ink-faint);margin-top:-4px">wk '+esc(M.meta.week_start)+'</div>'+
    '</div>'+
    '<div class="dr-body">'+
      '<div class="bignum" style="font-size:38px;margin-top:2px">'+fmtMoney(h.revenue_w0)+'</div>'+
      '<div style="font-family:var(--sans);font-size:13px;color:var(--ink-soft);margin-top:2px">'+
        '<span class="'+sgn(wowPct)+'">'+fmtDelta(wowPct)+' WoW</span> · '+
        '<span class="'+sgn(yoyPct)+'">'+fmtDelta(yoyPct)+' YoY</span> (−364d, weekday-aligned) · predicted revenue</div>'+
      kmBlock + shapBlock + paceBlock +
    '</div>';

  document.getElementById('drClose').onclick=closeDrawer;
  wireKmHover(km, weeks, wkly, wklyLy);

  const dr=document.getElementById('drawer');
  dr.classList.add('open','wide');
  dr.setAttribute('aria-hidden','false');
  document.getElementById('scrim').classList.add('open');
}

// hover tooltip on each key-metric sparkline (week · TY · LY · YoY%)
function wireKmHover(km, weeks, wkly, wklyLy){
  const tip=document.getElementById('kmtip');
  document.querySelectorAll('#drawer svg[data-k]').forEach(svg=>{
    const k=svg.dataset.k, m=km[k]; if(!m) return;
    const t=KM_FMT[k]||'money';
    const ty = m.field ? wkly.map(w=>w[m.field]) : [];
    const ly = (m.has_ly && m.ly_field) ? wklyLy.map(w=>w[m.ly_field]) : null;
    const cursor=svg.querySelector('.cursor');
    const n=ty.length, W=150, PAD=3;
    svg.addEventListener('mousemove',e=>{
      const r=svg.getBoundingClientRect(); const rel=(e.clientX-r.left)/r.width;
      let i=Math.round(rel*(n-1)); i=Math.max(0,Math.min(n-1,i));
      const x=PAD+(W-2*PAD)*(i/(n-1));
      cursor.setAttribute('x1',x); cursor.setAttribute('x2',x); cursor.setAttribute('opacity','0.35');
      const tyv=ty[i], lyv=ly?ly[i]:null;
      let yoy='';
      if(lyv!=null && lyv!==0 && tyv!=null){ const p=100*(tyv/lyv-1);
        yoy='<div class="yoy '+(p>=0?'pos':'neg')+'">YoY '+(p>=0?'+':MINUS)+Math.abs(p).toFixed(1)+'%</div>'; }
      tip.innerHTML='<div class="wk">'+esc(weeks[i]||'')+(i===n-1?' · W0':'')+'</div>'+
        '<div class="r"><span class="k">'+esc(m.label)+' TY</span><span class="ty">'+kmFmt(tyv,t)+'</span></div>'+
        '<div class="r"><span class="k">LY</span><span class="ly">'+(ly?kmFmt(lyv,t):'n/a')+'</span></div>'+yoy;
      tip.style.opacity='1';
      tip.style.left=Math.min(e.clientX+14, window.innerWidth-190)+'px';
      tip.style.top=(e.clientY-10)+'px';
    });
    svg.addEventListener('mouseleave',()=>{ tip.style.opacity='0'; cursor.setAttribute('opacity','0'); });
  });
}

];
const CE_METRICS = CE_METRICS_OVERALL;

// pp delta (percentage-point) with explicit sign — for funnel rate stages.
function ppDelta(v){ if(v==null||isNaN(v)) return '—';
  return (v>0?'+':(v<0?MINUS:''))+Math.abs(v).toFixed(1)+'pp'; }

/* --- TGID table with Sheets-style band collapse (Size / Value / Funnel /
   Booking window). Collapse a band to a thin strip to tame width. State is
   global so it persists across CE drawer opens; re-renders #tgidWrap in place. */
let tgBands={size:false,value:false,funnel:false,lt:false};   // true = collapsed
let _drawerCe=null;
const _cc=(main,d,kind)=>{ let sub='';
  if(d!=null && !isNaN(d)){ const txt=kind==='pp'?ppDelta(d):fmtDelta(d,0); sub='<div class="cc-d '+sgn(d)+'">'+txt+'</div>'; }
  return '<div class="cc-v">'+main+'</div>'+sub; };
const _shareCell=(v,w,y)=>{ const p=[];
  if(w!=null&&!isNaN(w)) p.push('<span class="'+sgn(w)+'">'+ppDelta(w)+'</span>');
  if(y!=null&&!isNaN(y)) p.push('<span class="'+sgn(y)+'">'+ppDelta(y)+'y</span>');
  const sub=p.length?'<div class="cc-d">'+p.join(' / ')+'</div>':''; return '<div class="cc-v">'+fmtPct(v,0)+'</div>'+sub; };
const TGID_COLS={
  rev:{label:'Rev',r:t=>_cc(fmtMoney(t.rev),t.rev_wow)},
  wm1:{label:'W-1',r:t=>fmtMoney(t.rev_wm1)},
  orders:{label:'Orders',r:t=>_cc(fmtInt(t.orders),t.orders_wow)},
  share:{label:'Share',r:t=>_shareCell(t.share_pct,t.share_wow_pp,t.share_yoy_pp)},
  rpc:{label:'RPC',r:t=>_cc(fmtMoney(t.rpc),t.rpc_wow)},
  aov:{label:'AOV',r:t=>_cc(fmtMoney(t.aov),t.aov_wow)},
  cr:{label:'CR',r:t=>_cc(fmtPct(t.cr_pct,1),t.cr_wow_pp,'pp')},
  tr:{label:'TR',r:t=>_cc(fmtPct(t.tr_pct,1),t.tr_wow_pp,'pp')},
  sel:{label:'Sel Users',r:t=>fmtInt(t.sel_users)},
  traf:{label:'%Traf',r:t=>fmtPct(t.traffic_pct,0)},
  s2c:{label:'S2C',r:t=>_cc(fmtPct(t.s2c_pct,1),t.s2c_wow_pp,'pp')},
  c2o:{label:'C2O',r:t=>_cc(fmtPct(t.c2o_pct,1),t.c2o_wow_pp,'pp')},
  lt02:{label:'%0-2D',r:t=>_cc(fmtPct(t.lt_02d,0),t.lt_02d_wow,'pp')},
  lt37:{label:'%3-7D',r:t=>_cc(fmtPct(t.lt_37d,0),t.lt_37d_wow,'pp')},
  lt7:{label:'%7D+',r:t=>_cc(fmtPct(t.lt_7p,0),t.lt_7p_wow,'pp')},
};
const TGID_BANDS=[
  {k:'size',  label:'Size',           cols:['rev','wm1','orders','share']},
  {k:'value', label:'Value',          cols:['rpc','aov','cr','tr']},
  {k:'funnel',label:'Funnel',         cols:['sel','traf','s2c','c2o']},
  {k:'lt',    label:'Booking window',  cols:['lt02','lt37','lt7']},
];
function renderTgidTable(ce){
  const tg=ce.tgids||[]; if(!tg.length) return '';
  let bh='<th class="lft" rowspan="2">Experience</th>', ch='';
  TGID_BANDS.forEach(b=>{
    if(tgBands[b.k]){ bh+='<th class="tgband coll" data-tgband="'+b.k+'" rowspan="2" title="expand '+esc(b.label)+'">▶ '+esc(b.label)+'</th>'; }
    else { bh+='<th class="tgband" data-tgband="'+b.k+'" colspan="'+b.cols.length+'" title="collapse '+esc(b.label)+'"><span class="tgcaret">▼</span> '+esc(b.label)+'</th>';
      ch+=b.cols.map((ck,i)=>'<th'+(i===0?' class="bandstart"':'')+'>'+TGID_COLS[ck].label+'</th>').join(''); }
  });
  const body=tg.map(t=>{
    let tds='<td class="lft">'+esc(t.experience)+' <span class="mono" style="color:var(--ink-faint)">'+esc(t.tgid)+'</span></td>';
    TGID_BANDS.forEach(b=>{
      if(tgBands[b.k]) tds+='<td class="coll" data-tgband="'+b.k+'" title="expand '+esc(b.label)+'">···</td>';
      else b.cols.forEach((ck,i)=>{ tds+='<td'+(i===0?' class="bandstart"':'')+'>'+TGID_COLS[ck].r(t)+'</td>'; });
    });
    return '<tr>'+tds+'</tr>';
  }).join('');
  return '<div class="tgid-scroll"><table class="dr-table plain tgid-tbl">'+
    '<thead><tr class="tgbandrow">'+bh+'</tr><tr>'+ch+'</tr></thead><tbody>'+body+'</tbody></table></div>'+
    '<div class="dr-cap">Value = W0 week (actuals); W-1 = prior week. Small line = WoW (W0 vs W-1); rate metrics (CR/TR/S2C/C2O) in pp. '+
    'Share sub-line = WoW / YoY pp shift (the "y" tag marks YoY). RPC = revenue per select-user (= S2O × AOV × CR × TR). '+
    'Click a band header (Size / Value / Funnel / Booking window) to collapse it.</div>';
}

/* RE-SOURCE tier — the 5 composition tables between Shapley and Notes.
   Reads ce.channels / .funnel / .tgids / .leadtime / .countries straight off
   the mart (schema v1). Each section renders only when it has data; a CE with
   no W0 activity simply omits them (graceful degrade). Order matches the
   ce_drawer_complete mockup. */
function resourceBlocks(ce){
  // Each builder returns section HTML (header + table) or '' when empty.
  const sec=(title, tableHtml)=>tableHtml
    ? '<div class="dr-sec-t">'+title+'</div>'+tableHtml : '';

  // ---- Channel mix ----
  const ch=ce.channels||[];
  const channelTbl = ch.length ?
    '<table class="dr-table plain"><thead><tr><th>Channel</th><th>Rev</th><th>W-1</th><th>WoW</th><th>YoY</th><th>Share</th></tr></thead><tbody>'+
    ch.map(c=>'<tr><td>'+esc(c.channel)+'</td>'+
      '<td>'+fmtMoney(c.rev)+'</td>'+
      '<td>'+fmtMoney(c.rev_wm1)+'</td>'+
      '<td class="'+sgn(c.wow_pct)+'">'+fmtDelta(c.wow_pct,0)+'</td>'+
      '<td class="'+sgn(c.yoy_pct)+'">'+fmtDelta(c.yoy_pct,0)+'</td>'+
      '<td>'+fmtPct(c.share_pct,0)+'</td></tr>').join('')+
    '</tbody></table>' : '';

  // ---- Funnel ----
  const fn=ce.funnel||{};
  const stages=['LP Users','LP2S','S2C','C2O','CVR'].filter(s=>fn[s]);
  const funnelTbl = stages.length ?
    '<table class="dr-table plain"><thead><tr><th>Stage</th><th>W0</th><th>W-1</th><th>WoW</th><th>YoY</th></tr></thead><tbody>'+
    stages.map(s=>{
      const v=fn[s], isUsers=(s==='LP Users');
      const cur=isUsers?fmtInt(v.current):fmtPct(v.current,1);
      const prev=isUsers?fmtInt(v.wm1):fmtPct(v.wm1,1);
      const wf=isUsers?fmtDelta(v.wow,0):ppDelta(v.wow);
      const yf=isUsers?fmtDelta(v.yoy,0):ppDelta(v.yoy);
      return '<tr><td>'+esc(s)+'</td><td>'+cur+'</td><td>'+prev+'</td>'+
        '<td class="'+sgn(v.wow)+'">'+wf+'</td>'+
        '<td class="'+sgn(v.yoy)+'">'+yf+'</td></tr>';
    }).join('')+
    '</tbody></table>' : '';

  // ---- Lead-time ----
  const lt=ce.leadtime||[];
  const leadtimeTbl = lt.length ?
    '<table class="dr-table plain"><thead><tr><th>Band</th><th>Bookings</th><th>W-1</th><th>Share</th><th>Rev</th><th>AOV</th></tr></thead><tbody>'+
    lt.map(l=>'<tr><td>'+esc(l.band)+'</td>'+
      '<td>'+fmtInt(l.bookings)+'</td>'+
      '<td>'+fmtInt(l.bookings_wm1)+'</td>'+
      '<td>'+fmtPct(l.share_pct,0)+'</td>'+
      '<td>'+fmtMoney(l.rev)+'</td>'+
      '<td>'+fmtMoney(l.aov)+'</td></tr>').join('')+
    '</tbody></table>' : '';

  // ---- Countries ----
  const ct=ce.countries||[];
  const countriesTbl = ct.length ?
    '<table class="dr-table plain"><thead><tr><th>Country</th><th>Orders</th><th>WoW</th><th>Rev</th><th>WoW</th><th>Share</th><th>AOV</th></tr></thead><tbody>'+
    ct.slice(0,6).map(c=>'<tr><td>'+esc(c.country)+'</td>'+
      '<td>'+fmtInt(c.orders)+'</td>'+
      '<td class="'+sgn(c.orders_wow)+'">'+fmtDelta(c.orders_wow,0)+'</td>'+
      '<td>'+fmtMoney(c.rev)+'</td>'+
      '<td class="'+sgn(c.rev_wow)+'">'+fmtDelta(c.rev_wow,0)+'</td>'+
      '<td>'+fmtPct(c.rev_share_pct,0)+'</td>'+
      '<td>'+fmtMoney(c.aov)+'</td></tr>').join('')+
    '</tbody></table>' : '';

  // ---- TGIDs (band-collapsible, enriched) ----
  const tg=ce.tgids||[];
  let tgidHtml='';
  if(tg.length){
    tgidHtml='<div class="dr-sec-t">Top experiences (TGIDs)</div>'+
      '<div id="tgidWrap">'+renderTgidTable(ce)+'</div>';
  }

  // Compose: full-width sections stacked — Channel · Funnel · TGIDs · Lead-time · Countries
  let html='';
  html+=sec('Channel mix', channelTbl);
  html+=sec('Funnel · LP → order', funnelTbl);
  html+=tgidHtml;
  html+=sec('Lead-time bands', leadtimeTbl);
  html+=sec('Top countries', countriesTbl);

  if(html){
    html+='<div class="dr-cap">Composition for the W0 week. Channel mix &amp; lead-time use actual (booked) revenue; '+
      'shares are within-CE. Channel &amp; funnel carry WoW (vs W-1) and YoY (−364d); funnel rate deltas are in pp.</div>';
  }
  return html;
}

let drawerTimer=null;
function openDrawer(ceId){
  const M=MARKETS[mi];
  const ce=M.ces.find(c=>c.ce_id===ceId);
  if(!ce){ return; }  // mover/campaign CE not in ces[] (e.g. aggregate) — ignore
  _drawerCe=ce;   // for in-place TGID band-collapse re-render
  const r=ceRow(ce), md=ce.metadata, wk=ce.weekly, w0=r.w0, w1=r.w1;
  const wkLy=ce.weekly_ly||null;
  const weeks=wk.map(w=>w.week);
  const chips=[['category',md.category],['subcategory',md.subcategory],['city',md.city],
    ['management_type',md.management_type],['evolution',md.evolution],['new_vs_existing',md.new_vs_existing],['tier',md.tier]]
    .filter(x=>x[1]).map(x=>'<span class="chip ghost">'+esc(x[1])+'</span>').join('');
  const watched=getWatch().has(ceId);

  // ----- key-metrics tables (Overall + Paid tabs, W0 / W-1 / Δ% + 12-wk TY/LY spark + hover) -----
  function buildKmRows(specs){
    return specs.map(mm=>{
      const ty = wk.map(x=>x[mm.k]);
      const ly = (mm.ly && wkLy) ? wkLy.map(x=>x[mm.ly]) : null;
      const cur=w0?w0[mm.k]:null, prev=w1?w1[mm.k]:null;
      const dpct=(prev!=null && prev!==0 && cur!=null)?(cur-prev)/Math.abs(prev)*100:null;
      const spk = kmSparkline('ce_'+mm.k, ty, ly) + (ly?'':'<div class="lyna">LY n/a</div>');
      return '<tr><td>'+esc(mm.label)+'</td>'+
        '<td class="w0">'+kmFmt(cur,mm.fmt)+'</td>'+
        '<td>'+kmFmt(prev,mm.fmt)+'</td>'+
        '<td class="'+sgn(dpct)+'">'+fmtDelta(dpct)+'</td>'+
        '<td class="spk">'+spk+'</td></tr>';
    }).join('');
  }
  const overallRows=buildKmRows(CE_METRICS_OVERALL);
  const paidRows=buildKmRows(CE_METRICS_PAID);
  const kmTable=specs=>'<table class="km"><thead><tr><th>Metric</th><th>W0</th><th>W-1</th><th>Δ %</th>'+
    '<th class="spk">12-wk · TY vs LY</th></tr></thead><tbody>'+specs+'</tbody></table>';
  const kmBlock=''+
    '<div class="dr-sec-t" style="display:flex;align-items:baseline;gap:10px">'+
      '<span>Key metrics · 12-week trend</span>'+
      '<span class="km-legend"><span><i></i>This year</span><span><i class="ly"></i>Last year</span><span>hover for values</span></span>'+
    '</div>'+
    '<div class="ce-km-tabs" style="display:flex;gap:6px;margin-bottom:8px">'+
      '<button class="btn ce-km-tab on" data-tab="overall">Overall</button>'+
      '<button class="btn ce-km-tab" data-tab="paid">Paid</button>'+
    '</div>'+
    '<div id="ceKmOverall">'+kmTable(overallRows)+'</div>'+
    '<div id="ceKmPaid" style="display:none">'+kmTable(paidRows)+'</div>'+
    '<div class="dr-cap">Solid = this year, dashed = last year (same 12 weeks, −364d), shared scale per metric. '+
      'Metrics without an LY line have no comparable −364d window yet. Paid = Google Search + Bing; SIS is Google Search only.</div>';

  // ----- WoW Shapley (reuse market-drawer pattern; hide when null) -----
  let shapBlock='';
  const sh=ce.shapley_wow;
  if(sh){
    const labs=sh.labels||{};
    const factors=['traffic','cvr','aov','cr','tr'].filter(f=>sh[f]!=null);
    const maxAbs=Math.max.apply(null,factors.map(f=>Math.abs(sh[f]))) || 1;
    const bars=factors.map(f=>{
      const v=sh[f], pos=v>=0, w=Math.max(2,Math.round(Math.abs(v)/maxAbs*48));
      return '<div class="shaprow"><span class="k">'+esc(labs[f]||f)+'</span>'+
        '<div class="barwrap"><div class="mid"></div><div class="bar '+(pos?'p':'n')+'" style="width:'+w+'%"></div></div>'+
        '<span class="d '+sgn(v)+'">'+fmtMoneyDelta(v)+'</span></div>';
    }).join('');
    const net = sh.net_delta!=null ? sh.net_delta : sh.total;
    shapBlock=''+
      '<div class="dr-sec-t">WoW Shapley — what drove the '+fmtMoneyDelta(net)+'</div>'+
      bars+
      '<div class="shapnet"><span>Net WoW</span><span class="'+sgn(net)+'">'+fmtMoneyDelta(net)+'</span></div>'+
      '<div class="dr-cap">5-factor decomposition of the WoW revenue move (USD). Bars diverge from centre: red = drag, green = lift.</div>';
  }

  const cur=noteFor(ceId);
  const curText=cur&&cur.note?cur.note:'';
  const curWhen=cur&&cur.updated?'saved '+new Date(cur.updated).toLocaleString():'not saved yet';
  const hist=historyFor(ceId);
  const ch=channelFor(M.meta.market_slug);
  const hasThread=!!(cur&&cur.slack_thread_ts);
  const NOTE_MAX=600;

  const histHtml = hist.length ? (
    '<button class="hist-toggle" id="histToggle"><span class="caret" id="histCaret">▶</span> History ('+hist.length+')</button>'+
    '<div class="hist-list" id="histList">'+
      hist.map(h=>'<div class="hist-entry"><div class="hist-when">'+esc(h.week_start)+' · '+esc(h.author||'—')+
        (h.slack_permalink?' · <a class="hist-link" href="'+esc(h.slack_permalink)+'" target="_blank">thread ↗</a>':'')+
        '</div><div class="hist-text">'+esc(h.note)+'</div></div>').join('')+
    '</div>'
  ) : '';

  const postBtnHtml = ch ? (
    hasThread
      ? '<a class="btn btn-thread" id="postBtn" href="'+esc(cur.slack_permalink||'#')+'" target="_blank">View thread in #'+esc(ch.name)+' <span class="arr">→</span></a>'
      : '<button class="btn btn-post" id="postBtn">Post to #'+esc(ch.name)+'</button>'
  ) : '';

  document.getElementById('drawer').innerHTML=
    '<div class="dr-head"><button class="close" id="drClose">×</button>'+
      '<div class="kick">CE deep dive · '+esc(M.meta.market)+' · '+esc(ce.ce_id)+
        ' · <a class="omni" href="'+omniLink(ce.ce_id)+'" target="_blank" rel="noopener">Open in Omni ↗</a></div>'+
      '<h2>'+esc(ce.ce_name)+'</h2><div class="dr-chips">'+chips+'</div></div>'+
    '<div class="dr-body">'+
      '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px">'+
        '<div class="bignum" style="font-size:38px;margin-top:2px">'+fmtMoney(w0.revenue)+'</div>'+
        '<span class="star drawer-star'+(watched?' on':'')+'" data-star="'+esc(ceId)+'" title="watchlist" '+
          'style="font-size:24px">'+(watched?'★':'☆')+'</span>'+
      '</div>'+
      '<div style="font-family:var(--sans);font-size:13px;color:var(--ink-soft);margin-top:2px">'+
        '<span class="'+sgn(r.wow)+'">'+fmtDelta(r.wow)+' WoW</span> · '+
        '<span class="'+sgn(w0.yoy_pct)+'">'+fmtDelta(w0.yoy_pct)+' YoY</span> (−364d, weekday-aligned) · predicted revenue</div>'+
      kmBlock + shapBlock + resourceBlocks(ce) + ceSlackContext(ce.ce_id) +
      '<div class="dr-sec-t"><span>Notes</span><span id="syncBadge" class="sync-badge"></span></div>'+
      '<div class="gm-note-card">'+
        '<div class="gm-note-head">'+
          '<span class="gm-note-title"><span class="icon">📝</span> GM note'+
            '<span class="gm-note-meta">W/C '+esc(curWeek())+(getAuthor()?' · '+esc(getAuthor()):'')+'</span></span>'+
          '<span class="gm-note-hint">one note per CE · visible to all · carries forward</span>'+
        '</div>'+
        '<input type="text" class="cmt-author" id="cmtAuthor" placeholder="Your name" value="'+esc(getAuthor())+'">'+
        '<div class="gm-textarea-wrap"><textarea class="gm-textarea" id="cmtText" maxlength="'+NOTE_MAX+'" '+
          'placeholder="What is happening with this CE that the data cannot see?">'+esc(curText)+'</textarea></div>'+
        '<div class="gm-actions">'+
          '<button class="btn btn-save" id="cmtSave">Save</button>'+
          '<button class="btn btn-clear" id="cmtClear">Clear</button>'+
          postBtnHtml+
          '<span class="char-count" id="charCount"></span>'+
        '</div>'+
        '<div class="cmt-meta" style="margin-top:8px"><span id="cmtSaved" class="cmt-saved">'+esc(curWhen)+'</span></div>'+
        histHtml+
      '</div>'+
    '</div>';

  // Show drawer immediately — event wiring failures must not block visibility
  document.getElementById('drawer').classList.add('open','wide');
  document.getElementById('drawer').setAttribute('aria-hidden','false');
  document.getElementById('scrim').classList.add('open');

  try {
  document.getElementById('drClose').onclick=closeDrawer;
  // Tab switching for Overall / Paid
  document.querySelectorAll('.ce-km-tab').forEach(btn=>{
    btn.onclick=()=>{
      document.querySelectorAll('.ce-km-tab').forEach(b=>b.classList.remove('on'));
      btn.classList.add('on');
      const tab=btn.dataset.tab;
      document.getElementById('ceKmOverall').style.display=tab==='overall'?'':'none';
      document.getElementById('ceKmPaid').style.display=tab==='paid'?'':'none';
      wireCeKmHover(ce, weeks, wk, wkLy);
    };
  });
  wireCeKmHover(ce, weeks, wk, wkLy);
  const ta=document.getElementById('cmtText');
  const authorIn=document.getElementById('cmtAuthor');
  const cc=document.getElementById('charCount');
  const NOTE_MAX2=600;
  function paintCount(){ const n=ta.value.length; cc.textContent=n+' / ~'+NOTE_MAX2;
    cc.className='char-count'+(n>NOTE_MAX2*0.9?' warn':''); }
  paintCount();
  ta.addEventListener('input',paintCount);
  authorIn.addEventListener('change',()=>{ setAuthor(authorIn.value); });

  document.getElementById('cmtSave').onclick=()=>{
    const btn=document.getElementById('cmtSave');
    saveNote(ceId, ta.value).then(()=>{
      document.getElementById('cmtSaved').textContent='saved '+new Date().toLocaleString();
    });
    btn.textContent='Saved ✓'; btn.classList.add('saved');
    setTimeout(()=>{ btn.textContent='Save'; btn.classList.remove('saved'); },1500);
    paintCETable();   // refresh ● dot
  };
  document.getElementById('cmtClear').onclick=()=>{
    const had=ta.value.trim().length>0;
    ta.value=''; paintCount();
    if(had && confirm('Delete this week’s note for this CE?')){
      deleteNote(ceId).then(()=>{
        document.getElementById('cmtSaved').textContent='deleted';
        paintCETable();
      });
    } else { ta.focus(); }
  };

  const postBtn=document.getElementById('postBtn');
  if(postBtn && postBtn.classList.contains('btn-post')){
    postBtn.onclick=()=>{
      if(!ta.value.trim()){ ta.focus(); return; }
      postBtn.textContent='Posting…'; postBtn.classList.add('posting');
      // Save first so the sheet always holds what was broadcast, then post.
      saveNote(ceId, ta.value)
        .then(()=>postNote(ceId, ta.value))
        .then(res=>{ openDrawer(ceId); })   // re-render → button becomes "View thread"
        .catch(err=>{ postBtn.textContent='Post failed'; postBtn.classList.remove('posting');
          console.error('post failed:', err); });
    };
  }
  updateSyncBadge();

  const histT=document.getElementById('histToggle');
  if(histT) histT.onclick=()=>{
    document.getElementById('histList').classList.toggle('open');
    document.getElementById('histCaret').classList.toggle('open');
  };
  // watchlist star MIRROR — same per-market watchlist as the row star.
  const dstar=document.querySelector('#drawer .drawer-star');
  if(dstar) dstar.onclick=()=>{ toggleWatch(ceId); const on=getWatch().has(ceId);
    dstar.classList.toggle('on',on); dstar.textContent=on?'★':'☆'; paintCETable(); };
  } catch(err) { console.error('openDrawer wiring error:', err); }
}

// hover tooltip on each CE key-metric sparkline (week · TY · LY · YoY%).
// Mirrors wireKmHover but reads TY/LY straight off the CE weekly arrays.
function wireCeKmHover(ce, weeks, wk, wkLy){
  const tip=document.getElementById('kmtip');
  document.querySelectorAll('#drawer svg[data-k]').forEach(svg=>{
    const key=svg.dataset.k;                 // "ce_<field>"
    const mm=CE_METRICS_OVERALL.find(x=>'ce_'+x.k===key)||CE_METRICS_PAID.find(x=>'ce_'+x.k===key); if(!mm) return;
    const t=mm.fmt;
    const ty = wk.map(x=>x[mm.k]);
    const ly = (mm.ly && wkLy) ? wkLy.map(x=>x[mm.ly]) : null;
    const cursor=svg.querySelector('.cursor');
    const n=ty.length, W=150, PAD=3;
    svg.addEventListener('mousemove',e=>{
      const rc=svg.getBoundingClientRect(); const rel=(e.clientX-rc.left)/rc.width;
      let i=Math.round(rel*(n-1)); i=Math.max(0,Math.min(n-1,i));
      const x=PAD+(W-2*PAD)*(i/(n-1));
      cursor.setAttribute('x1',x); cursor.setAttribute('x2',x); cursor.setAttribute('opacity','0.35');
      const tyv=ty[i], lyv=ly?ly[i]:null;
      let yoy='';
      if(lyv!=null && lyv!==0 && tyv!=null){ const p=100*(tyv/lyv-1);
        yoy='<div class="yoy '+(p>=0?'pos':'neg')+'">YoY '+(p>=0?'+':MINUS)+Math.abs(p).toFixed(1)+'%</div>'; }
      tip.innerHTML='<div class="wk">'+esc(weeks[i]||'')+(i===n-1?' · W0':'')+'</div>'+
        '<div class="r"><span class="k">'+esc(mm.label)+' TY</span><span class="ty">'+kmFmt(tyv,t)+'</span></div>'+
        '<div class="r"><span class="k">LY</span><span class="ly">'+(ly?kmFmt(lyv,t):'n/a')+'</span></div>'+yoy;
      tip.style.opacity='1';
      tip.style.left=Math.min(e.clientX+14, window.innerWidth-190)+'px';
      tip.style.top=(e.clientY-10)+'px';
    });
    svg.addEventListener('mouseleave',()=>{ tip.style.opacity='0'; cursor.setAttribute('opacity','0'); });
  });
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open','wide');
  document.getElementById('drawer').setAttribute('aria-hidden','true');
  document.getElementById('scrim').classList.remove('open');
  const tip=document.getElementById('kmtip'); if(tip) tip.style.opacity='0';
  paintCETable();   // refresh comment dots
}
function exportNotes(){
  const M=MARKETS[mi], prefix='wr_comments::'+M.meta.market_slug+'::', out={};
  for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i);
    if(k.indexOf(prefix)===0) out[k.slice(prefix.length)]=JSON.parse(localStorage.getItem(k)); }
  // also carry the BGM customizations for this market (views / groups / watchlist / rule)
  const custom={ views:getViews(), groups:getGroups(), watch:Array.from(getWatch()), rule:lsGet('rule','') };
  const review=getMarketReview();
  const blob=new Blob([JSON.stringify({market:M.meta.market_slug,exported:new Date().toISOString(),notes:out,customizations:custom,market_review:review},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='wr_notes_'+M.meta.market_slug+'.json'; a.click(); URL.revokeObjectURL(a.href);
}
function importNotes(ev){
  const f=ev.target.files[0]; if(!f) return;
  const reader=new FileReader();
  reader.onload=()=>{ try{ const obj=JSON.parse(reader.result); const M=MARKETS[mi];
    const prefix='wr_comments::'+M.meta.market_slug+'::'; const notes=obj.notes||obj;
    Object.keys(notes).forEach(ceId=>{ localStorage.setItem(prefix+ceId, JSON.stringify(notes[ceId])); });
    // restore BGM customizations if present
    const c=obj.customizations;
    if(c){ if(c.views) setViews(c.views); if(c.groups) setGroups(c.groups);
      if(c.watch) setWatch(new Set(c.watch)); if(c.rule!=null) lsSet('rule', c.rule); }
    if(obj.market_review) saveMarketReview(obj.market_review.text||'');
    alert('Imported '+Object.keys(notes).length+' note(s)'+(c?' + customizations':'')+(obj.market_review?' + market review':'')+'.');
    activeView=null; renderApp();
  }catch(e){ alert('Could not parse that file.'); } };
  reader.readAsText(f);
}

/* =====================================================================
   TABS + wiring
   ===================================================================== */
function renderTabs(){
  document.getElementById('tabs').innerHTML=MARKETS.map((M,i)=>{
    const rev=M.market_summary.headlines.revenue_w0;
    return '<div class="tab'+(i===mi?' active':'')+'" data-mi="'+i+'">'+esc(M.meta.market)+
      '<span class="trev">'+fmtMoney(rev)+'</span></div>';
  }).join('');
}
function renderMeta(){
  const M=MARKETS[mi];
  const mt=document.getElementById('mastTitle'); if(mt) mt.textContent=M.meta.market;
  document.getElementById('mastMeta').innerHTML=
    '<span>Market: <b>'+esc(M.meta.market)+'</b></span>'+
    '<span>Week: '+esc(M.meta.week_start)+' → '+esc(M.meta.week_end)+'</span>'+
    '<span>12-week window · weekly grain</span>'+
    '<span>Generated '+esc((M.meta.generated_at||'').slice(0,10))+'</span>';
  document.getElementById('footnote').innerHTML=
    'Weekly Market Report V1 · schema v'+(M.meta.schema_version||1)+' · net revenue basis (amount_revenue_usd) · '+
    'CM1 = offline contribution margin · ROI = CM1/spend · YoY weekday-aligned (−364d) · data ≥3 days matured. '+
    'Nulls render “—” (organic CEs have no paid ROI/CVR), never 0. Comments persist locally per market×CE.';
}
function renderApp(){
  const M=MARKETS[mi];
  document.getElementById('app').innerHTML=
    renderHead(M)+renderFollowup(M)+renderAllCE(M)+renderBuckets(M)+renderSeasonality(M)+renderLevers(M);
  paintCETable();
  renderViewChips();       // (1) saved views bar
  refreshGroupList();      // (2) custom-group builder list
  wireMarketReview();      // in case the review pane is visible
}
function switchMarket(i){ if(i===mi) return; mi=i; closeDrawer();
  state.search=''; state.group=''; state.filters={}; state.sortKey='__mover'; state.dir=-1;
  state.watchOnly=false; state.selMode=false; sel.clear(); activeView=null;
  state.rule=lsGet('rule','');   // restore last-used highlight rule for this market
  renderTabs(); renderMeta(); renderApp(); window.scrollTo(0,0);
  syncPull();   // load this market's notes (cache first, then sheet)
}

// delegated events
document.getElementById('tabs').addEventListener('click',e=>{
  const t=e.target.closest('.tab'); if(t) switchMarket(+t.dataset.mi); });
document.getElementById('scrim').addEventListener('click',closeDrawer);
// TGID band collapse/expand — re-render just the TGID table in place
document.getElementById('drawer').addEventListener('click',e=>{
  const b=e.target.closest('[data-tgband]');
  if(b && _drawerCe){ const k=b.dataset.tgband; tgBands[k]=!tgBands[k];
    const wrap=document.getElementById('tgidWrap'); if(wrap) wrap.innerHTML=renderTgidTable(_drawerCe); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrawer(); });
document.getElementById('app').addEventListener('click',e=>{
  // --- collapsible section: explicit Show/Hide button ---
  const tog=e.target.closest('.sec-btn');
  if(tog){
    const sec=tog.closest('.collapsible');
    if(sec){ const open=sec.classList.toggle('collapsed')===false;
      tog.setAttribute('aria-expanded', open?'true':'false');
      if(open){ const rev=sec.querySelector('.s2tab[data-s2tab="review"].active'); if(rev) wireMarketReview(); } }
    return;
  }
  // --- Section 2 sub-tabs (Follow-up / Market Review) ---
  const s2t=e.target.closest('.s2tab');
  if(s2t && s2t.dataset.s2tab){
    document.querySelectorAll('.s2tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.s2pane').forEach(p=>p.classList.remove('active'));
    s2t.classList.add('active');
    const pane=document.getElementById('s2-'+s2t.dataset.s2tab);
    if(pane) pane.classList.add('active');
    // wire market review textarea auto-save when switching to the review tab
    if(s2t.dataset.s2tab==='review') wireMarketReview();
    return;
  }
  // --- (1) saved views ---
  if(e.target.dataset && e.target.dataset.delview!=null){ deleteView(+e.target.dataset.delview); return; }
  const vc=e.target.closest && e.target.closest('.vchip');
  if(vc && vc.dataset.view!=null){ applyView(+vc.dataset.view); return; }
  if(e.target.id==='saveView'){ saveCurrentView(); return; }
  // --- (3) watchlist star toggle ---
  if(e.target.dataset && e.target.dataset.star!=null){ e.stopPropagation(); toggleWatch(e.target.dataset.star); paintCETable(); return; }
  // --- (3) watchlist-only filter ---
  if(e.target.id==='watchOnly'){ state.watchOnly=!state.watchOnly; markDirty(); renderApp(); return; }
  // --- (2) select mode + custom groups ---
  if(e.target.id==='selMode'){ state.selMode=!state.selMode; if(!state.selMode) sel.clear(); renderApp(); return; }
  if(e.target.id==='clearSel'){ sel.clear(); paintCETable(); const n=document.getElementById('selN'); if(n) n.textContent=0; return; }
  if(e.target.id==='addGrp'){
    const nm=(document.getElementById('grpName').value||'').trim();
    if(!nm){ alert('Name the group first.'); return; }
    if(!sel.size){ alert('Select at least one CE (checkboxes) first.'); return; }
    const g=getGroups(); g[nm]=Array.from(new Set((g[nm]||[]).concat(Array.from(sel)))); setGroups(g);
    sel.clear(); document.getElementById('grpName').value=''; renderApp(); return;
  }
  // --- (P2) contribution-strip bar → expand + scroll to that group ---
  const sb=e.target.closest && e.target.closest('.sbar');
  if(sb && sb.dataset.gstrip!=null){ const ck=sb.dataset.gstrip;
    state.collapsed[ck]=false; paintCETable();
    const gh=document.querySelector('tr.grouprow[data-group="'+ck.replace(/"/g,'\\"')+'"]');
    if(gh) gh.scrollIntoView({behavior:'smooth',block:'center'});
    return; }
  // --- (P2) collapse/expand a single group ---
  const gt=e.target.closest && e.target.closest('td.gtoggle');
  if(gt && gt.dataset.gtoggle!=null){ const ck=gt.dataset.gtoggle;
    state.collapsed[ck]=!state.collapsed[ck]; paintCETable(); return; }
  // --- (P2) collapse all / expand all ---
  if(e.target.id==='collapseGroups'){ toggleAllGroups(); return; }
  // controls
  if(e.target.id==='moverSort'){ state.sortKey='__mover'; state.dir=-1; markDirty(); paintCETable(); return; }
  if(e.target.id==='ceReset'){ state.search=''; state.group=''; state.filters={}; state.sortKey='__mover'; state.dir=-1;
    state.watchOnly=false; state.rule=''; state.selMode=false; state.expand={}; sel.clear(); activeView=null; renderApp(); return; }
  if(e.target.id==='monthlyLink'){ e.preventDefault();
    alert('Links out to the monthly deep-dive report (separate build). Monthly data never loads in this weekly view.'); return; }
  if(e.target.id==='moreFilters' || (e.target.closest && e.target.closest('#moreFilters'))){ state.filtersOpen=!state.filtersOpen; renderApp(); return; }
  const bkc=e.target.closest('[data-bkt]');
  if(bkc){ const tag=bkc.dataset.bkt; const arr=state.filters.__bkt=state.filters.__bkt||[];
    const i=arr.indexOf(tag); if(i>=0) arr.splice(i,1); else arr.push(tag);
    if(!arr.length) delete state.filters.__bkt; markDirty(); renderApp(); return; }
  const fc=e.target.closest('.fchip');
  if(fc){ const dim=fc.dataset.fdim, val=fc.dataset.fval; const arr=state.filters[dim]=state.filters[dim]||[];
    const idx=arr.indexOf(val); if(idx>=0) arr.splice(idx,1); else arr.push(val);
    if(!arr.length) delete state.filters[dim]; markDirty(); renderApp(); return; }
  // metric expand/collapse toggle (must come before sort — it lives inside the header)
  const et=e.target.closest('[data-expand]');
  if(et){ const k=et.dataset.expand; state.expand[k]=!state.expand[k]; markDirty(); paintCETable(); return; }
  if(e.target.id==='expandMetrics'){ const on=anyMetricExpanded(); METRIC_COLS.forEach(m=>state.expand[m.k]=!on); markDirty(); paintCETable(); return; }
  const sortEl=e.target.closest('[data-sort]');
  if(sortEl){ const k=sortEl.dataset.sort; if(state.sortKey===k) state.dir*=-1; else { state.sortKey=k; state.dir=(k==='name'?1:-1); } markDirty(); paintCETable(); return; }
  // Section-1 headline card → market drawer
  const mcard=e.target.closest('[data-market-drawer]');
  if(mcard){ openMarketDrawer(); return; }
  // Δrev-by-factor in-row expander (must precede the row→drawer fallback)
  const fx=e.target.closest && e.target.closest('.fxexp');
  if(fx){ const cell=fx.closest('td'); const full=cell&&cell.querySelector('.fxfull');
    if(full){ const shown=full.style.display!=='none';
      full.style.display=shown?'none':'block'; fx.textContent=shown?('+'+fx.dataset.n):'− hide'; }
    return; }
  // row / mover click → CE drawer (but not when clicking the select checkbox or the star)
  if(e.target.dataset && e.target.dataset.selce!=null) return;
  const el=e.target.closest('[data-ce]');
  if(el){ openDrawer(el.dataset.ce); }
});
// keyboard: Enter/Space on the focused headline card opens the market drawer
document.getElementById('app').addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ') && e.target.closest && e.target.closest('[data-market-drawer]')){
    e.preventDefault(); openMarketDrawer(); }
});
document.getElementById('app').addEventListener('input',e=>{
  if(e.target.id==='ceSearch'){ state.search=e.target.value; markDirty(); paintCETable(); return; }
  if(e.target.id==='ceRule'){ state.rule=e.target.value; lsSet('rule', state.rule); markDirty(); paintCETable(); return; }  // (3) highlight rule
});
document.getElementById('app').addEventListener('change',e=>{
  if(e.target.id==='ceGroup'){ state.group=e.target.value; markDirty(); renderApp(); return; }
  // (2) select-mode row checkbox
  if(e.target.dataset && e.target.dataset.selce!=null){
    const id=e.target.dataset.selce; e.target.checked?sel.add(id):sel.delete(id);
    const n=document.getElementById('selN'); if(n) n.textContent=sel.size; return;
  }
});

// boot
state.rule=lsGet('rule','');   // restore last-used highlight rule for the first market
renderTabs(); renderMeta(); renderApp();
syncPull();
</script>
